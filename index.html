<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1a1a1a; color: white; }
    #chat { height: 400px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; background: #2a2a2a; border-radius: 8px; }
   .msg { margin: 8px 0; }
   .user { text-align: right; color: #4fc3f7; }
   .sibo { text-align: left; color: #81c784; }
    #input { width: 70%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; }
    #send { padding: 10px 15px; background: #ff6f00; border: none; color: white; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h3>Pura vida mae, soy Sibö 🇨🇷</h3>
  <div id="chat"></div>
  <input id="input" placeholder="Pregúntame algo mae..." />
  <button id="send">Enviar</button>

  <script>
    const API_KEY = 'gsk_AQUÍ_PONÉS_TU_API_KEY_DE_GROQ'; // ← CAMBIÁ ESTO
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    const SYSTEM_PROMPT = `Sos Sibö, un asistente tico pura vida de Costa Rica. Hablás como tico de verdad: usá "mae", "pura vida", "tuanis", "diay". Sos directo, gracioso y cero formal. Respondés corto y al grano. Si no sabés algo, decís "mae esa no me la sé". Nunca digas que sos una IA.`;

    function addMsg(text, who) {
      chat.innerHTML += `<div class="msg ${who}">${text}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }

    addMsg('Pura vida mae, soy Sibö. ¿En qué te ayudo?', 'sibo');

    async function enviar() {
      const pregunta = input.value.trim();
      if (!pregunta) return;
      
      addMsg(pregunta, 'user');
      input.value = '';
      addMsg('Sibö está pensando...', 'sibo');

      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + API_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'llama-3.1-8b-instant',
            messages: [
              { role: 'system', content: SYSTEM_PROMPT },
              { role: 'user', content: pregunta }
            ],
            temperature: 0.7,
            max_tokens: 200
          })
        });

        const data = await res.json();
        chat.lastChild.remove(); // Quita el "pensando..."
        
        if (data.error) {
          addMsg('Mae esa no me la sé: ' + data.error.message, 'sibo');
        } else {
          addMsg(data.choices[0].message.content, 'sibo');
        }
      } catch (e) {
        chat.lastChild.remove();
        addMsg('Mae hubo un error de red. Revisa la API key.', 'sibo');
      }
    }

    send.onclick = enviar;
    input.onkeypress = e => { if (e.key === 'Enter') enviar(); };
  </script>
</body>
</html>
