<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC EditorPro Suite ULTRA</title>

<style>
:root{
  --azul:#2d5f86;
  --azul2:#1e3f5c;
  --gris:#f4f6f8;
  --blanco:#fff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--gris);
}

/* TOP */
.topbar{
  background:var(--azul);
  color:white;
  display:flex;
  justify-content:space-between;
  padding:10px;
  align-items:center;
}

.menu button{
  background:transparent;
  border:none;
  color:white;
  margin:0 5px;
  cursor:pointer;
}

/* LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 110px);
}

/* SIDEBAR */
.sidebar{
  width:300px;
  background:white;
  padding:10px;
  overflow:auto;
  border-right:1px solid #ddd;
}

.editor{
  flex:1;
  display:flex;
  justify-content:center;
  padding:20px;
}

.page{
  width:850px;
  min-height:1000px;
  background:white;
  padding:40px;
  outline:none;
  box-shadow:0 0 12px rgba(0,0,0,0.15);
}

/* WC BAR */
.wcbar{
  background:var(--azul2);
  color:white;
  display:flex;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

.wcbar button{
  background:rgba(255,255,255,0.15);
  border:none;
  color:white;
  padding:8px;
  cursor:pointer;
  border-radius:6px;
}

/* BOX */
.box{
  background:#fff;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  box-shadow:0 0 5px rgba(0,0,0,0.1);
}

textarea,input,select{
  width:100%;
  margin:5px 0;
  padding:8px;
}

button.action{
  width:100%;
  padding:8px;
  background:var(--azul);
  color:white;
  border:none;
  cursor:pointer;
  border-radius:6px;
}

/* CHAT IA */
.chat{
  height:200px;
  overflow:auto;
  background:#f1f1f1;
  padding:5px;
  font-size:14px;
}

.msg{
  margin:5px 0;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none;}
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <h2>📄 WC EditorPro ULTRA</h2>
  <div class="menu">
    <button>Archivo</button>
    <button>Editar</button>
    <button>Insertar</button>
    <button>Formato</button>
  </div>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<!-- IA -->
<div class="box">
<h3>🧠 IA Asistente</h3>
<div class="chat" id="chat"></div>
<input id="iaInput" placeholder="Preguntar a la IA...">
<button class="action" onclick="ia()">Enviar</button>
</div>

<!-- TRADUCTOR -->
<div class="box">
<h3>🌍 Traductor</h3>
<textarea id="text"></textarea>

<select id="lang">
<option value="en">ES → EN</option>
<option value="es">EN → ES</option>
<option value="bribri">ES → Bribri</option>
<option value="cabecar">ES → Cabécar</option>
<option value="maleku">ES → Maleku</option>
<option value="boruca">ES → Boruca</option>
</select>

<button class="action" onclick="traducir()">Traducir</button>
<div id="out"></div>
</div>

<!-- DICCIONARIO -->
<div class="box">
<h3>📚 Diccionario</h3>
<input id="word">
<button class="action" onclick="buscar()">Buscar</button>
<div id="dict"></div>
</div>

<!-- VOZ -->
<div class="box">
<h3>🎤 Voz</h3>
<button class="action" onclick="grabar()">Dictado por voz</button>
<button class="action" onclick="leer()">Leer texto</button>
</div>

</div>

<!-- EDITOR -->
<div class="editor">
<div class="page" contenteditable="true" id="editor">
Escribe aquí tu documento...
</div>
</div>

</div>

<!-- BAR -->
<div class="wcbar">
<button onclick="insertText('Negrita')">Negrita</button>
<button onclick="insertText('Título')">Título</button>
<button onclick="insertText('Subrayado')">Subrayado</button>
</div>

<script>

/* ===== DICCIONARIO BASE ===== */
const dict = {
  hola:{en:"hello",bribri:"sulá",cabecar:"shkö",maleku:"tiok",boruca:"shö"},
  casa:{en:"house",bribri:"yë",cabecar:"yö",maleku:"tuk",boruca:"bo"},
  agua:{en:"water",bribri:"itsá",cabecar:"itsá",maleku:"ná",boruca:"na"}
};

/* ===== IA SIMPLE ===== */
function ia(){
  let input = document.getElementById("iaInput").value;
  let chat = document.getElementById("chat");

  let response =
  "🤖 IA: He analizado -> " + input +
  ". (Modo demo, se puede conectar a API real después)";

  chat.innerHTML += "<div class='msg'><b>Tú:</b> "+input+"</div>";
  chat.innerHTML += "<div class='msg'>"+response+"</div>";
}

/* ===== TRADUCTOR ===== */
function traducir(){
  let txt = document.getElementById("text").value.toLowerCase();
  let lang = document.getElementById("lang").value;

  Object.keys(dict).forEach(k=>{
    let v = dict[k];

    if(lang==="en") txt = txt.replace(k,v.en);
    if(lang==="es") txt = txt.replace(v.en,k);
    if(lang==="bribri") txt = txt.replace(k,v.bribri);
    if(lang==="cabecar") txt = txt.replace(k,v.cabecar);
    if(lang==="maleku") txt = txt.replace(k,v.maleku);
    if(lang==="boruca") txt = txt.replace(k,v.boruca);
  });

  document.getElementById("out").innerText = txt;
}

/* ===== DICCIONARIO ===== */
function buscar(){
  let w = document.getElementById("word").value.toLowerCase();
  let d = dict[w];

  if(d){
    document.getElementById("dict").innerHTML =
    "EN: "+d.en+"<br>Bribri: "+d.bribri+
    "<br>Cabécar: "+d.cabecar+
    "<br>Maleku: "+d.maleku+
    "<br>Boruca: "+d.boruca;
  }else{
    document.getElementById("dict").innerText="No encontrado";
  }
}

/* ===== VOZ ===== */
function grabar(){
  let rec = new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang="es-CR";
  rec.start();

  rec.onresult=function(e){
    document.getElementById("editor").innerText += " "+e.results[0][0].transcript;
  }
}

function leer(){
  let text = document.getElementById("editor").innerText;
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang="es-CR";
  speechSynthesis.speak(speech);
}

/* ===== INSERTAR TEXTO ===== */
function insertText(t){
  document.getElementById("editor").innerText += " ["+t+"] ";
}

</script>

</body>
</html>
