<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Editor Suite - Costa Rica 🇨🇷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Calibri, Arial, sans-serif; 
      background: #f3f2f1; 
      overflow: hidden;
      height: 100vh;
    }
    
    /* PANTALLA BACKSTAGE */
    #backstage {
      display: flex;
      height: 100vh;
      background: white;
    }
    #editor-view { display: none; height: 100vh; flex-direction: column; }

    /* MENÚ LATERAL AZUL */
  .backstage-nav {
      width: 220px;
      background: #2b579a;
      color: white;
      display: flex;
      flex-direction: column;
    }
  .backstage-nav-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
  .back-btn {
      width: 32px; height: 32px;
      border: 2px solid white;
      border-radius: 50%;
      background: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
  .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      border: none;
      background: none;
      color: white;
      text-align: left;
      width: 100%;
    }
  .nav-item:hover { background: rgba(255,255,255,0.1); }
  .nav-item.active {
      background: #1e3a5f;
      border-left: 3px solid #FFD700;
    }
  .nav-divider {
      height: 1px;
      background: rgba(255,255,255,0.2);
      margin: 8px 0;
    }

    /* CONTENIDO BACKSTAGE */
  .backstage-content {
      flex: 1;
      padding: 32px 48px;
      overflow-y: auto;
    }
  .backstage-title {
      font-size: 32px;
      font-weight: 300;
      color: #323130;
      margin-bottom: 24px;
    }
  .search-templates {
      width: 100%;
      max-width: 600px;
      padding: 8px 12px;
      border: 1px solid #8a8886;
      border-radius: 2px;
      font-size: 14px;
      margin-bottom: 16px;
    }
  .suggested-searches {
      font-size: 13px;
      color: #605e5c;
      margin-bottom: 24px;
    }
  .suggested-searches span {
      color: #2b579a;
      cursor: pointer;
      margin-right: 16px;
    }
  .suggested-searches span:hover { text-decoration: underline; }
   
  .template-tabs {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid #e1dfdd;
      margin-bottom: 24px;
    }
  .template-tab {
      padding: 8px 0;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      color: #605e5c;
      border-bottom: 2px solid transparent;
    }
  .template-tab.active {
      color: #2b579a;
      border-bottom-color: #2b579a;
      font-weight: 600;
    }

  .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
    }
  .template-card {
      cursor: pointer;
      border: 1px solid #e1dfdd;
      background: white;
      transition: all 0.1s;
    }
  .template-card:hover {
      border-color: #2b579a;
      box-shadow: 0 0 0 1px #2b579a;
    }
  .template-preview {
      aspect-ratio: 8.5/11;
      background: white;
      border-bottom: 1px solid #e1dfdd;
      padding: 12px;
      font-size: 5px;
      overflow: hidden;
    }
  .template-name {
      padding: 8px;
      font-size: 12px;
      text-align: center;
      background: #faf9f8;
    }

    /* VISTA EDITOR */
  .title-bar {
      background: #2b579a;
      color: white;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
  .title-bar-icons { display: flex; gap: 16px; }
  .title-bar-icons span { cursor: pointer; padding: 4px; }
  .title-bar-icons span:hover { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .ribbon-tabs {
      background: #f3f2f1;
      border-bottom: 1px solid #d2d0ce;
      display: flex;
      padding: 0 16px;
    }
  .ribbon-tab {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      color: #323130;
    }
  .ribbon-tab.active {
      background: white;
      border: 1px solid #d2d0ce;
      border-bottom: 1px solid white;
      margin-bottom: -1px;
      color: #2b579a;
      font-weight: 600;
    }
    
  .ribbon-toolbar {
      background: white;
      border-bottom: 1px solid #d2d0ce;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
  .tool-group {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1dfdd;
      padding-right: 8px;
      margin-right: 8px;
    }
  .tool-group-title {
      font-size: 11px;
      color: #605e5c;
      text-align: center;
      margin-top: 4px;
    }
  .tool-buttons { display: flex; gap: 4px; align-items: center; }
  .ribbon-toolbar button,.ribbon-toolbar select {
      background: white;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      height: 28px;
    }
  .ribbon-toolbar button:hover, .ribbon-toolbar button.active {
      border: 1px solid #8a8886;
      background: #f3f2f1;
    }

  .main-editor-area {
      flex: 1;
      background: #e6e6e6;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      justify-content: center;
    }
    #editor {
