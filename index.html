   .modal.active { display: flex; }

    function aplicarFormato(tag) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      guardarEstado();
      var range = sel.getRangeAt(0);
      if (range.collapsed) return;
      var contenido = range.extractContents();
      var elemento = document.createElement(tag);
      elemento.appendChild(contenido);
      range.insertNode(elemento);
      sel.removeAllRanges();
      var newRange = document.createRange();
      newRange.selectNodeContents(elemento);
      sel.addRange(newRange);
      actualizarContador();
    }

    function insertarLista(ordenada) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      guardarEstado();
      var range = sel.getRangeAt(0);
      var tag = ordenada? 'ol' : 'ul';
      var lista = document.createElement(tag);
      var item = document.createElement('li');
      item.innerHTML = range.toString() || '&nbsp;';
      lista.appendChild(item);
      range.deleteContents();
      range.insertNode(lista);
      sel.removeAllRanges();
      var newRange = document.createRange();
      newRange.selectNodeContents(item);
      newRange.collapse(false);
      sel.addRange(newRange);
      actualizarContador();
    }

    function alinear(alineacion) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      guardarEstado();
      var range = sel.getRangeAt(0);
      var nodo = range.commonAncestorContainer;
      while (nodo && nodo.nodeType!== 1) { nodo = nodo.parentNode; }
      while (nodo && nodo.tagName!== 'P' && nodo.tagName!== 'DIV' && nodo.tagName!== 'H1' && nodo.tagName!== 'H2' && nodo.tagName!== 'H3') {
        nodo = nodo.parentNode;
      }
      if (nodo && nodo!== document.getElementById('editor')) {
        nodo.style.textAlign = alineacion;
      } else {
        var div = document.createElement('div');
        div.style.textAlign = alineacion;
        div.appendChild(range.extractContents());
        range.insertNode(div);
      }
      actualizarContador();
    }

    function guardarEstado() {
      var editor = document.getElementById('editor');
      undoStack.push(editor.innerHTML);
      if (undoStack.length > 50) undoStack.shift();
      redoStack = [];
    }

    function deshacer() {
      if (undoStack.length > 0) {
        var editor = document.getElementById('editor');
        redoStack.push(editor.innerHTML);
        editor.innerHTML = undoStack.pop();
        actualizarContador();
      }
    }

    function rehacer() {
      if (redoStack.length > 0) {
        var editor = document.getElementById('editor');
        undoStack.push(editor.innerHTML);
        editor.innerHTML = redoStack.pop();
        actualizarContador();
      }
    }

    function cerrarBackstage() {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').focus();
    }

    function abrirBackstage() {
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
    }

    function mostrarNuevo() {
      document.getElementById('vistaNuevo').style.display = 'block';
      document.getElementById('vistaAbrir').style.display = 'none';
      document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('btnNuevo').classList.add('active');
    }

    function mostrarAbrir() {
      document.getElementById('vistaNuevo').style.display = 'none';
      document.getElementById('vistaAbrir').style.display = 'block';
      document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('btnAbrir').classList.add('active');
      cargarDocumentos();
    }

    function toggleVocabulario() {
      var panel = document.getElementById('panelVocabulario');
      panel.classList.toggle('active');
      if (panel.classList.contains('active')) {
        cargarVocabulario();
      }
    }

    function cargarVocabulario() {
      var lista = document.getElementById('listaVocabulario');
      var busqueda = document.getElementById('buscarVocabulario').value.toLowerCase();
      var idioma = document.getElementById('selectorIdioma').value;
      lista.innerHTML = '';

      var datos = idioma === 'cabecar'? diccionario.cabecar : diccionario.bribri;

      datos.filter(function(item) {
        return item.es.toLowerCase().includes(busqueda);
      }).forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'vocabulario-item';
        div.innerHTML = '<div class="vocabulario-es">' + item.es + '</div><div class="' + (idioma === 'cabecar'? 'vocabulario-cabecar' : 'vocabulario-bribri') + '">' + (item.bribri || item.cabecar) + '</div>';
        div.onclick = function() { insertarPalabra(item.bribri || item.cabecar); };
        lista.appendChild(div);
      });
    }

    function insertarPalabra(palabra) {
      var editor = document.getElementById('editor');
      editor.focus();
      var sel = window.getSelection();
      if (sel.rangeCount) {
        var range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(palabra + ' '));
        range.collapse(false);
      }
      actualizarContador();
    }

    function abrirEditor(tipo) {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').innerHTML = plantillas[tipo] || plantillas.blanco;
      document.getElementById('nombreDoc').innerText = tipo;
      setTimeout(function() {
        document.getElementById('editor').focus();
        actualizarContador();
      }, 100);
    }

    function guardar() {
      var nombre = document.getElementById('nombreDoc').innerText;
      var contenido = document.getElementById('editor').innerHTML;
      var docs = JSON.parse(localStorage.getItem('wc_docs') || '{}');
      docs[nombre] = { contenido: contenido, fecha: new Date().toLocaleString('es-CR') };
      localStorage.setItem('wc_docs', JSON.stringify(docs));
      alert('✅ Guardado: ' + nombre);
    }

      var lista = document.getElementById('listaDocs');

          }
