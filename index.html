<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro + IA</title>

<style>

/* =========================
   BASE
========================= */
body{
  margin:0;
  font-family:"Segoe UI", Arial;
  background:#f5f6f8;
}

/* HEADER */
.top-header{
  padding:12px;
  text-align:center;
  font-weight:800;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.top-header span{
  background:linear-gradient(135deg,#0A66FF,#FF6B00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* RIBBON */
.ribbon{
  display:flex;
  gap:8px;
  padding:10px;
  background:white;
  border-bottom:1px solid #ddd;

  overflow-x:auto;
  white-space:nowrap;
}

.menu{
  position:relative;
}

.menu button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#eee;
}

.menu button:hover{
  background:linear-gradient(135deg,#0A66FF,#FF6B00);
  color:white;
}

.menu-content{
  display:none;
  position:absolute;
  top:40px;
  left:0;
  background:white;
  border:1px solid #ddd;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  min-width:200px;
  z-index:9999;
}

.menu:hover .menu-content{
  display:block;
}

.menu-content button{
  width:100%;
  padding:10px;
  border:none;
  background:white;
  text-align:left;
  cursor:pointer;
}

.menu-content button:hover{
  background:#eef3ff;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:60px;
  height:100vh;
  background:linear-gradient(180deg,#0A66FF,#FF6B00);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10px;
}

.sidebar button{
  width:40px;
  height:40px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* DOCUMENTO */
.page{
  width:210mm;
  min-height:297mm;
  margin:30px auto;
  margin-left:120px;
  background:white;
  padding:30mm;
  box-shadow:0 10px 30px rgba(0,0,0,0.12);
}

#editor{
  min-height:250mm;
  outline:none;
}

/* WC ARTE */
.wc1{color:#0A66FF;font-weight:bold;}
.wc2{color:#FF6B00;font-weight:bold;}
.wc3{font-style:italic;}
.wc4{
  font-weight:900;
  background:linear-gradient(135deg,#0A66FF,#FF6B00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <button onclick="insertTemplate('blank')">📄</button>
  <button onclick="insertTemplate('cv')">📑</button>
  <button onclick="insertTemplate('letter')">✉️</button>
  <button onclick="insertTemplate('report')">📊</button>
</div>

<!-- HEADER -->
<div class="top-header">
  <span>WC CORPORATE EDITOR PRO + IA</span>
</div>

<!-- RIBBON -->
<div class="ribbon">

  <div class="menu">
    <button>Archivo</button>
    <div class="menu-content">
      <button onclick="nuevo()">Nuevo</button>
      <button onclick="guardar()">Guardar</button>
      <button onclick="imprimir()">Imprimir</button>
    </div>
  </div>

  <div class="menu">
    <button>Editar</button>
    <div class="menu-content">
      <button onclick="cmd('undo')">Deshacer</button>
      <button onclick="cmd('redo')">Rehacer</button>
      <button onclick="cmd('cut')">Cortar</button>
      <button onclick="cmd('copy')">Copiar</button>
      <button onclick="cmd('paste')">Pegar</button>
    </div>
  </div>

</div>

<!-- DOCUMENTO -->
<div class="page">
  <div id="editor" contenteditable="true">
    Escribe aquí...
  </div>
</div>

<script>

/* EDITOR */
function cmd(c){
  document.execCommand(c,false,null);
}

/* NUEVO DOCUMENTO DESDE PLANTILLA (FIX REAL) */
function insertTemplate(type){

  const editor = document.getElementById("editor");

  let html = "";

  if(type === "blank"){
    html = "<h2>Documento WC</h2><p>Escribe aquí...</p>";
  }

  if(type === "cv"){
    html = `
      <h1 style="color:#0A66FF;">Currículum Vitae</h1>
      <p><b>Nombre:</b></p>
      <p><b>Perfil:</b></p>
      <h3>Experiencia</h3>
      <p>- Empresa</p>
    `;
  }

  if(type === "letter"){
    html = `
      <p>San José, Costa Rica</p>
      <p>Estimado/a:</p>
      <p>Contenido de carta...</p>
    `;
  }

  if(type === "report"){
    html = `
      <h1>Informe</h1>
      <p>Resumen...</p>
    `;
  }

  // 🔥 REEMPLAZO TOTAL (ESTILO WORD REAL)
  editor.innerHTML = html;

  const range = document.createRange();
  const sel = window.getSelection();

  range.selectNodeContents(editor);
  range.collapse(true);

  sel.removeAllRanges();
  sel.addRange(range);
}

/* UTILIDADES */
function nuevo(){
  document.getElementById("editor").innerHTML = "";
}

function guardar(){
  localStorage.setItem("wc_doc", document.getElementById("editor").innerHTML);
}

function imprimir(){
  window.print();
}

</script>

</body>
</html>
