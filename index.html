<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WC Corporate Editor v20</title>

<style>
:root{
  --paper:#ffffff;
  --text:#111827;
  --bg:#0b1220;
  --dark:#0f172a;

  --grad: linear-gradient(90deg,#2563eb,#f97316);
}

*{box-sizing:border-box;font-family:Segoe UI, Arial;}

body{
  margin:0;
  background:var(--bg);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP HEADER */
.topbar{
  background:var(--grad);
  color:white;
  padding:10px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

.title{
  font-size:15px;
}

.subtitle{
  font-size:12px;
  opacity:0.9;
}

/* MENU BAR */
.menu{
  background:#0f172a;
  color:white;
  display:flex;
  gap:18px;
  padding:8px 15px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-size:13px;
}

.menu div{
  cursor:pointer;
  padding:5px 8px;
  border-radius:6px;
}

.menu div:hover{
  background:rgba(255,255,255,0.08);
}

/* WORKSPACE */
.workspace{
  flex:1;
  display:flex;
  justify-content:center;
  padding:30px;
  overflow:auto;
}

/* DOCUMENT */
.page{
  width:850px;
  min-height:1100px;
  background:var(--paper);
  color:var(--text);
  padding:70px;
  outline:none;
  border-radius:6px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    0 0 0 1px rgba(0,0,0,0.05);
}

/* TOOLBAR SIMPLE */
.toolbar{
  background:#111c33;
  padding:8px;
  display:flex;
  gap:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.toolbar button{
  border:none;
  background:rgba(255,255,255,0.08);
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.toolbar button:hover{
  background:var(--grad);
}

/* STATUS */
.status{
  background:#0f172a;
  color:white;
  font-size:12px;
  padding:6px 12px;
  display:flex;
  justify-content:space-between;
  border-top:1px solid rgba(255,255,255,0.08);
}

/* AI */
.ai{
  position:fixed;
  right:20px;
  bottom:20px;
  width:290px;
  background:#0f172a;
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:10px;
}

.ai b{
  background:var(--grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.ai textarea{
  width:100%;
  height:70px;
  border:none;
  border-radius:8px;
  padding:8px;
  background:#111827;
  color:white;
}

.ai button{
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:8px;
  background:var(--grad);
  color:white;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- TOP BAR CORPORATIVO -->
<div class="topbar">
  <div class="title">WC Corporate Editor v20</div>
  <div class="subtitle">ULTIMATE PRO UI v26 - ESTÉTICA EJECUTIVA</div>
</div>

<!-- MENÚ TIPO WORD -->
<div class="menu">
  <div>Archivo</div>
  <div>Editar</div>
  <div>Insertar</div>
  <div>WC Arte</div>
  <div>Herramientas</div>
  <div>Desarrollador Keny Chinchilla Navarro</div>
  <div>Ayuda</div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <button onclick="cmd('bold')"><b>B</b></button>
  <button onclick="cmd('italic')"><i>I</i></button>
  <button onclick="cmd('underline')"><u>U</u></button>
  <button onclick="cmd('insertUnorderedList')">Lista</button>
  <button onclick="save()">💾</button>
  <button onclick="load()">📂</button>
</div>

<!-- WORKSPACE -->
<div class="workspace">
  <div id="page" class="page" contenteditable="true">
    <h1>WC Corporate Editor v20</h1>
    <p>Documento ejecutivo listo para edición profesional...</p>
  </div>
</div>

<!-- STATUS -->
<div class="status">
  <div>Estado: listo</div>
  <div>Modo Corporativo Activo</div>
</div>

<!-- IA -->
<div class="ai">
  <b>IA Asistente</b>
  <textarea id="ai"></textarea>
  <button onclick="aiGen()">Generar</button>
</div>

<script>

function cmd(c){
  document.execCommand(c,false,null);
}

function save(){
  localStorage.setItem("wc_doc", document.getElementById("page").innerHTML);
}

function load(){
  document.getElementById("page").innerHTML = localStorage.getItem("wc_doc") || "";
}

function aiGen(){
  let t = document.getElementById("ai").value;
  document.getElementById("page").innerHTML += "<p><b>IA:</b> "+t+"</p>";
}

setInterval(()=>save(),3000);
window.onload=load;

</script>

</body>
</html>
