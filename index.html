  <div class="header-suite">...</div>
  <script>
let macroActions = [];
let isRecordingMacro = false;
let currentTab = 'inicio';
let currentLang = 'es';
let clipboardHistory = [];

// [MANTÉN AQUÍ TU OBJETO translations]
const translations = { /* ... tu objeto actual ... */ };

// ... [MANTÉN TUS FUNCIONES: switchEcosystem, changeActiveTab, renderActiveCommands, etc.] ...

function triggerCommandAction(actionKey, label) {
  document.getElementById('lienzoTexto').focus();
  switch(actionKey) {
    case "cut": execCmd("cut"); break;
    case "copy": execCmd("copy"); break;
    case "insertTable":
      document.execCommand('insertHTML', false, `<table style="width:100%; border-collapse:collapse; margin:10px 0;"><tr style="background:#f1f5f9;"><td style="border:1px solid var(--border-color); padding:6px;">...</td><td style="border:1px solid var(--border-color); padding:6px;">...</td></tr></table><p>&nbsp;</p>`);
      break;
    case "wcArt":
      applyWCArtModerno();
      break;
    case "themeCorp":
      document.getElementById('lienzoTexto').style.color = "#1d5270";
      break;
  }
}

function applyWCArtModerno() {
  const selection = window.getSelection();
  if (!selection.rangeCount || selection.toString() === "") {
    openModal("Selecciona el texto para convertirlo en Arte.");
    return;
  }
  const text = selection.toString();
  const artHTML = `<div style="background: linear-gradient(135deg, rgba(29, 82, 112, 0.1), rgba(217, 78, 24, 0.1)); backdrop-filter: blur(5px); border: 1px solid rgba(146, 50, 79, 0.3); padding: 15px 30px; border-radius: 12px; display: inline-block; margin: 15px 0; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #1d5270; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">${text}</div>`;
  document.execCommand('insertHTML', false, artHTML);
  openModal("Estilo Moderno aplicado.");
}

function saveToClipboardHistory(text) {
  if(text && !clipboardHistory.includes(text)) {
    clipboardHistory.unshift(text);
    if(clipboardHistory.length > 5) clipboardHistory.pop();
  }
}

document.addEventListener('copy', () => {
  const selected = window.getSelection().toString();
  saveToClipboardHistory(selected);
});

// Inicialización
switchEcosystem('es');
</script>
