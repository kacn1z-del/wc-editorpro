<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WC Corporate Editor Pro Stable Suite</title>

<style>

html, body{
  margin:0;
  padding:0;
  height:100%;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#e9eef5;
  overflow:auto;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#1d5270,#92324f,#d94e18);
  color:white;
  padding:10px;
  font-weight:700;
  position:sticky;
  top:0;
  z-index:10;
}

/* TOOLBAR TIPO WORD */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:white;
  border-bottom:1px solid #ccc;
  position:sticky;
  top:44px;
  z-index:10;
}

.toolbar button, .toolbar select{
  padding:6px 10px;
  border:1px solid #ccc;
  background:white;
  border-radius:6px;
  font-size:13px;
}

/* DOCUMENTO */
.page{
  margin:12px;
  background:white;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  padding:25px;
  min-height:75vh;
}

/* EDITOR REALMENTE ESTABLE */
#editor{
  min-height:65vh;
  outline:none;
  font-size:16px;
  line-height:1.8;

  -webkit-user-select:text;
  user-select:text;

  touch-action:auto;
  word-wrap:break-word;
}

/* FOOTER */
.footer{
  display:flex;
  justify-content:space-between;
  padding:8px 10px;
  font-size:12px;
  background:white;
  border-top:1px solid #ddd;
}

button{
  cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
💼 WC Corporate Editor Pro — Stable Suite
</div>

<!-- TOOLBAR -->
<div class="toolbar">

<button onclick="cmd('bold')"><b>B</b></button>
<button onclick="cmd('italic')"><i>I</i></button>
<button onclick="cmd('underline')"><u>U</u></button>

<button onclick="cmd('insertUnorderedList')">• Lista</button>
<button onclick="cmd('insertOrderedList')">1. Lista</button>

<button onclick="cmd('justifyLeft')">⬅</button>
<button onclick="cmd('justifyCenter')">↔</button>
<button onclick="cmd('justifyRight')">➡</button>

<select onchange="fontSize(this.value)">
  <option value="3">14px</option>
  <option value="4" selected>16px</option>
  <option value="5">20px</option>
</select>

<button onclick="setColor('#1d5270')">Azul</button>
<button onclick="setColor('#92324f')">Rojo</button>

<button onclick="save()">💾 Guardar</button>

</div>

<!-- PAGE -->
<div class="page">
  <div id="editor" contenteditable="true">
    <h2>Documento WC Corporate</h2>
    <p>Este es el editor consolidado estable. Ahora puedes escribir sin errores en iPhone.</p>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
<span id="counter">0 palabras | 0 caracteres</span>
<span>WC Engine Stable Pro</span>
</div>

<script>

const editor = document.getElementById("editor");

/* 🔥 iPhone SAFE INIT */
window.onload = () => {
  setTimeout(() => {
    editor.focus();
  }, 200);
};

/* mantener foco */
editor.addEventListener("touchstart", () => {
  editor.focus();
});

/* COMMAND ENGINE */
function cmd(action){
  document.execCommand(action,false,null);
  updateCounter();
}

/* FONT SIZE */
function fontSize(size){
  document.execCommand("fontSize", false, size);
  updateCounter();
}

/* COLOR */
function setColor(color){
  document.execCommand("foreColor", false, color);
  updateCounter();
}

/* SAVE LOCAL */
function save(){
  localStorage.setItem("wc_doc", editor.innerHTML);
  alert("Documento guardado ✔");
}

/* LOAD */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("wc_doc");
  if(saved){
    editor.innerHTML = saved;
  }
  updateCounter();
});

/* COUNTER */
function updateCounter(){
  const text = editor.innerText || "";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById("counter").innerText =
    `${words} palabras | ${text.length} caracteres`;
}

editor.addEventListener("input", updateCounter);

</script>

</body>
</html>
