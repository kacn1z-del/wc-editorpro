<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WC EditorPro Suite</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#0f172a;
  --panel:#111c33;
  --card:#16223f;
  --text:#e5e7eb;
  --accent:#3b82f6;
  --border:#26314f;
}

[data-theme="light"]{
  --bg:#f3f4f6;
  --panel:#ffffff;
  --card:#e5e7eb;
  --text:#111827;
  --accent:#2563eb;
  --border:#d1d5db;
}

*{box-sizing:border-box;font-family:Arial, sans-serif;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:var(--panel);
  padding:15px;
  border-right:1px solid var(--border);
}

.logo{
  font-size:18px;
  font-weight:bold;
  margin-bottom:20px;
}

.btn{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  border-radius:8px;
  text-align:left;
}

.btn:hover{background:var(--accent); color:white;}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.toolbar button{
  margin-right:5px;
  border:none;
  padding:8px;
  border-radius:6px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.toolbar button:hover{background:var(--accent);color:white;}

/* EDITOR */
.editor{
  flex:1;
  padding:20px;
  outline:none;
  overflow:auto;
}

/* AI PANEL */
.ai-panel{
  position:absolute;
  right:20px;
  bottom:20px;
  width:280px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
}

.ai-panel textarea{
  width:100%;
  height:80px;
  background:var(--card);
  border:none;
  color:var(--text);
  padding:8px;
  border-radius:8px;
}

.ai-panel button{
  width:100%;
  margin-top:5px;
  padding:8px;
  background:var(--accent);
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="logo">🧠 EditorPro</div>
  <button class="btn" onclick="newDoc()">📄 Nuevo</button>
  <button class="btn" onclick="saveDoc()">💾 Guardar</button>
  <button class="btn" onclick="loadDoc()">📂 Cargar</button>
  <button class="btn" onclick="exportHTML()">⬇ Exportar HTML</button>
  <button class="btn" onclick="toggleTheme()">🌙 Modo</button>
</div>

<div class="main">

  <div class="topbar">
    <div class="toolbar">
      <button onclick="cmd('bold')"><b>B</b></button>
      <button onclick="cmd('italic')"><i>I</i></button>
      <button onclick="cmd('underline')"><u>U</u></button>
      <button onclick="cmd('insertUnorderedList')">• Lista</button>
      <button onclick="cmd('justifyCenter')">Centro</button>
      <button onclick="cmd('justifyLeft')">Izq</button>
    </div>
  </div>

  <div id="editor" class="editor" contenteditable="true">
    <h1>Bienvenido a EditorPro Suite</h1>
    <p>Escribe aquí tu contenido...</p>
  </div>

</div>

<!-- IA PANEL -->
<div class="ai-panel">
  <b>IA Integrada (Beta)</b>
  <textarea id="aiInput" placeholder="Escribe tu prompt..."></textarea>
  <button onclick="fakeAI()">Generar</button>
</div>

<script>

let editor = document.getElementById("editor");

/* comandos editor */
function cmd(command){
  document.execCommand(command, false, null);
}

/* nuevo documento */
function newDoc(){
  editor.innerHTML = "";
}

/* guardar local */
function saveDoc(){
  localStorage.setItem("doc", editor.innerHTML);
  alert("Documento guardado");
}

/* cargar */
function loadDoc(){
  editor.innerHTML = localStorage.getItem("doc") || "";
}

/* exportar HTML */
function exportHTML(){
  let blob = new Blob([editor.innerHTML], {type:"text/html"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "documento.html";
  a.click();
}

/* modo oscuro */
function toggleTheme(){
  let current = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", current === "light" ? "dark" : "light");
}

/* IA simulada */
function fakeAI(){
  let input = document.getElementById("aiInput").value;
  editor.innerHTML += `<p><b>IA:</b> ${input} → respuesta generada (conectar API aquí)</p>`;
}

/* autosave */
setInterval(()=>{
  localStorage.setItem("autosave", editor.innerHTML);
}, 3000);

window.onload = ()=>{
  editor.innerHTML = localStorage.getItem("autosave") || editor.innerHTML;
};

</script>

</body>
</html>
