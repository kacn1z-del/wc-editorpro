<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WC Editor Suite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f3f2f1;
      overflow: hidden;
      height: 100vh;
    }

    #backstage { display: flex; height: 100vh; background: white; }
    #editor-view { display: none; height: 100vh; flex-direction: column; }

 .backstage-nav {
      width: 220px;
      background: #2b579a;
      color: white;
      display: flex;
      flex-direction: column;
    }
 .backstage-nav-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
 .back-btn {
      width: 32px; height: 32px;
      border: 2px solid white;
      border-radius: 50%;
      background: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }
 .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      border: none;
      background: none;
      color: white;
      text-align: left;
      width: 100%;
    }
 .nav-item:active { background: rgba(255,255,255,0.2); }
 .nav-item.active {
      background: #1e3a5f;
      border-left: 3px solid #FFD700;
    }

 .backstage-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
 .backstage-title {
      font-size: 28px;
      font-weight: 300;
      color: #323130;
      margin-bottom: 20px;
    }

 .templates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
 .template-card {
      cursor: pointer;
      border: 1px solid #e1dfdd;
      background: white;
    }
 .template-card:active {
      border-color: #2b579a;
      box-shadow: 0 0 0 2px #2b579a;
    }
 .template-preview {
      aspect-ratio: 8.5/11;
      background: white;
      border-bottom: 1px solid #e1dfdd;
      padding: 8px;
    }
 .template-name {
      padding: 8px;
      font-size: 11px;
      text-align: center;
      background: #faf9f8;
    }

    /* EDITOR */
 .title-bar {
      background: #2b579a;
      color: white;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
 .title-bar-icons { display: flex; gap: 12px; }
 .title-bar-icons span { cursor: pointer; padding: 4px; font-size: 18px; }
 .title-bar-icons span:active { background: rgba(255,255,255,0.3); border-radius: 3px; }

 .ribbon-tabs {
      background: #f3f2f1;
      border-bottom: 1px solid #d2d0ce;
      display: flex;
      padding: 0 12px;
    }
 .ribbon-tab {
      padding: 8px 14px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      color: #323130;
    }
 .ribbon-tab.active {
      background: white;
      border: 1px solid #d2d0ce;
      border-bottom: 1px solid white;
      margin-bottom: -1px;
      color: #2b579a;
      font-weight: 600;
    }

 .ribbon-toolbar {
      background: white;
      border-bottom: 1px solid #d2d0ce;
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      overflow-x: auto;
    }
 .tool-group {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1dfdd;
      padding-right: 8px;
      margin-right: 8px;
    }
 .tool-group-title {
      font-size: 10px;
      color: #605e5c;
      text-align: center;
      margin-top: 2px;
    }
 .tool-buttons { display: flex; gap: 4px; align-items: center; }
 .ribbon-toolbar button,.ribbon-toolbar select {
      background: white;
      border: 1px solid #ccc;
      padding: 6px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      height: 36px;
      min-width: 36px;
    }
 .ribbon-toolbar button:active {
      background: #e1dfdd;
      border-color: #2b579a;
    }
 .ribbon-toolbar select { height: 36px; padding: 0 6px; }

 .main-editor-area {
      flex: 1;
      background: #e6e6e6;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    #editor {
      width: 100%;
      max-width: 816px;
      min-height: 400px;
      background: white;
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
      padding: 40px;
      outline: none;
      font-size: 16px;
      line-height: 1.5;
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>

  <!-- BACKSTAGE -->
  <div id="backstage">
    <div class="backstage-nav">
      <div class="backstage-nav-header">
        <button class="back-btn" onclick="cerrarBackstage()">←</button>
        <span style="font-weight: 600;">Info</span>
      </div>
      <button class="nav-item active">Nuevo</button>
      <button class="nav-item" onclick="alert('Próximamente 🇨🇷')">Abrir</button>
      <button class="nav-item" onclick="alert('Próximamente 🇨🇷')">Guardar</button>
      <button class="nav-item" onclick="window.print()">Imprimir</button>
      <button class="nav-item" onclick="alert('Próximamente 🇨🇷')">Compartir</button>
      <button class="nav-item" onclick="exportarPDF()">Exportar PDF</button>
    </div>

    <div class="backstage-content">
      <h1 class="backstage-title">Nuevo</h1>

      <div class="templates-grid">
        <div class="template-card" onclick="abrirEditor('blanco')">
          <div class="template-preview"></div>
          <div class="template-name">Documento en blanco</div>
        </div>

        <div class="template-card" onclick="abrirEditor('carta')">
          <div class="template-preview">
            <div style="width:100%; height:2px; background:#000; margin:4px 0;"></div>
            <div style="width:80%; height:1px; background:#ccc; margin:2px 0;"></div>
          </div>
          <div class="template-name">Carta formal</div>
        </div>

        <div class="template-card" onclick="abrirEditor('informe')">
          <div class="template-preview">
            <div style="width:100%; height:3px; background:#2b579a; margin:4px 0;"></div>
            <div style="width:70%; height:1px; background:#ccc; margin:2px 0;"></div>
          </div>
          <div class="template-name">Informe</div>
        </div>

        <div class="template-card" onclick="abrirEditor('acta')">
          <div class="template-preview">
            <div style="width:100%; height:3px; background:#2b579a; margin:4px 0;"></div>
            <div style="width:90%; height:1px; background:#ccc; margin:2px 0;"></div>
          </div>
          <div class="template-name">Acta</div>
        </div>

        <div class="template-card" onclick="abrirEditor('cv')">
          <div class="template-preview">
            <div style="width:50%; height:3px; background:#000; margin:4px auto;"></div>
            <div style="width:80%; height:1px; background:#ccc; margin:2px auto;"></div>
          </div>
          <div class="template-name">Currículum</div>
        </div>

        <div class="template-card" onclick="abrirEditor('ensayo')">
          <div class="template-preview">
            <div style="width:70%; height:3px; background:#000; margin:4px auto;"></div>
            <div style="width:90%; height:1px; background:#ccc; margin:2px auto;"></div>
          </div>
          <div class="template-name">Ensayo</div>
        </div>
      </div>
    </div>
  </div>

  <!-- EDITOR -->
  <div id="editor-view">
    <div class="title-bar">
      <div class="title-bar-icons">
        <span onclick="abrirBackstage()">📄</span>
        <span onclick="guardar()">💾</span>
        <span onclick="deshacer()">↶</span>
        <span onclick="rehacer()">↷</span>
      </div>
      <div id="nombreDoc">Documento1</div>
      <div>— WC Editor</div>
    </div>

    <div class="ribbon-tabs">
      <button class="ribbon-tab" onclick="abrirBackstage()">Archivo</button>
      <button class="ribbon-tab active">Inicio</button>
      <button class="ribbon-tab">Revisar</button>
      <button class="ribbon-tab">Vista</button>
    </div>

    <div class="ribbon-toolbar">
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="pegar()">📋</button>
          <button onclick="cortar()">✂️</button>
          <button onclick="copiar()">📄</button>
        </div>
        <div class="tool-group-title">Portapapeles</div>
      </div>

      <div class="tool-group">
        <div class="tool-buttons">
          <select onchange="cambiarFuente(this.value)">
            <option value="Calibri">Calibri</option>
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times</option>
          </select>
          <select onchange="cambiarTamano(this.value)">
            <option value="2">10</option>
            <option value="3" selected>11</option>
            <option value="4">12</option>
            <option value="5">14</option>
            <option value="6">18</option>
            <option value="7">24</option>
          </select>
        </div>
        <div class="tool-group-title">Fuente</div>
      </div>

      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="ejecutar('bold')"><b>B</b></button>
          <button onclick="ejecutar('italic')"><i>I</i></button>
          <button onclick="ejecutar('underline')"><u>U</u></button>
        </div>
        <div class="tool-group-title">Fuente</div>
      </div>

      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="ejecutar('insertUnorderedList')">≡</button>
          <button onclick="ejecutar('insertOrderedList')">1≡</button>
          <button onclick="ejecutar('justifyLeft')">⬅️</button>
          <button onclick="ejecutar('justifyCenter')">↔️</button>
          <button onclick="ejecutar('justifyRight')">➡️</button>
        </div>
        <div class="tool-group-title">Párrafo</div>
      </div>
    </div>

    <div class="main-editor-area">
      <div id="editor" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>

  <script>
    var plantillas = {
      blanco: '<p>Escribí aquí...</p>',
      carta: '<p>San José, Costa Rica</p><br><p><strong>Señores:</strong></p><p>[Empresa]</p><br><p>Estimados señores:</p><p>Por medio de la presente...</p><br><br><p>Atentamente,</p><br><p>_________________________<br>[Tu nombre]</p>',
      informe: '<h2 style="color:#2b579a;">Informe</h2><p><strong>Fecha:</strong></p><h3>1. Resumen</h3><p>Contenido...</p><h3>2. Resultados</h3><ul><li>Resultado 1</li><li>Resultado 2</li></ul>',
      acta: '<h2 style="text-align:center;">ACTA DE REUNIÓN</h2><p><strong>Fecha:</strong> <br><strong>Hora:</strong> <br><strong>Lugar:</strong> </p><p><strong>Asistentes:</strong></p><ol><li></li><li></li></ol><p><strong>Acuerdos:</strong></p><ol><li>Se acuerda que...</li></ol>',
      cv: '<h1 style="text-align:center;">[TU NOMBRE]</h1><p style="text-align:center;">Tel: 8888-8888 | Email: correo@email.com</p><hr><h2>Perfil Profesional</h2><p>Profesional con experiencia en...</p>',
      ensayo: '<h1 style="text-align:center;">Título del Ensayo</h1><p style="text-align:center;"><em>[Tu nombre]</em></p><br><h2>Introducción</h2><p>El presente ensayo aborda...</p>'
    };

    function abrirBackstage() {
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
    }

    function cerrarBackstage() {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      setTimeout(function() { document.getElementById('editor').focus(); }, 100);
    }

    function abrirEditor(tipo) {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').innerHTML = plantillas;
      document.getElementById('nombreDoc').innerText = tipo;
      setTimeout(function() {
        var editor = document.getElementById('editor');
        editor.focus();
        // Poner cursor al final
        var range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }, 100);
    }

    function ejecutar(cmd) {
      var editor = document.getElementById('editor');
      editor.focus();
      document.execCommand(cmd, false, null);
    }

    function cambiarFuente(fuente) {
      document.getElementById('editor').focus();
      document.execCommand('fontName', false, fuente);
    }

    function cambiarTamano(tamano) {
      document.getElementById('editor').focus();
      document.execCommand('fontSize', false, tamano);
    }

    function cortar() {
      document.getElementById('editor').focus();
      document.execCommand('cut');
    }

    function copiar() {
      document.getElementById('editor').focus();
      document.execCommand('copy');
    }

    function pegar() {
      document.getElementById('editor').focus();
      navigator.clipboard.readText().then(function(text) {
        document.execCommand('insertText', false, text);
      }).catch(function() {
        alert('Pegá con Cmd+V mae');
      });
    }

    function deshacer() {
      document.getElementById('editor').focus();
      document.execCommand('undo');
    }

    function rehacer() {
      document.getElementById('editor').focus();
      document.execCommand('redo');
    }

    function guardar() {
      alert('Guardado 🇨🇷');
    }

    function exportarPDF() {
      window.print();
    }

    window.onload = function() {
      document.getElementById('backstage').style.display = 'flex';
    }
  </script>
</body>
</html>
