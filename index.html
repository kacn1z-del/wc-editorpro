<script>
const editor=document.getElementById("editor");

/* =========================
   HISTORIAL UNDO/REDO
========================= */
let history=[];let historyIndex=-1;
function saveHistory(){
  history=history.slice(0,historyIndex+1);
  history.push(editor.innerHTML);
  historyIndex++;
}
function undo(){
  if(historyIndex>0){
    historyIndex--;
    editor.innerHTML=history[historyIndex];
  }
}
function redo(){
  if(historyIndex<history.length-1){
    historyIndex++;
    editor.innerHTML=history[historyIndex];
  }
}
saveHistory();
editor.addEventListener("input",saveHistory);

/* =========================
   FORMATO CON RANGE API
========================= */
function applyFormat(tagName){
  const sel=window.getSelection();
  if(!sel||sel.rangeCount===0) return;
  const range=sel.getRangeAt(0);
  const el=document.createElement(tagName);
  el.appendChild(range.extractContents());
  range.insertNode(el);
  range.selectNodeContents(el);
  sel.removeAllRanges();
  sel.addRange(range);
  saveHistory();
}
function bold(){applyFormat("strong");}
function italic(){applyFormat("em");}
function underline(){applyFormat("u");}

/* =========================
   ATAJOS DE TECLADO
========================= */
document.addEventListener("keydown",function(e){
  if(e.ctrlKey&&e.key.toLowerCase()==="z"){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key.toLowerCase()==="y"){e.preventDefault();redo();}
  if(e.ctrlKey&&e.key.toLowerCase()==="b"){e.preventDefault();bold();}
  if(e.ctrlKey&&e.key.toLowerCase()==="i"){e.preventDefault();italic();}
  if(e.ctrlKey&&e.key.toLowerCase()==="u"){e.preventDefault();underline();}
});

/* =========================
   ARCHIVO
========================= */
function newDoc(){editor.innerHTML="";}
function save(){localStorage.setItem("wc_doc",editor.innerHTML);}
function openDoc(){const data=localStorage.getItem("wc_doc");if(data){editor.innerHTML=data;}}
function saveAs(){
  const name=prompt("Nombre del documento:");
  if(name){localStorage.setItem(name,editor.innerHTML);}
}
function printDoc(){window.print();}
function exportPDF(){alert("Exportar a PDF (simulado)");}

/* =========================
   PLANTILLAS
========================= */
function insertTemplate(type){
  newDoc();
  let html="";
  if(type==="cv"){
    html=`<h1>Currículum Vitae</h1>
          <p><strong>Nombre:</strong> ...</p>
          <p><strong>Experiencia:</strong> ...</p>`;
  }
  if(type==="letter"){
    html=`<h1>Carta Formal</h1>
          <p>San José, Costa Rica</p>
          <p>Estimado/a ...</p>
          <p>Contenido de la carta...</p>
          <p>Atentamente,</p>`;
  }
  if(type==="report"){
    html=`<div style="text-align:center; margin-top:100px;">
             <h1 class="wc4">Informe Corporativo / Corporate Report</h1>
             <h2 class="wc2">Proyecto / Cliente – Project / Client</h2>
             <p class="wc3">Fecha / Date: __________</p>
           </div>
           <hr style="margin:40px 0;">
           <h2>Índice / Index</h2>
           <ol>
             <li>Resumen Ejecutivo / Executive Summary</li>
             <li>Objetivos / Objectives</li>
             <li>Metodología / Methodology</li>
             <li>Resultados / Results</li>
             <li>Conclusiones / Conclusions</li>
             <li>Recomendaciones / Recommendations</li>
           </ol>
           <hr style="margin:40px 0;">
           <h2>1. Resumen Ejecutivo / Executive Summary</h2><p>...</p>
           <h2>2. Objetivos / Objectives</h2><p>...</p>
           <h2>3. Metodología / Methodology</h2><p>...</p>
           <h2>4. Resultados / Results</h2><p>...</p>
           <h2>5. Conclusiones / Conclusions</h2><p>...</p>
           <h2>6. Recomendaciones / Recommendations</h2><p>...</p>`;
  }
  editor.innerHTML=html;
}

/* =========================
   WC ARTE
========================= */
function applyWC(){
  const text=document.getElementById("wcText").value;
  const style=document.getElementById("wcStyle").value;
  if(text){
    editor.innerHTML+=`<p class="${style}">${text}</p>`;
  }
}

/* =========================
   BARRA DE ESTADO
========================= */
function updateStatus(){
  const text=editor.innerText.trim();
  const words=text.length>0?text.split(/\s+/).length:0;
  const chars=text.length;
  const readTime=Math.ceil(words/200);
  document.getElementById("wordCount").textContent="Palabras: "+words;
  document.getElementById("charCount").textContent="Caracteres: "+chars;
  document.getElementById("readTime").textContent="Tiempo lectura: "+readTime+" min";
  const sel=window.getSelection();
  let style="Normal";
  if(sel&&sel.rangeCount>0){
    const node=sel.anchorNode.parentNode;
    if(node.tagName==="STRONG") style="Negrita";
    if(node.tagName==="EM") style="Cursiva";
    if(node.tagName==="U") style="Subrayado";
  }
  document.getElementById("styleStatus").textContent="Estilo: "+style;
}
function updateLangStatus(){
  const lang=document.getElementById("langSelect").value;
  let label="Español";
  if(lang==="en") label="English";
  if(lang==="br") label="Bribri";
  if(lang==="cb") label="Cabécar";
  document.getElementById("langSelect").title="Idioma activo: "+label;
}
editor.addEventListener("input",updateStatus);
document.addEventListener("selectionchange",updateStatus);
updateStatus();updateLangStatus();

/* =========================
   CORRECTOR ORTOGRÁFICO
========================= */
const dictionaries={
  es:["hola","informe","corporativo","proyecto","cliente","fecha","resumen","objetivos","metodología","resultados","conclusiones","recomendaciones"],
  en:["hello","report","corporate","project","client","date","summary","objectives","methodology","results","conclusions","recommendations"],
  br:["wak","tsiru","yök","dör","bribri"],
  cb:["kaska","tö","cabécar"]
};
function spellCheck(){
  const lang=document.getElementById("langSelect").value;
  const dict=dictionaries[lang]||[];
  let text=editor.innerText;
  let words=text.split(/\s+/);
  let checkedHTML=words.map(word=>{
    const clean=word.toLowerCase().replace(/[.,;:!?]/g,"");
    if(clean&&!dict.includes(clean)){
      return `<span style="color:red; text-decoration:underline dotted;">${word}</span>`;
    }
    return word;
  }).join(" ");
  editor.innerHTML=checkedHTML;
}
editor.addEventListener("input",spellCheck);

/* =========================
   DICCIONARIO DINÁMICO
========================= */
function addWord(){
  const lang=document.getElementById("langSelect").value;
  const word=document.getElementById("newWord").value.trim().toLowerCase();
  if(!word) return;
  if(!dictionaries[lang]) dictionaries[lang]=[];
  if(!dictionaries[lang].includes(word)){
    dictionaries[lang].push(word);
    alert(`Palabra añadida al diccionario (${lang}): ${word}`);
  }
  document.getElementById("newWord").value="";
  spellCheck();
}
</script>
