<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WC Editor PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;height:100vh;overflow:hidden}
#backstage{display:flex;height:100vh;background:white}
#editor-view{display:none;height:100vh;flex-direction:column}
.nav{width:280px;background:#002B7F;color:white}
.nav-header{padding:16px;background:#CE1126}
.nav button{padding:12px 20px;width:100%;border:none;background:none;color:white;text-align:left;cursor:pointer}
.nav button:active{background:rgba(255,255,255,0.2)}
.content{flex:1;padding:24px}
.card{border:1px solid #ccc;padding:20px;margin-bottom:12px;cursor:pointer;text-align:center}
.bar{background:#002B7F;color:white;padding:6px 12px;display:flex;justify-content:space-between}
.toolbar{background:white;border-bottom:1px solid #ccc;padding:8px;display:flex;gap:8px}
.toolbar button{border:1px solid #ccc;padding:6px 10px;background:white;cursor:pointer;min-width:36px}
.area{flex:1;background:#e6e6e6;padding:16px;overflow-y:auto}
#editor{width:100%;max-width:800px;min-height:600px;background:white;padding:40px;margin:0 auto;outline:none}
</style>
</head>
<body>
<div id="backstage">
<div class="nav">
<div class="nav-header"><button onclick="cerrarBackstage()">←</button> Archivo</div>
<button onclick="abrirEditor()">📄 Nuevo</button>
<button onclick="guardar()">💾 Guardar</button>
<button onclick="window.print()">🖨️ Imprimir</button>
</div>
<div class="content">
<h1>Nuevo</h1>
<div class="card" onclick="abrirEditor()">Documento en blanco</div>
</div>
</div>
<div id="editor-view">
<div class="bar">
<div><span onclick="abrirBackstage()">📄</span> <span onclick="guardar()">💾</span></div>
<div id="nombre">Documento1</div>
<div>WC PRO 🇨🇷</div>
</div>
<div class="toolbar">
<button onclick="deshacer()">↶</button>
<button onclick="rehacer()">↷</button>
<button onclick="f('strong')"><b>B</b></button>
<button onclick="f('em')"><i>I</i></button>
<button onclick="f('u')"><u>U</u></button>
</div>
<div class="area">
<div id="editor" contenteditable="true"><p>Escribí aquí...</p></div>
</div>
</div>
<script>
var u=[],r=[];
function g(){var e=document.getElementById('editor');u.push(e.innerHTML);if(u.length>50)u.shift();r=[]}
function deshacer(){if(u.length>0){var e=document.getElementById('editor');r.push(e.innerHTML);e.innerHTML=u.pop()}}
function rehacer(){if(r.length>0){var e=document.getElementById('editor');u.push(e.innerHTML);e.innerHTML=r.pop()}}
function cerrarBackstage(){document.getElementById('backstage').style.display='none';document.getElementById('editor-view').style.display='flex'}
function abrirBackstage(){document.getElementById('backstage').style.display='flex';document.getElementById('editor-view').style.display='none'}
function abrirEditor(){document.getElementById('backstage').style.display='none';document.getElementById('editor-view').style.display='flex';g()}
function guardar(){localStorage.setItem(document.getElementById('nombre').innerText,document.getElementById('editor').innerHTML);alert('Guardado')}
function f(t){g();var s=window.getSelection();if(!s.rangeCount)return;var r=s.getRangeAt(0);if(r.collapsed)return;var e=document.createElement(t);e.appendChild(r.extractContents());r.insertNode(e)}
</script>
</body>
</html>
