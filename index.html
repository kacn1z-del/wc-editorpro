<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro + IA</title>

<style>

/* 🌈 FONDO */
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#1b75ed,#ff6b00);
}

/* 🧠 RIBBON GRANDE */
.ribbon{
  display:flex;
  align-items:center;
  gap:10px;

  padding:14px 10px;
  height:70px;

  background: linear-gradient(135deg,#1b75ed,#ff6b00);
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
}

/* MENÚ */
.menu{
  position:relative;
}

.menu > button{
  background: rgba(255,255,255,0.9);
  border:none;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* DROPDOWN */
.menu-content{
  display:none;
  position:absolute;
  top:55px;
  left:0;

  min-width:220px;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);

  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  z-index:999;
}

.menu:hover .menu-content{
  display:block;
}

.menu-content button,
.menu-content input,
.menu-content select{
  width:100%;
  padding:10px;
  border:none;
  background:transparent;
  text-align:left;
  cursor:pointer;
}

.menu-content button:hover{
  background:#e6f0ff;
}

/* 🧠 TOP TITLE OCULTO (ya está en ribbon) */
.title{
  color:white;
  font-weight:900;
  margin-left:auto;
  margin-right:10px;
  text-shadow:0 0 10px rgba(0,0,0,0.3);
}

/* 📄 DOCUMENTO */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:20px auto;
  padding:20mm;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  border-radius:8px;
}

#editor{
  min-height:250mm;
  outline:none;
}

/* 🎨 WC ARTE */
.wc-style{
  font-size:26px;
  font-weight:900;
  background: linear-gradient(135deg,#1b75ed,#ff6b00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 12px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<!-- 🎛️ RIBBON ÚNICA -->
<div class="ribbon">

  <!-- ARCHIVO -->
  <div class="menu">
    <button>Archivo</button>
    <div class="menu-content">
      <button onclick="guardar()">Guardar</button>
      <button onclick="nuevo()">Nuevo</button>
      <button onclick="imprimir()">Imprimir</button>
    </div>
  </div>

  <!-- EDITAR -->
  <div class="menu">
    <button>Editar</button>
    <div class="menu-content">
      <button onclick="cmd('undo')">Deshacer</button>
      <button onclick="cmd('redo')">Rehacer</button>
      <button onclick="cmd('cut')">Cortar</button>
      <button onclick="cmd('copy')">Copiar</button>
      <button onclick="cmd('paste')">Pegar</button>
    </div>
  </div>

  <!-- INSERTAR -->
  <div class="menu">
    <button>Insertar</button>
    <div class="menu-content">
      <button onclick="insertText('📌 Nota ')">Nota</button>
      <button onclick="insertTable()">Tabla</button>
    </div>
  </div>

  <!-- WC ARTE -->
  <div class="menu">
    <button>WC Arte</button>
    <div class="menu-content">
      <input id="textoArte" placeholder="Texto WC Arte">
      <select id="estiloArte">
        <option value="wc-style">Glow WC</option>
      </select>
      <button onclick="insertWC()">Insertar</button>
    </div>
  </div>

  <!-- HERRAMIENTAS -->
  <div class="menu">
    <button>Herramientas</button>
    <div class="menu-content">
      <button onclick="limpiar()">Limpiar</button>
      <button onclick="zoomIn()">Zoom +</button>
      <button onclick="zoomOut()">Zoom -</button>
    </div>
  </div>

  <!-- DESARROLLADOR -->
  <div class="menu">
    <button>Desarrollador</button>
    <div class="menu-content">
      <button disabled>Keny Chinchilla Navarro</button>
      <button onclick="console.log('WC System OK')">Estado sistema</button>
    </div>
  </div>

  <!-- AYUDA -->
  <div class="menu">
    <button>Ayuda</button>
    <div class="menu-content">
      <button>Atajos</button>
      <button>Documentación</button>
      <button>Soporte IA</button>
    </div>
  </div>

</div>

<!-- 📄 DOCUMENTO -->
<div class="page">
  <div id="editor" contenteditable="true">Escribe aquí...</div>
</div>

<script>

/* EDITOR */
function cmd(c){document.execCommand(c,false,null);}
function insertText(t){document.execCommand("insertText",false,t);}
function insertTable(){
  document.execCommand("insertHTML",false,
  "<table border='1' style='width:100%'><tr><td>A</td><td>B</td></tr></table>");
}

/* WC ARTE */
function insertWC(){
  const texto=document.getElementById("textoArte").value;
  const span=document.createElement("span");
  span.className="wc-style";
  span.textContent=texto;

  insertAtCursor(span);
}

/* CURSOR */
function insertAtCursor(node){
  const sel=window.getSelection();
  if(!sel.rangeCount) return;

  const range=sel.getRangeAt(0);
  range.deleteContents();
  range.insertNode(node);

  range.setStartAfter(node);
  range.setEndAfter(node);

  sel.removeAllRanges();
  sel.addRange(range);
}

/* ARCHIVO */
function guardar(){
  localStorage.setItem("wc_doc",document.getElementById("editor").innerHTML);
}
function nuevo(){
  document.getElementById("editor").innerHTML="";
}
function imprimir(){
  window.print();
}

/* HERRAMIENTAS */
function limpiar(){
  document.getElementById("editor").innerHTML="";
}
function zoomIn(){document.body.style.zoom="110%";}
function zoomOut(){document.body.style.zoom="100%";}

</script>

</body>
</html>
