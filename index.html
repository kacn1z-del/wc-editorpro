<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Editor PRO 🇨🇷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f3f2f1;overflow:hidden;height:100vh}
#backstage{display:flex;height:100vh;background:white}
#editor-view{display:none;height:100vh;flex-direction:column}
:root{--azul:#002B7F;--rojo:#CE1126}
.backstage-nav{width:280px;background:var(--azul);color:white;display:flex;flex-direction:column}
.backstage-nav-header{padding:16px;display:flex;align-items:center;gap:12px;background:var(--rojo)}
.back-btn{width:32px;height:32px;border:2px solid white;border-radius:50%;background:none;color:white;cursor:pointer;font-size:18px}
.nav-item{padding:12px 20px;cursor:pointer;font-size:14px;border:none;background:none;color:white;text-align:left;width:100%}
.nav-item:active{background:rgba(255,255,255,0.2)}
.backstage-content{flex:1;padding:24px;overflow-y:auto;background:#faf9f8}
.backstage-title{font-size:32px;font-weight:300;color:var(--azul);margin-bottom:20px}
.template-card{cursor:pointer;border:1px solid #e1dfdd;background:white;padding:20px;margin-bottom:12px;text-align:center}
.template-card:active{border-color:var(--azul);transform:scale(0.98)}
.title-bar{background:var(--azul);color:white;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.title-bar-icons{display:flex;gap:12px}
.title-bar-icons span{cursor:pointer;padding:4px;font-size:18px}
.ribbon-toolbar{background:white;border-bottom:1px solid #d2d0ce;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ribbon-toolbar button{background:white;border:1px solid #ccc;padding:6px 10px;border-radius:3px;cursor:pointer;font-size:14px;height:36px;min-width:36px}
.ribbon-toolbar button:active{background:#e1dfdd}
.main-editor-area{flex:1;background:#e6e6e6;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
