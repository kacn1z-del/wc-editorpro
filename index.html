<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC EditorPro Suite</title>

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Estilos corporativos -->
  <link rel="stylesheet" href="public/estilo-corporativo.css">
</head>
<body>

  <!-- Barra superior -->
  <header class="topbar">
    <div>📄 WC EditorPro Suite</div>
    <div>IA integrada</div>
  </header>

  <!-- Navegación tipo pestañas -->
  <nav class="tabs">
    <button onclick="changeTab(this)" class="active" aria-label="Inicio">Inicio</button>
    <button onclick="changeTab(this)" aria-label="Insertar">Insertar</button>
    <button onclick="changeTab(this)" aria-label="Diseño">Diseño</button>
  </nav>

  <!-- Ribbon -->
  <section class="ribbon">
    <button onclick="execCmd('bold')" aria-label="Negrita"><b>B</b></button>
    <button onclick="execCmd('italic')" aria-label="Cursiva"><i>I</i></button>
    <button onclick="execCmd('underline')" aria-label="Subrayado"><u>U</u></button>

    <button onclick="execCmd('justifyLeft')" aria-label="Alinear izquierda">⬅</button>
    <button onclick="execCmd('justifyCenter')" aria-label="Centrar">⬌</button>
    <button onclick="execCmd('justifyRight')" aria-label="Alinear derecha">➡</button>

    <select onchange="execCmd('fontName',this.value)" aria-label="Fuente">
      <option>Arial</option>
      <option>Verdana</option>
      <option>Times New Roman</option>
    </select>

    <button onclick="insertTable()" aria-label="Insertar tabla">Tabla</button>
    <button onclick="insertImage()" aria-label="Insertar imagen">Imagen</button>
  </section>

  <!-- Editor principal -->
  <main>
    <div id="editor" class="editor" contenteditable="true">
      Escribe aquí tu documento...
    </div>
  </main>

  <!-- Panel IA -->
  <footer class="ai">
    <input id="aiInput" placeholder="Pregunta a la IA..." aria-label="Entrada IA">
    <button onclick="askAI()" aria-label="Enviar a IA">Enviar</button>
    <div id="aiOut"></div>
  </footer>

  <!-- Scripts -->
  <script src="src/editor.js"></script>
</body>
</html>
