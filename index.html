<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro + IA</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3f8;
}

/* ===== TOP BAR ===== */
.topbar {
  background: #2f6fa3;
  color: white;
  padding: 14px;
  font-size: 18px;
  font-weight: bold;
}

/* ===== TOOLBAR ===== */
.toolbar {
  background: rgba(47, 111, 163, 0.85);
  display: flex;
  flex-wrap: wrap;
  padding: 10px;
  gap: 8px;
}

.toolbar button {
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  border-radius: 6px;
  background: white;
  font-weight: bold;
}

.toolbar button:hover {
  background: #dcecff;
}

/* ===== EDITOR ===== */
#editor {
  margin: 20px;
  padding: 20px;
  min-height: 500px;
  background: white;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  outline: none;
}

/* ===== WC ARTE STYLES ===== */
.wc-arte-1 {
  color: #00e5ff;
  text-shadow: 0 0 10px #00e5ff, 0 0 20px #0099ff;
  font-size: 26px;
  font-weight: bold;
}

.wc-arte-2 {
  color: #d4af37;
  text-shadow: 1px 1px 0 #8a6d1f;
  font-size: 26px;
  font-weight: bold;
}

.wc-arte-3 {
  color: #ffffff;
  text-shadow: 3px 3px 8px rgba(0,0,0,0.6);
  font-size: 26px;
  font-weight: bold;
}

.wc-arte-4 {
  color: #1e90ff;
  text-shadow: 2px 2px 0 #0b3d91, 4px 4px 0 #062a63;
  font-size: 26px;
  font-weight: bold;
}

/* PANEL WC ARTE */
#wcArtePanel {
  margin: 10px 20px;
  display: flex;
  gap: 10px;
}

#wcArtePanel input, #wcArtePanel select {
  padding: 8px;
}

#wcArtePanel button {
  padding: 8px 12px;
  border: none;
  background: #2f6fa3;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="topbar">
  WC CORPORATE EDITOR PRO + IA
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <button onclick="cmd('bold')">Negrita</button>
  <button onclick="cmd('italic')">Cursiva</button>
  <button onclick="cmd('underline')">Subrayado</button>

  <button onclick="cmd('justifyLeft')">Izquierda</button>
  <button onclick="cmd('justifyCenter')">Centro</button>
  <button onclick="cmd('justifyRight')">Derecha</button>

  <button onclick="cmd('insertUnorderedList')">Lista</button>

  <button onclick="guardar()">Guardar</button>
</div>

<!-- WC ARTE -->
<div id="wcArtePanel">
  <input id="textoArte" placeholder="Escribe WC Arte">
  <select id="estiloArte">
    <option value="1">Neón azul</option>
    <option value="2">Dorado</option>
    <option value="3">Sombra</option>
    <option value="4">3D azul</option>
  </select>
  <button onclick="insertarArte()">Insertar</button>
</div>

<!-- EDITOR -->
<div id="editor" contenteditable="true">
  Escribe aquí tu documento...
</div>

<script>
function cmd(command) {
  document.execCommand(command, false, null);
  document.getElementById("editor").focus();
}

/* ===== WC ARTE ===== */
function insertarArte() {
  const texto = document.getElementById("textoArte").value;
  const estilo = document.getElementById("estiloArte").value;

  if (!texto) return;

  const span = document.createElement("span");
  span.className = "wc-arte-" + estilo;
  span.textContent = texto;

  const editor = document.getElementById("editor");
  editor.appendChild(span);
  editor.appendChild(document.createElement("br"));
}

/* ===== GUARDAR ===== */
function guardar() {
  const contenido = document.getElementById("editor").innerHTML;
  const blob = new Blob([contenido], { type: "text/html" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wc-documento.html";
  a.click();
}
</script>

</body>
</html>
