function eia(){var i=document.getElementById('iai');var t=i.value.trim();if(!t)return;var c=document.getElementById('iac');c.innerHTML+='<div class="ia-msg ia-user">'+t+'</div>';i.value='';var r='';if(t.toLowerCase().includes('resum')){r='Para resumir tu texto: 1. Seleccioná el texto en el editor 2. Yo te ayudo a crear un resumen conciso.'}else if(t.toLowerCase().includes('ortogra')){r='Puedo revisar ortografía. Copiá tu texto aquí y te digo los errores.'}else if(t.toLowerCase().includes('expand')){r='Decime qué idea querés expandir y te ayudo a desarrollarla con más detalle.'}else if(t.toLowerCase().includes('traduc')){r='Puedo traducir entre español, bribri y cabécar. ¿Qué querés traducir?'}else{r='Pura vida mae. Soy tu asistente tico. Puedo ayudarte a: corregir ortografía, resumir, expandir texto, traducir a bribri/cabécar, crear ensayos, o responder preguntas. ¿Qué ocupás específicamente?'}setTimeout(function(){c.innerHTML+='<div class="ia-msg ia-bot">'+r+'</div>';c.scrollTop=c.scrollHeight},500)}

function cf(){var f=document.getElementById('sf').value;var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);if(r.collapsed)return;var sp=document.createElement('span');sp.style.fontFamily=f;sp.appendChild(r.extractContents());r.insertNode(sp);ac()}
function ctm(){var t=document.getElementById('st').value;var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);if(r.collapsed)return;var f=document.createElement('font');f.size=t;f.appendChild(r.extractContents());r.insertNode(f);ac()}
