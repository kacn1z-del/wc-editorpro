<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WC Corporate Editor v20</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; }
    .topbar { background:#004080; color:#fff; padding:10px; font-weight:bold; }
    .ribbon { background:#ddd; padding:5px; }
    .ribbon button { margin-right:5px; }
    .layout { display:flex; }
    .workspace { flex:1; padding:10px; }
    .editor { border:1px solid #ccc; min-height:300px; padding:10px; }
    .ai-panel { width:250px; background:#f4f4f4; padding:10px; border-left:1px solid #ccc; }
    .community-panel { background:#f9f9f9; border-left:2px solid #ccc; padding:10px; width:250px; position:fixed; right:0; top:60px; bottom:30px; overflow-y:auto; }
    .community-panel h3 { margin-top:0; }
    .community-panel ul { list-style:none; padding:0; }
    .community-panel li { margin-bottom:8px; }
    .popup.hidden { display:none; }
    .popup { position:fixed; top:20%; left:30%; width:40%; background:#fff; border:1px solid #ccc; box-shadow:0 0 10px #333; }
    .popup-content { padding:20px; }
    .close { float:right; cursor:pointer; font-size:20px; }
    .statusbar { position:fixed; bottom:0; left:0; width:100%; background:#eee; padding:5px; font-size:14px; border-top:1px solid #ccc; }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar">WC Corporate Editor v20</header>

  <!-- Ribbon -->
  <nav class="ribbon">
    <button onclick="buscarSeleccion()">🔍 Buscar en CR</button>
    <button onclick="escucharIdioma()">🎤 Escuchar idioma</button>
  </nav>

  <!-- Layout -->
  <div class="layout">
    <!-- Workspace -->
    <main class="workspace">
      <div id="doc-editor" class="editor" contenteditable="true">
        Empieza a escribir aquí...
      </div>
    </main>

    <!-- Panel IA -->
    <aside class="ai-panel">
      <h3>Asistente IA</h3>
      <p>Sugerencias y traducción en tiempo real.</p>
      <div id="aiSummary"></div>
    </aside>
  </div>

  <!-- Panel comunitario -->
  <aside class="community-panel">
    <h3>Validación comunitaria</h3>
    <ul id="communityList"></ul>
  </aside>

  <!-- Popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-content">
      <span class="close" onclick="cerrarPopup()">&times;</span>
      <h3>Resultados</h3>
      <ul id="popupResults"></ul>
    </div>
  </div>

  <!-- Statusbar -->
  <footer class="statusbar" id="statusbar">
    Listo | Palabras: 0 | Lenguas encontradas: 0 | Pendientes: 0 | Validadas: 0 | Corregidas: 0
  </footer>

<script>
  // Diccionario
  const wcDatabase = {
    bribri: { agua:"aba", fuego:"chä", tierra:"itö", casa:"yö" },
    cabecar: { agua:"yök", fuego:"sëk", tierra:"duö", casa:"wák" },
    maleku: { agua:"toku", fuego:"kira", tierra:"naku", casa:"jiri" },
    boruca: { agua:"unk", fuego:"tö", tierra:"dru", casa:"kro" },
    ngabe: { agua:"dru", fuego:"kira", tierra:"noke", casa:"bri" },
    huetar: { agua:"desconocido", fuego:"desconocido", tierra:"desconocido", casa:"desconocido" }
  };

  const nuevasPalabras = [];

  // Buscar en CR
  function buscarEnCR(palabra) {
    const resultados = [];
    for (let lengua in wcDatabase) {
      if (wcDatabase[lengua][palabra]) {
        resultados.push({ lengua, traduccion: wcDatabase[lengua][palabra] });
      }
    }
    return resultados.length ? resultados : "No encontrado en lenguas de Costa Rica";
  }

  function buscarSeleccion() {
    const selection = window.getSelection().toString().trim();
    const resultados = buscarEnCR(selection);
    const popup = document.getElementById("popup");
    const list = document.getElementById("popupResults");
    list.innerHTML = "";

    if (typeof resultados === "string") {
      list.innerHTML = `<li>${resultados}</li>`;
    } else {
      resultados.forEach(r => {
        list.innerHTML += `<li><b>${r.lengua}:</b> ${r.traduccion}</li>`;
      });
      document.getElementById("aiSummary").innerHTML = generarTabla(resultados);
    }
    actualizarStatusbar(selection.length, typeof resultados === "string" ? 0 : resultados.length);
    popup.classList.remove("hidden");
  }

  function cerrarPopup() {
    document.getElementById("popup").classList.add("hidden");
  }

  // Escuchar idioma
  function escucharIdioma() {
    const recognition = new webkitSpeechRecognition();
    recognition.lang = "es-CR";
    recognition.onresult = (event) => {
      const palabra = event.results[0][0].transcript.trim().toLowerCase();
      registrarNuevaPalabra("bribri", palabra); // ejemplo: se asigna a Bribri
      alert(`Nueva palabra detectada: "${palabra}" añadida como pendiente.`);
    };
    recognition.start();
  }

  // Panel comunitario
  function registrarNuevaPalabra(lang, palabra) {
    nuevasPalabras.push({ lang, palabra, estado:"pendiente" });
    renderCommunityPanel();
    actualizarStatusbar();
  }

  function validarPalabra(index) {
    const item = nuevasPalabras[index];
    wcDatabase[item.lang][item.palabra] = item.palabra;
    item.estado = "validado";
    renderCommunityPanel();
    actualizarStatusbar();
  }

  function editarPalabra(index) {
    const nueva = prompt("Ingrese la traducción correcta:");
    if (nueva) {
      const item = nuevasPalabras[index];
      wcDatabase[item.lang][item.palabra] = nueva;
      item.estado = "corregido";
      renderCommunityPanel();
      actualizarStatusbar();
    }
  }

  function renderCommunityPanel() {
    const list = document.getElementById("communityList");
    list.innerHTML = "";
    nuevasPalabras.forEach((item,i) => {
      list.innerHTML += `
        <li>
          <b>${item.lang}:</b> ${item.palabra} [${item.estado}]
          <button onclick="validarPalabra(${i})">✔️ Validar</button>
          <button onclick="editarPalabra(${i})">✏️ Editar</button>
        </li>`;
    });
  }

  function contar(estado) {
    return nuevasPalabras.filter(p => p.estado === estado).length;
  }

  function actualizarStatusbar(palabras=0, lenguas=0) {
    const statusbar = document.getElementById("statusbar");
    statusbar.textContent =
      `Listo | Palabras: ${palabras} | Lenguas encontradas: ${lenguas} | Pendientes: ${contar("pendiente")} | Validadas: ${contar("validado")} | Corregidas: ${contar("corregido")}`;
  }

  function generarTabla(resultados) {
    let html = "<table border='1' style='width:100%; border-collapse:collapse;'><tr><th>Lengua</th><th>Traducción</th></tr>";
    resultados.forEach(r => {
      html += `<tr><td>${r.lengua}</td><td>${r.traduccion}</td></tr>`;
    });
    html += "</table>";
    return html;
  }
</script>
</body>
</html>
