<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documento1 - WC Editor Suite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Calibri, Arial, sans-serif; 
      background: #f3f2f1; 
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* BARRA SUPERIOR AZUL */
   .title-bar {
      background: #2b579a;
      color: white;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
   .title-bar .left-icons { display: flex; gap: 16px; }
   .title-bar .doc-name { font-weight: 400; }
   .title-bar .right-logo { 
      background: rgba(255,255,255,0.15); 
      padding: 4px 12px; 
      border-radius: 4px; 
      font-size: 12px;
    }

    /* CINTA DE PESTAÑAS */
   .ribbon-tabs {
      background: #f3f2f1;
      border-bottom: 1px solid #d2d0ce;
      display: flex;
      padding: 0 16px;
    }
   .ribbon-tab {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      color: #323130;
    }
   .ribbon-tab.active {
      background: white;
      border: 1px solid #d2d0ce;
      border-bottom: 1px solid white;
      margin-bottom: -1px;
      color: #2b579a;
      font-weight: 600;
    }
    
    /* BARRA DE HERRAMIENTAS */
   .ribbon-toolbar {
      background: white;
      border-bottom: 1px solid #d2d0ce;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
   .tool-group {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1dfdd;
      padding-right: 8px;
      margin-right: 8px;
    }
   .tool-group-title {
      font-size: 11px;
      color: #605e5c;
      text-align: center;
      margin-top: 4px;
    }
   .tool-buttons { display: flex; gap: 4px; }
   .ribbon-toolbar button, .ribbon-toolbar select {
      background: white;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      height: 28px;
    }
   .ribbon-toolbar button:hover {
      border: 1px solid #8a8886;
      background: #f3f2f1;
    }
   .ribbon-toolbar select { height: 28px; }

    /* ÁREA PRINCIPAL: 3 COLUMNAS */
   .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    /* PANEL PLANTILLAS IZQUIERDA */
   .plantillas-panel {
      width: 280px;
      background: white;
      border-right: 1px solid #d2d0ce;
      overflow-y: auto;
      padding: 16px;
    }
   .plantillas-panel h3 {
      font-size: 12px;
      color: #605e5c;
      margin-bottom: 12px;
      font-weight: 600;
    }
   .plantilla-card {
      border: 1px solid #e1dfdd;
      border-radius: 4px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.1s;
    }
   .plantilla-card:hover {
      border-color: #2b579a;
      box-shadow: 0 0 0 1px #2b579a;
    }
   .plantilla-preview {
      aspect-ratio: 8.5/11;
      background: white;
      border-bottom: 1px solid #e1dfdd;
      padding: 12px;
      font-size: 6px;
      overflow: hidden;
    }
   .plantilla-nombre {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      background: #faf9f8;
    }

    /* EDITOR CENTRO */
   .editor-container {
      flex: 1;
      background: #e6e6e6;
      overflow-y: auto;
      padding: 32px;
      display: flex;
      justify-content: center;
    }
    #editor {
      width: 816px;
      min-height: 1056px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      padding: 96px;
      outline: none;
      font-size: 11pt;
      line-height: 1.5;
    }

    /* ASISTENTE IA DERECHA */
   .ia-panel {
      width: 320px;
      background: white;
      border-left: 1px solid #d2d0ce;
      display: flex;
      flex-direction: column;
    }
   .ia-header {
      background: #f3f2f1;
      padding: 12px 16px;
      border-bottom: 1px solid #d2d0ce;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
   .ia-body {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
   .ia-msg {
      background: #2b579a;
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
   .ia-botones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
   .ia-botones button {
      background: #f3f2f1;
      border: 1px solid #d2d0ce;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }
   .ia-botones button:hover {
      background: #e1dfdd;
      border-color: #2b579a;
    }
  </style>
</head>
<body>
  <!-- BARRA AZUL SUPERIOR -->
  <div class="title-bar">
    <div class="left-icons">
      <span>📄</span>
      <span>💾</span>
      <span>↶</span>
      <span>↷</span>
    </div>
    <div class="doc-name" id="nombreDoc">Documento1</div>
    <div class="right-logo">— WC Editor Suite</div>
  </div>

  <!-- PESTAÑAS -->
  <div class="ribbon-tabs">
    <button class="ribbon-tab">Archivo</button>
    <button class="ribbon-tab active">Inicio</button>
    <button class="ribbon-tab">Revisar</button>
    <button class="ribbon-tab">Vista</button>
  </div>

  <!-- BARRA DE HERRAMIENTAS -->
  <div class="ribbon-toolbar">
    <div class="tool-group">
      <div class="tool-buttons">
        <button onclick="pegar()">📋 Pegar</button>
        <button onclick="formato('cut')">✂️</button>
        <button onclick="formato('copy')">📄</button>
      </div>
      <div class="tool-group-title">Portapapeles</div>
    </div>

    <div class="tool-group">
      <div class="tool-buttons">
        <select onchange="formato('fontName', this.value)">
          <option>Calibri (Cuerpo)</option>
          <option>Arial</option>
          <option>Times New Roman</option>
          <option>Georgia</option>
        </select>
        <select onchange="formato('fontSize', this.value)" id="tamanoFuente">
          <option value="1">8</option>
          <option value="2">10</option>
          <option value="3" selected>11</option>
          <option value="4">12</option>
          <option value="5">14</option>
          <option value="6">18</option>
          <option value="7">24</option>
        </select>
      </div>
      <div class="tool-group-title">Fuente</div>
    </div>

    <div class="tool-group">
      <div class="tool-buttons">
        <button onclick="formato('bold')"><b>B</b></button>
        <button onclick="formato('italic')"><i>I</i></button>
        <button onclick="formato('underline')"><u>U</u></button>
      </div>
      <div class="tool-group-title">Fuente</div>
    </div>

    <div class="tool-group">
      <div class="tool-buttons">
        <button onclick="formato('insertUnorderedList')">≡</button>
        <button onclick="formato('insertOrderedList')">1≡</button>
        <button onclick="formato('justifyLeft')">⬅️</button>
        <button onclick="formato('justifyCenter')">↔️</button>
        <button onclick="formato('justifyRight')">➡️</button>
      </div>
      <div class="tool-group-title">Párrafo</div>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-container">
    <!-- PANEL PLANTILLAS -->
    <div class="plantillas-panel">
      <h3>📄 PLANTILLAS</h3>
      
      <div class="plantilla-card" onclick="cargarPlantilla('blanco')">
        <div class="plantilla-preview"></div>
        <div class="plantilla-nombre">En blanco</div>
      </div>

      <div class="plantilla-card" onclick="cargarPlantilla('carta')">
        <div class="plantilla-preview">
          <div style="height:2px; background:#000; margin:4px 0; width:40%;"></div>
          <div style="height:1px; background:#ccc; margin:2px 0;"></div>
          <div style="height:1px; background:#ccc; margin:2px 0; width:80%;"></div>
        </div>
        <div class="plantilla-nombre">Carta formal</div>
      </div>

      <div class="plantilla-card" onclick="cargarPlantilla('informe')">
        <div class="plantilla-preview">
          <div style="height:3px; background:#2b579a; margin:4px 0;"></div>
          <div style="height:1px; background:#ccc; margin:2px 0;"></div>
          <div style="height:3px; background:#2b579a; margin:4px 0; width:60%;"></div>
        </div>
        <div class="plantilla-nombre">Informe</div>
      </div>

      <div class="plantilla-card" onclick="cargarPlantilla('acta')">
        <div class="plantilla-preview">
          <div style="height:3px; background:#2b579a; margin:4px 0;"></div>
          <div style="height:1px; background:#ccc; margin:2px 0;"></div>
        </div>
        <div class="plantilla-nombre">Acta</div>
      </div>

      <div class="plantilla-card" onclick="cargarPlantilla('cv')">
        <div class="plantilla-preview">
          <div style="height:3px; background:#000; margin:4px auto; width:50%;"></div>
          <div style="height:1px; background:#ccc; margin:2px 0;"></div>
        </div>
        <div class="plantilla-nombre">Currículum</div>
      </div>

      <div class="plantilla-card" onclick="cargarPlantilla('ensayo')">
        <div class="plantilla-preview">
          <div style="height:3px; background:#000; margin:4px 0; width:70%;"></div>
          <div style="height:1px; background:#ccc; margin:2px 0;"></div>
        </div>
        <div class="plantilla-nombre">Ensayo</div>
      </div>
    </div>

    <!-- EDITOR -->
    <div class="editor-container">
      <div id="editor" contenteditable="true">
        <p>Hacé click en una plantilla de la izquierda para empezar 🇨🇷</p>
      </div>
    </div>

    <!-- PANEL IA -->
    <div class="ia-panel">
      <div class="ia-header">
        🤖 Asistente IA
      </div>
      <div class="ia-body">
        <div class="ia-msg">
          Mej
