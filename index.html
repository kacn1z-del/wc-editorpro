<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Editor Pro</title>
  <style>
    body { 
      margin: 0; 
      font-family: Arial, sans-serif; 
      background: #f5f5f5; 
      padding-bottom: 200px; 
    }
    .wc-ia-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, #252423 0%, #323130 100%);
      .wc-ia-panel {
  background: linear-gradient(135deg, #002B7F 0%, #CE1126 100%);  👈 AZUL + ROJO
  border-top: 3px solid #FFD700;  👈 DORADO
}
      color: #fff; 
      font-weight: bold; 
      font-size: 18px; 
      .wc-ia-title { 
  color: #FFD700;  👈 DORADO
}
    }
    .wc-ia-input input { 
      flex: 1; 
      padding: 8px; 
      border-radius: 8px; 
      border: none; 
      font-size: 14px;
    }
    .wc-ia-input button { 
      background: #5c2d91; 
      color: white; 
      border: none; 
      padding: 8px 15px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold;
   .wc-ia-input button { 
  background: #FFD700;  👈 DORADO
  color: #002B7F;  👈 AZUL
}
    }
    .wc-ia-actions button { 
      background: rgba(255,255,255,0.2); 
      color: white; 
      border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px;
    }
    .wc-ia-actions button:hover { background: rgba(255,255,255,0.3); }
    .wc-ia-output { 
      background: white; 
      padding: 10px; 
      .wc-ia-actions button { 
  border: 1px solid #FFD700;  👈 DORADO
}
      max-width: 800px;
      margin: 20px auto;
      min-height: 400px;
      background: white;
      padding: 40px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      .wc-ia-actions button { 
  border: 1px solid #FFD700;  👈 DORADO
}
  </div>

  <div class="wc-ia-panel">
    <div class="wc-ia-title">WC Corporate IA</div>
    <div class="wc-ia-input">
      <input type="text" id="prompt" placeholder="Escribí tu consulta...">
      <button onclick="enviar()">Enviar</button>
    </div>
    <div class="wc-ia-actions">
      <button onclick="accion('resumir')">Resumir</button>
      <button onclick="accion('mejorar')">Mejorar</button>
      <button onclick="accion('traducir')">Traducir</button>
      <button onclick="accion('corregir')">Corregir</button>
    </div>
    <div class="wc-ia-output" id="resultado">El resultado aparece aquí...</div>
  </div>

  <script>
    function enviar() {
      const prompt = document.getElementById('prompt').value;
      document.getElementById('resultado').innerText = 'Procesando: ' + prompt;
    }
    
    function accion(tipo) {
      document.getElementById('resultado').innerText = 'Función ' + tipo + ' ejecutada';
    }
  </script>
</body>
</html>
