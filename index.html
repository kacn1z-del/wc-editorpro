<!DOCTYPE html>
<html lang="es-CR">
<head>
  <meta charset="UTF-8">
  <title>WC EditorPro Suite</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="estilo-corporativo.css">
</head>
<body>
  <header>
    <img src="tu_logo.jpeg" alt="Logotipo WC EditorPro Suite" style="height:60px; vertical-align:middle;">
    <h1>WC EditorPro Suite</h1>
  </header>

  <div id="toolbar">
    <button onclick="checkSpelling()">Revisar ortografía</button>
    <button onclick="exportPDF()">Exportar PDF</button>
    <button onclick="exportDocx()">Exportar DOCX</button>
    <button onclick="exportHTML()">Exportar HTML</button>
    <button onclick="guardarServidor()">Guardar en servidor</button>
    <button onclick="window.print()">Imprimir</button>
  </div>

  <div id="editor"></div>

  <aside>
    <h3>Control de Cambios</h3>
    <div id="changeLog" class="change-log"></div>
    <h3>Macros</h3>
    <button onclick="runMacro()">Aplicar formato automático</button>
    <h3>Historial</h3>
    <button onclick="undoChange()">Deshacer</button>
    <button onclick="redoChange()">Rehacer</button>
  </aside>

  <footer>
    <div>
      Palabras: <span id="wordCount">0</span> • Idioma: 
      <select id="languageSelector" onchange="changeLanguage(this.value)">
        <option value="es-CR">Español (Costa Rica)</option>
        <option value="bribri">Bribri</option>
        <option value="cabecar">Cabécar</option>
        <option value="en">Inglés</option>
      </select>
    </div>
  </footer>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.0.0/docx.min.js"></script>
  <script src="editor.js"></script>
</body>
</html>
