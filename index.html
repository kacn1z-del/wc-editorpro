<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Editor Pro - Costa Rica 🇨🇷</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: #f5f5f5; 
    }
    
    /* PANTALLA DE INICIO - GALERÍA */
    #pantalla-inicio {
      display: block;
      min-height: 100vh;
      background: white;
    }
    .inicio-header {
      background: linear-gradient(135deg, #002B7F 0%, #CE1126 100%);
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #FFD700;
    }
    .inicio-header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 300;
    }
    .logo-tico {
      background: #FFD700;
      color: #002B7F;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 12px;
    }
    .busqueda-plantillas {
      padding: 30px 40px 20px 40px;
      background: #fafafa;
      border-bottom: 1px solid #e0e0e0;
    }
    .busqueda-plantillas input {
      width: 100%;
      max-width: 500px;
      padding: 12px 15px;
      border: 2px solid #FFD700;
      border-radius: 4px;
      font-size: 14px;
    }
    .galeria-plantillas {
      padding: 20px 40px 40px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1400px;
    }
    .plantilla-card {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .plantilla-card:hover {
      transform: translateY(-4px);
    }
    .plantilla-preview {
      width: 100%;
      aspect-ratio: 8.5/11;
      background: white;
      border: 1px solid #d0d0d0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 15px;
      font-size: 7px;
      overflow: hidden;
    }
    .plantilla-preview.en-blanco { background: white; }
    .plantilla-preview.carta { border-top: 4px solid #002B7F; }
    .plantilla-preview.cv { background: linear-gradient(to bottom, #002B7F 25%, white 25%); }
    .plantilla-preview.reporte { border-left: 4px solid #CE1126; }
    .plantilla-nombre {
      text-align: center;
      margin-top: 8px;
      font-size: 13px;
      color: #333;
      font-weight: 500;
    }

    /* EDITOR - OCULTO AL INICIO */
    #pantalla-editor { display: none; padding-bottom: 220px; }
   .wc-toolbar {
      width: 90%; max-width: 800px; margin: 20px auto 0 auto;
      background: #f3f2f1; padding: 8px; border-radius: 8px 8px 0 0;
      border: 1px solid #ddd; border-bottom: none; display: flex;
      flex-wrap: wrap; gap: 4px; align-items: center;
    }
   .wc-toolbar button, .wc-toolbar select {
      background: white; border: 1px solid #ccc; padding: 6px 8px;
      border-radius: 4px; cursor: pointer; font-size: 13px; height: 32px;
    }
   .wc-toolbar button:hover { background: #FFD700; border-color: #002B7F; }
   .wc-toolbar .separator { width: 1px; height: 24px; background: #ccc; margin: 0 4px; }
