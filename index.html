<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro</title>

<style>
body{
  margin:0;
  font-family:Segoe UI, Arial;
  background:#e9edf2;
}

/* ===== TOP BAR CORPORATIVA ===== */
.topbar{
  background:#244c6e;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 15px;
}

.topbar h1{
  font-size:15px;
  margin:0;
  letter-spacing:0.5px;
}

.menu button{
  background:transparent;
  border:none;
  color:white;
  margin:0 5px;
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

.menu button:hover{
  background:rgba(255,255,255,0.2);
}

/* ===== TOOLBAR ===== */
.toolbar{
  background:white;
  padding:8px;
  display:flex;
  gap:8px;
  border-bottom:1px solid #ddd;
}

.toolbar button{
  border:none;
  background:#f3f3f3;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.toolbar button:hover{
  background:#dcdcdc;
}

/* ===== LAYOUT ===== */
.container{
  display:flex;
  height:calc(100vh - 105px);
}

/* SIDEBAR */
.sidebar{
  width:300px;
  background:white;
  padding:10px;
  overflow:auto;
  border-right:1px solid #ddd;
}

/* CARD */
.card{
  background:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.card h3{
  margin:5px 0;
  font-size:14px;
}

/* INPUTS */
input,textarea,select{
  width:100%;
  padding:8px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:6px;
}

button.action{
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  background:#244c6e;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

/* EDITOR */
.editor{
  flex:1;
  display:flex;
  justify-content:center;
  padding:20px;
}

.page{
  width:850px;
  min-height:1100px;
  background:white;
  padding:50px;
  outline:none;
  box-shadow:0 0 20px rgba(0,0,0,0.15);
  border-radius:6px;
}

/* STATUS */
.status{
  background:#244c6e;
  color:white;
  padding:6px;
  font-size:12px;
  text-align:center;
}

/* MOBILE */
@media(max-width:768px){
  .sidebar{display:none;}
  .page{width:95%;}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <h1>📄 WC Corporate Editor Pro</h1>
  <div class="menu">
    <button onclick="save()">Guardar</button>
    <button onclick="exportDoc()">Exportar</button>
    <button onclick="voice()">🎤 Voz</button>
    <button onclick="speak()">🔊 Leer</button>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <button onclick="cmd('bold')"><b>B</b></button>
  <button onclick="cmd('italic')"><i>I</i></button>
  <button onclick="cmd('underline')"><u>U</u></button>
</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">

<div class="card">
<h3>🧠 IA Corporativa</h3>
<input id="ia">
<button class="action" onclick="ai()">Enviar</button>
<div id="iaOut"></div>
</div>

<div class="card">
<h3>🌍 Traductor</h3>
<textarea id="txt"></textarea>

<select id="lang">
<option value="en">ES → EN</option>
<option value="es">EN → ES</option>
<option value="bribri">ES → Bribri</option>
<option value="cabecar">ES → Cabécar</option>
</select>

<button class="action" onclick="translate()">Traducir</button>
<div id="out"></div>
</div>

<div class="card">
<h3>📚 Diccionario</h3>
<input id="word">
<button class="action" onclick="dict()">Buscar</button>
<div id="dictOut"></div>
</div>

</div>

<!-- EDITOR -->
<div class="editor">
<div class="page" contenteditable="true" id="editor">
Escribe tu documento en WC Corporate Editor Pro...
</div>
</div>

</div>

<div class="status">WC Corporate Editor Pro • Sistema activo</div>

<script>

/* ===== BASE LINGÜÍSTICA ===== */
const db = {
hola:{en:"hello",bribri:"sulá",cabecar:"shkö"},
casa:{en:"house",bribri:"yë",cabecar:"yö"},
agua:{en:"water",bribri:"itsá",cabecar:"itsá"}
};

/* ===== IA BASE ===== */
function ai(){
  let q=document.getElementById("ia").value;
  document.getElementById("iaOut").innerHTML=
  "🤖 WC IA: analizando → "+q;
}

/* ===== TRADUCTOR ===== */
function translate(){
  let t=document.getElementById("txt").value.toLowerCase();
  let l=document.getElementById("lang").value;

  Object.keys(db).forEach(k=>{
    let v=db[k];
    if(l==="en") t=t.replace(k,v.en);
    if(l==="es") t=t.replace(v.en,k);
    if(l==="bribri") t=t.replace(k,v.bribri);
    if(l==="cabecar") t=t.replace(k,v.cabecar);
  });

  document.getElementById("out").innerText=t;
}

/* ===== DICCIONARIO ===== */
function dict(){
  let w=document.getElementById("word").value.toLowerCase();
  let d=db[w];

  document.getElementById("dictOut").innerHTML=
  d?
  `EN: ${d.en}<br>Bribri: ${d.bribri}<br>Cabécar: ${d.cabecar}`
  :"No encontrado";
}

/* ===== FORMATO ===== */
function cmd(c){
  document.execCommand(c,false,null);
}

/* ===== GUARDAR ===== */
function save(){
  localStorage.setItem("wc_doc",
  document.getElementById("editor").innerHTML);
  alert("Documento guardado");
}

/* ===== AUTOCARGA ===== */
window.onload=()=>{
  let d=localStorage.getItem("wc_doc");
  if(d)document.getElementById("editor").innerHTML=d;
}

/* ===== EXPORTAR ===== */
function exportDoc(){
  let blob=new Blob([document.getElementById("editor").innerHTML],
  {type:"text/html"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="wc-documento.html";
  a.click();
}

/* ===== VOZ ===== */
function voice(){
  let r=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  r.lang="es-CR";
  r.start();
  r.onresult=e=>{
    document.getElementById("editor").innerText+=" "+e.results[0][0].transcript;
  }
}

/* ===== LEER ===== */
function speak(){
  let s=new SpeechSynthesisUtterance(
  document.getElementById("editor").innerText);
  s.lang="es-CR";
  speechSynthesis.speak(s);
}

</script>

</body>
</html>
