<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WC Corporate Editor Pro Suite</title>

<style>

/* =========================
   BASE
========================= */

html, body{
  margin:0;
  padding:0;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#e9eef5;
  height:100%;
}

/* =========================
   HEADER + IDIOMAS
========================= */

.header{
  background:linear-gradient(135deg,#1d5270,#92324f,#d94e18);
  color:white;
  padding:10px;
  font-weight:700;
  position:sticky;
  top:0;
  z-index:10;
}

.lang-bar{
  display:flex;
  gap:6px;
  padding:6px;
  background:rgba(255,255,255,0.95);
  border-bottom:1px solid #ddd;
  overflow-x:auto;
}

.lang-btn{
  padding:5px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  background:#f8fafc;
  font-size:12px;
}

.lang-btn.active{
  background:#1d5270;
  color:white;
}

/* =========================
   TABS
========================= */

.tabs-bar{
  display:flex;
  gap:6px;
  padding:6px;
  background:white;
  border-bottom:1px solid #ddd;
}

.tab{
  padding:6px 12px;
  border:1px solid #ccc;
  border-radius:6px;
  background:#f8fafc;
  font-size:12px;
  cursor:pointer;
}

.tab.active{
  background:#1d5270;
  color:white;
}

.tab-tools{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:#f1f5f9;
  border-bottom:1px solid #ddd;
}

/* =========================
   TOOLBAR BASE
========================= */

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:white;
  border-bottom:1px solid #ccc;
  position:sticky;
  top:90px;
  z-index:9;
}

button, select{
  padding:6px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  background:white;
  font-size:12px;
}

/* =========================
   EDITOR
========================= */

.page{
  margin:12px;
  background:white;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  padding:25px;
  min-height:70vh;
}

#editor{
  min-height:60vh;
  outline:none;
  font-size:16px;
  line-height:1.8;
}

/* =========================
   FOOTER
========================= */

.footer{
  display:flex;
  justify-content:space-between;
  padding:8px;
  font-size:12px;
  background:white;
  border-top:1px solid #ddd;
}

/* =========================
   IA FLOATING
========================= */

.ia-float{
  position:fixed;
  right:16px;
  bottom:90px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  z-index:999;
}

.ia-btn{
  background:#1d5270;
  color:white;
  border:none;
  border-radius:50px;
  padding:10px 14px;
}

.ia-panel{
  display:none;
  margin-top:8px;
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  width:180px;
}

.ia-panel button{
  width:100%;
  margin:4px 0;
}

/* =========================
   MACROS
========================= */

#macroBtn.recording{
  background:red;
  color:white;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">💼 WC Corporate Editor Pro Suite</div>

<!-- IDIOMAS -->
<div class="lang-bar">
<button class="lang-btn active" onclick="switchLang('es')">🇨🇷 ES</button>
<button class="lang-btn" onclick="switchLang('en')">🇺🇸 EN</button>
<button class="lang-btn" onclick="switchLang('br')">🌱 Bribri</button>
<button class="lang-btn" onclick="switchLang('ca')">🐾 Cabécar</button>
</div>

<!-- TABS -->
<div class="tabs-bar">
<div class="tab active" onclick="switchTab('inicio')">Inicio</div>
<div class="tab" onclick="switchTab('insertar')">Insertar</div>
<div class="tab" onclick="switchTab('diseno')">Diseño</div>
</div>

<div id="tab-tools" class="tab-tools"></div>

<!-- TOOLBAR -->
<div class="toolbar">

<button onclick="cmd('bold')">B</button>
<button onclick="cmd('italic')">I</button>
<button onclick="cmd('underline')">U</button>

<button onclick="cmd('insertUnorderedList')">•</button>
<button onclick="cmd('insertOrderedList')">1.</button>

<button onclick="cmd('justifyLeft')">⬅</button>
<button onclick="cmd('justifyCenter')">↔</button>
<button onclick="cmd('justifyRight')">➡</button>

<button onclick="save()">💾</button>

<button id="macroBtn" onclick="toggleMacro()">⏺️ Macro</button>
<button onclick="playMacro()">▶️</button>

</div>

<!-- EDITOR -->
<div class="page">
<div id="editor" contenteditable="true">
<h2>WC Document</h2>
<p>Editor consolidado funcionando correctamente.</p>
</div>
</div>

<!-- FOOTER -->
<div class="footer">
<span id="counter">0 palabras</span>
<span>WC Engine Stable</span>
</div>

<!-- IA FLOAT -->
<div class="ia-float">

<button class="ia-btn" onclick="toggleIA()">💼 IA</button>

<div id="ia-panel" class="ia-panel">
<button onclick="ia('rewrite')">Reescribir</button>
<button onclick="ia('formal')">Formal</button>
<button onclick="ia('summary')">Resumen</button>
</div>

</div>

<script>

/* =========================
   EDITOR CORE
========================= */

const editor = document.getElementById("editor");

function cmd(a){ document.execCommand(a,false,null); update(); }

function save(){
  localStorage.setItem("wc", editor.innerHTML);
}

window.onload = () => {
  const s = localStorage.getItem("wc");
  if(s) editor.innerHTML = s;
  renderTabs();
  update();
};

/* =========================
   COUNTER
========================= */

function update(){
  const t = editor.innerText || "";
  document.getElementById("counter").innerText =
    (t.trim() ? t.split(/\s+/).length : 0) + " palabras";
}

editor.addEventListener("input", update);

/* =========================
   TABS
========================= */

let currentTab = "inicio";

const tabs = {
  inicio: [{t:"Negrita",a:()=>cmd("bold")}],
  insertar: [{t:"Tabla",a:insertTable}],
  diseno: [{t:"Color",a:()=>editor.style.color="#1d5270"}]
};

function switchTab(t){
  currentTab = t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  event.target.classList.add("active");
  renderTabs();
}

function renderTabs(){
  const c = document.getElementById("tab-tools");
  c.innerHTML = "";
  (tabs[currentTab]||[]).forEach(b=>{
    let btn = document.createElement("button");
    btn.textContent = b.t;
    btn.onclick = b.a;
    c.appendChild(btn);
  });
}

function insertTable(){
  document.execCommand("insertHTML",false,
  "<table border='1' style='width:100%'><tr><td>A</td><td>B</td></tr></table>");
}

/* =========================
   IA (SIMULADA)
========================= */

function toggleIA(){
  const p = document.getElementById("ia-panel");
  p.style.display = p.style.display==="block"?"none":"block";
}

function ia(type){
  editor.innerHTML += "\n\n[IA: "+type+"]";
}

/* =========================
   IDIOMAS
========================= */

function switchLang(l){
  alert("Idioma: "+l);
}

/* =========================
   MACROS
========================= */

let macro=[];
let recording=false;

function toggleMacro(){
  const b=document.getElementById("macroBtn");

  recording=!recording;

  if(recording){
    macro=[];
    b.classList.add("recording");
    b.innerText="Grabando...";
  }else{
    b.classList.remove("recording");
    b.innerText="⏺️ Macro";
  }
}

function record(a){
  if(recording) macro.push(a);
}

function playMacro(){
  macro.forEach(a=>cmd(a));
}

</script>

</body>
</html>
