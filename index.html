<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC Editor Suite - Costa Rica 🇨🇷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Calibri, Arial, sans-serif;
      background: #f3f2f1;
      overflow: hidden;
      height: 100vh;
    }

    /* BACKSTAGE */
    #backstage {
      display: flex;
      height: 100vh;
      background: white;
    }
    #editor-view { display: none; height: 100vh; flex-direction: column; }

    /* MENÚ AZUL */
  .backstage-nav {
      width: 220px;
      background: #2b579a;
      color: white;
      display: flex;
      flex-direction: column;
    }
  .backstage-nav-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
  .back-btn {
      width: 32px; height: 32px;
      border: 2px solid white;
      border-radius: 50%;
      background: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
  .nav-item {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 14px;
      border: none;
      background: none;
      color: white;
      text-align: left;
      width: 100%;
    }
  .nav-item:hover { background: rgba(255,255,255,0.1); }
  .nav-item.active {
      background: #1e3a5f;
      border-left: 3px solid #FFD700;
    }
  .nav-divider {
      height: 1px;
      background: rgba(255,255,255,0.2);
      margin: 8px 0;
    }

    /* CONTENIDO */
  .backstage-content {
      flex: 1;
      padding: 32px 48px;
      overflow-y: auto;
    }
  .backstage-title {
      font-size: 32px;
      font-weight: 300;
      color: #323130;
      margin-bottom: 24px;
    }
  .search-templates {
      width: 100%;
      max-width: 600px;
      padding: 8px 12px;
      border: 1px solid #8a8886;
      border-radius: 2px;
      font-size: 14px;
      margin-bottom: 16px;
    }
  .suggested-searches {
