<script>
  let currentTab = 'inicio';
  
  function changeTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-node').forEach(t => t.classList.remove('active'));
    document.getElementById('t-' + tab).classList.add('active');
    renderPanel();
  }

  function renderPanel() {
    const p = document.getElementById('panelComandos');
    p.innerHTML = "";
    if (currentTab === 'inicio') {
        p.innerHTML = `<button class="cmd-btn" onclick="exec('cut')">✂️ Cortar</button>
                       <button class="cmd-btn" onclick="exec('copy')">📄 Copiar</button>
                       <button class="cmd-btn" onclick="exec('paste')">📋 Pegar</button>`;
    } else if (currentTab === 'insertar') {
        p.innerHTML = `<button class="cmd-btn" onclick="insertBreak('page')">📄 Salto Pág.</button>
                       <button class="cmd-btn" onclick="insertBreak('section')">🛡️ Salto Secc.</button>`;
    } else {
        p.innerHTML = `<button class="cmd-btn" onclick="changeMargin('15px')">📐 Margen Estrecho</button>`;
    }
  }

  // LÓGICA ACTIVADA: Ahora los botones ejecutan acciones reales del navegador
  function exec(cmd) {
    document.getElementById('lienzoTexto').focus();
    try {
        document.execCommand(cmd, false, null);
    } catch (e) {
        console.log("Acción no soportada en este entorno");
    }
  }

  function insertBreak(type) {
    document.getElementById('lienzoTexto').focus();
    const style = type === 'section' ? '3px double #1d5270' : '2px dashed #92324f';
    document.execCommand('insertHTML', false, `<hr style="border:0; border-top:${style}; margin:20px 0;">`);
  }

  function changeMargin(m) {
    document.getElementById('lienzoTexto').style.padding = m;
  }

  // Inicializar
  renderPanel();
</script>
