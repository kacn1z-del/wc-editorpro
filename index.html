<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC Corporate Editor v20.4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #0084ff 0%, #ff6b35 100%); padding: 24px 20px 140px 20px; text-align: center; color: white; }
        .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .header p { font-size: 12px; opacity: 0.9; letter-spacing: 1px; }
        .menu-card { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 20px; margin: -100px 20px 0 20px; position: relative; z-index: 10; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
        .menu-row { display: flex; justify-content: space-around; margin-bottom: 16px; }
        .menu-col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .menu-btn { background: none; border: none; color: #1a1a1a; font-size: 15px; font-weight: 500; padding: 8px 12px; cursor: pointer; border-radius: 8px; }
        .menu-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .dropdown { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); padding: 8px; display: none; z-index: 100; min-width: 200px; }
        .dropdown.show { display: block; }
        .dropdown-item { padding: 10px 16px; cursor: pointer; font-size: 14px; }
        .dropdown-item:hover { background: #f0f7ff; }
        .content { background: #ffffff; padding: 24px 20px 100px 20px; min-height: 500px; }
        .tiptap { border: 1px solid #ddd; border-radius: 12px; padding: 16px; min-height: 300px; outline: none; }
        .footer { background: #ffffff; padding: 16px 20px; border-top: 1px solid #eee; position: fixed; bottom: 60px; left: 0; right: 0; }
        .stats { display: flex; justify-content: space-around; font-size: 13px; color: #666; }
        .author { text-align: center; font-size: 12px; color: #999; margin-top: 5px; }
        .toast { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>WC Corporate Editor v20.4</h1>
        <p>ESTÉTICA EJECUTIVA</p>
    </div>
    
    <div class="menu-card">
        <div class="menu-row">
            <button class="menu-btn" data-menu="inicio">Inicio</button>
            <button class="menu-btn" data-menu="archivo">Archivo</button>
            <button class="menu-btn" data-menu="lenguas">Lenguas</button>
        </div>
        
        <!-- Menús Dropdown -->
        <div class="dropdown" id="menu-inicio">
            <div class="dropdown-item" data-action="new">Nuevo documento</div>
        </div>
        <div class="dropdown" id="menu-archivo">
            <div class="dropdown-item" data-action="save">Guardar</div>
        </div>
        <div class="dropdown" id="menu-lenguas">
            <div class="dropdown-item" data-action="lang-espanol">Español</div>
            <div class="dropdown-item" data-action="lang-ingles">English</div>
            <div class="dropdown-item" data-action="lang-bribri">Bribri</div>
            <div class="dropdown-item" data-action="lang-cabecar">Cabécar</div>
            <div class="dropdown-item" data-action="lang-maleku">Maleku</div>
        </div>
    </div>
    
    <div class="content">
        <div class="content-title" id="contentTitle">📋 Diccionario 300 palabras - Lenguas Indígenas CR</div>
        <div id="editor"></div>
    </div>
    
    <div class="footer">
        <div class="stats">
            <span id="wordCount">✓ 0 palabras</span>
            <span id="charCount">✓ 0 caracteres</span>
        </div>
        <div class="author">Por Keny Chinchilla Navarro</div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script type="module">
        import { Editor } from 'https://esm.sh/@tiptap/core@2.6.6';
        import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.6.6';
        import Underline from 'https://esm.sh/@tiptap/extension-underline@2.6.6';
        import TextAlign from 'https://esm.sh/@tiptap/extension-text-align@2.6.6';
        import TextStyle from 'https://esm.sh/@tiptap/extension-text-style@2.6.6';
        import Color from 'https://esm.sh/@tiptap/extension-color@2.6.6';

        const editor = new Editor({
            element: document.querySelector('#editor'),
            extensions: [StarterKit, Underline, TextAlign.configure({ types: ['heading', 'paragraph'] }), TextStyle, Color],
            content: `<h2>Lenguas Indígenas de Costa Rica</h2><p>Selecciona un idioma en el menú para comenzar.</p>`,
            onUpdate: ({ editor }) => updateStats(),
        });

        const uiLangs = {
            espanol: { title: '📋 Diccionario 300 palabras - Lenguas Indígenas CR', header: 'WC Corporate Editor v20.4', sub: 'ESTÉTICA EJECUTIVA', content: '<h2>Lenguas Indígenas</h2><p>Bienvenido al editor.</p>' },
            ingles: { title: '📋 300-word Dictionary - Indigenous Languages CR', header: 'WC Corporate Editor v20.4', sub: 'EXECUTIVE AESTHETICS', content: '<h2>Indigenous Languages</h2><p>Welcome to the editor.</p>' },
            bribri: { title: '📋 Ña tsuru 300 bribri', header: 'WC Corporate Editor v20.4', sub: 'BRIBRI UI - ESTÉTICA INDÍGENA', content: '<h2>Bribri Siwá</h2><p>Shkëkë (Hola)</p>' },
            cabecar: { title: '📋 Cabécar 300 yë́', header: 'WC Corporate Editor v20.4', sub: 'CABÉCAR UI - ESTÉTICA INDÍGENA', content: '<h2>Cabécar Yë́</h2><p>Ká bë́rë (Buenos días)</p>' },
            maleku: { title: '📋 Maleku 300 lhamaráma', header: 'WC Corporate Editor v20.4', sub: 'MALEKU UI - ESTÉTICA INDÍGENA', content: '<h2>Maleku</h2><p>Ma lha maráma (Buenas tardes)</p>' }
        };

        function updateStats() {
            const text = editor.getText();
            const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            document.getElementById('wordCount').textContent = `✓ ${words} palabras`;
            document.getElementById('charCount').textContent = `✓ ${text.length} caracteres`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function switchLang(langKey) {
            const ui = uiLangs[langKey] || uiLangs.espanol;
            document.getElementById('contentTitle').textContent = ui.title;
            document.querySelector('.header h1').textContent = ui.header;
            document.querySelector('.header p').textContent = ui.sub;
            editor.commands.setContent(ui.content);
            showToast(`Idioma: ${langKey.toUpperCase()}`);
        }

        // Lógica de menús
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const menuId = 'menu-' + btn.dataset.menu;
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
                document.getElementById(menuId).classList.add('show');
            });
        });

        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const action = item.dataset.action;
                if (action.startsWith('lang-')) {
                    switchLang(action.replace('lang-', ''));
                } else {
                    showToast(`Acción: ${action}`);
                }
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
        });
    </script>
</body>
</html>
