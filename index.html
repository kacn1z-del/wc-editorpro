<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WC Word Editor Stable</title>

<style>

:root{
  --blue:#1d5270;
  --red:#92324f;
  --orange:#d94e18;
  --border:#cbd5e1;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}

body{
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#eef2f7;
  overflow:hidden;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,var(--blue),var(--red),var(--orange));
  color:white;
  padding:12px;
  font-weight:800;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  gap:6px;
  padding:10px;
  background:white;
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  flex-shrink:0;
}

.toolbar button,
.toolbar select{
  padding:7px 10px;
  border:1px solid var(--border);
  background:white;
  border-radius:8px;
  cursor:pointer;
}

/* WORKSPACE */

.workspace{
  flex:1;
  display:flex;
  justify-content:center;
  padding:20px;
  overflow:auto;
}

.page{
  width:100%;
  max-width:900px;
  background:white;
  padding:40px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

/* EDITOR */

#editor{
  min-height:750px;
  outline:none;
  font-size:16px;
  line-height:1.8;
}

/* FOOTER */

.footer{
  height:38px;
  background:white;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  font-size:12px;
  color:#475569;
  flex-shrink:0;
}

/* FLOAT MENU */

.floating{
  position:fixed;
  right:18px;
  bottom:120px;
}

.fab{
  background:linear-gradient(135deg,var(--blue),var(--red));
  color:white;
  border:none;
  padding:14px 18px;
  border-radius:50px;
  font-weight:700;
  cursor:pointer;
}

.menu{
  display:none;
  position:absolute;
  bottom:110%;
  right:0;
  background:#0f172a;
  padding:12px;
  border-radius:12px;
  width:220px;
  gap:8px;
  flex-direction:column;
}

.menu.show{
  display:flex;
}

.menu button{
  background:#1e293b;
  color:white;
  border:none;
  padding:8px;
  border-radius:8px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
💎 WC Word Editor Stable PRO
</div>

<!-- TOOLBAR -->
<div class="toolbar">

<button onclick="exec('bold')"><b>B</b></button>
<button onclick="exec('italic')"><i>I</i></button>
<button onclick="exec('underline')"><u>U</u></button>

<button onclick="exec('insertUnorderedList')">• Lista</button>
<button onclick="exec('insertOrderedList')">1. Lista</button>

<button onclick="exec('justifyLeft')">⬅</button>
<button onclick="exec('justifyCenter')">↔</button>
<button onclick="exec('justifyRight')">➡</button>

<select onchange="fontSize(this.value)">
  <option value="3">14px</option>
  <option value="4" selected>16px</option>
  <option value="5">20px</option>
</select>

<button onclick="color('#1d5270')">Azul</button>
<button onclick="color('#92324f')">Rojo</button>
<button onclick="color('#d94e18')">Naranja</button>

<button onclick="undo()">↩</button>
<button onclick="redo()">↪</button>

<button onclick="save()">💾</button>

</div>

<!-- WORKSPACE -->
<div class="workspace">
  <div class="page">
    <div id="editor" contenteditable="true"></div>
  </div>
</div>

<!-- FLOAT MENU -->
<div class="floating">

<button class="fab" onclick="toggleMenu()">💼 IA</button>

<div class="menu" id="menu">

<button onclick="insertText('Resumen automático...')">🧠 Resumen</button>
<button onclick="insertText('Texto mejorado...')">✨ Mejorar</button>
<button onclick="clearDoc()">🧹 Limpiar</button>

</div>

</div>

<!-- FOOTER -->
<div class="footer">

<span id="counter">0 palabras | 0 caracteres</span>
<span>WC Engine Stable</span>

</div>

<script>

let editor;

window.addEventListener('DOMContentLoaded', () => {

  editor = document.getElementById('editor');

  editor.contentEditable = true;

  editor.innerHTML = localStorage.getItem('wc_doc') || `
    <h1>Documento WC Word</h1>
    <p>Editor estable listo para usar.</p>
  `;

  editor.addEventListener('input', updateCounter);

  editor.addEventListener('click', () => editor.focus());

  updateCounter();
});

/* 🔥 CORE FIX: SIEMPRE SELECCIÓN + FOCO */

function exec(cmd){

  editor.focus();

  const sel = window.getSelection();

  if (!sel.rangeCount) {
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.execCommand(cmd, false, null);

  updateCounter();
}

/* FONT SIZE */

function fontSize(v){
  editor.focus();
  document.execCommand('fontSize', false, v);
}

/* COLOR */

function color(c){
  editor.focus();
  document.execCommand('foreColor', false, c);
}

/* UNDO REDO */

function undo(){
  document.execCommand('undo');
}

function redo(){
  document.execCommand('redo');
}

/* SAVE */

function save(){
  localStorage.setItem('wc_doc', editor.innerHTML);
  alert("Guardado");
}

/* IA MENU */

function toggleMenu(){
  document.getElementById('menu').classList.toggle('show');
}

function insertText(text){
  editor.focus();
  document.execCommand('insertText', false, text);
  updateCounter();
}

function clearDoc(){
  editor.innerHTML = "";
}

/* COUNTER */

function updateCounter(){

  const text = editor.innerText || "";

  const words = text.trim()
    ? text.trim().split(/\s+/).length
    : 0;

  document.getElementById('counter').innerText =
    `${words} palabras | ${text.length} caracteres`;
}

</script>

</body>
</html>
