<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC STABLE CORE</title>

<style>
body{margin:0;font-family:system-ui;background:#eef2f7}

.header{
  background:#1d5270;
  color:white;
  padding:10px;
  font-weight:700;
}

.toolbar{
  display:flex;
  gap:6px;
  padding:8px;
  background:white;
}

button{
  padding:8px;
  border:1px solid #ccc;
  background:white;
  border-radius:6px;
}

#editor{
  margin:10px;
  padding:16px;
  min-height:60vh;
  background:white;
  border-radius:10px;
  outline:none;
}
</style>
</head>

<body>

<div class="header">WC STABLE CORE (SIN ERRORES)</div>

<div class="toolbar">
<button onclick="fmt('bold')">B</button>
<button onclick="fmt('italic')">I</button>
<button onclick="fmt('underline')">U</button>
<button onclick="ins('• ')">Lista</button>
</div>

<div id="editor" contenteditable="true">Escribe aquí...</div>

<script>

const editor = document.getElementById("editor");

/* ===== SAFE FOCUS ===== */
function focusEditor(){
  editor.focus();
}

/* ===== SAFE FORMAT ===== */
function fmt(cmd){
  try{
    focusEditor();
    document.execCommand(cmd,false,null);
  }catch(e){
    console.log("format error",e);
  }
}

/* ===== SAFE INSERT (SIN ROMPER NADA) ===== */
function ins(text){
  try{
    focusEditor();

    let sel = window.getSelection();

    if(!sel || !sel.rangeCount){
      editor.innerText += text;
      return;
    }

    let range = sel.getRangeAt(0);
    range.deleteContents();

    let node = document.createTextNode(text);
    range.insertNode(node);

    range.setStartAfter(node);
    range.setEndAfter(node);

    sel.removeAllRanges();
    sel.addRange(range);

  }catch(e){
    console.log("insert error",e);
  }
}

</script>

</body>
</html>
