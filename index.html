<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC Corporate Editor v20.4</title>
    <style>
        /* [Tu CSS original se mantiene igual] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #0084ff 0%, #ff6b35 100%); padding: 24px 20px 140px 20px; text-align: center; color: white; }
        .menu-card { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 20px; margin: -100px 20px 0 20px; position: relative; z-index: 10; }
        .menu-row { display: flex; justify-content: space-around; margin-bottom: 16px; }
        .menu-col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .menu-btn { background: none; border: none; color: white; font-size: 15px; cursor: pointer; padding: 8px; }
        .dropdown { position: absolute; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); padding: 8px; display: none; z-index: 100; min-width: 200px; }
        .dropdown.show { display: block; }
        .dropdown-item { padding: 10px 16px; cursor: pointer; color: #333; }
        .dropdown-item:hover { background: #f0f7ff; }
        .content { background: #ffffff; padding: 24px 20px 100px 20px; min-height: 500px; }
        .tiptap { border: 1px solid #ddd; border-radius: 12px; padding: 16px; min-height: 300px; }
        .toast { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; z-index: 1000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="header"><h1>WC Corporate Editor v20.4</h1><p>ESTÉTICA EJECUTIVA</p></div>
    <div class="menu-card">
        <div class="menu-row">
            <button class="menu-btn" data-menu="inicio">Inicio</button>
            <button class="menu-btn" data-menu="archivo">Archivo</button>
            <button class="menu-btn" data-menu="lenguas">Lenguas Indígenas</button>
        </div>
        <div class="menu-col">
            <button class="menu-btn" data-menu="formato">Formato</button>
        </div>
    </div>
    
    <div class="dropdown" id="menu-inicio"><div class="dropdown-item" data-action="new">Nuevo</div></div>
    <div class="dropdown" id="menu-archivo"><div class="dropdown-item" data-action="save">Guardar</div></div>
    <div class="dropdown" id="menu-lenguas">
        <div class="dropdown-item" data-action="lang-espanol">Español</div>
        <div class="dropdown-item" data-action="lang-ingles">English</div>
        <div class="dropdown-item" data-action="lang-bribri">Bribri</div>
    </div>
    <div class="dropdown" id="menu-formato">
        <div class="dropdown-item" data-action="bold">Negrita</div>
        <div class="dropdown-item" data-action="italic">Cursiva</div>
    </div>

    <div class="content"><div id="contentTitle">Editor</div><div id="editor"></div></div>
    <div class="toast" id="toast"></div>

    <script type="module">
        import { Editor } from 'https://esm.sh/@tiptap/core@2.6.6';
        import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.6.6';
        import Underline from 'https://esm.sh/@tiptap/extension-underline@2.6.6';
        import TextAlign from 'https://esm.sh/@tiptap/extension-text-align@2.6.6';
        import TextStyle from 'https://esm.sh/@tiptap/extension-text-style@2.6.6';
        import Color from 'https://esm.sh/@tiptap/extension-color@2.6.6';

        const editor = new Editor({
            element: document.querySelector('#editor'),
            extensions: [StarterKit, Underline, TextAlign.configure({ types: ['heading', 'paragraph'] }), TextStyle, Color],
            content: '<p>Bienvenido.</p>'
        });

        const uiLangs = {
            espanol: { title: 'Español', content: '<p>Bienvenido al editor.</p>' },
            ingles: { title: 'English', content: '<p>Welcome to the editor.</p>' },
            bribri: { title: 'Bribri', content: '<p>Shkëkë (Hola).</p>' }
        };

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Lógica unificada
        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
                document.getElementById('menu-' + btn.dataset.menu).classList.toggle('show');
            });
        });

        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const action = item.dataset.action;
                if (action.startsWith('lang-')) {
                    const lang = action.split('-')[1];
                    editor.commands.setContent(uiLangs[lang].content);
                    document.getElementById('contentTitle').textContent = uiLangs[lang].title;
                } else {
                    // Aquí mantienes el switch con todos tus casos: bold, italic, save, etc.
                    switch(action) {
                        case 'bold': editor.chain().focus().toggleBold().run(); break;
                        case 'italic': editor.chain().focus().toggleItalic().run(); break;
                        case 'save': localStorage.setItem('data', editor.getHTML()); showToast('Guardado'); break;
                    }
                }
                document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
            });
        });
    </script>
</body>
</html>
