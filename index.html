<script type="module">
    import { Editor } from 'https://esm.sh/@tiptap/core@2.6.6'
    import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.6.6'
    import Underline from 'https://esm.sh/@tiptap/extension-underline@2.6.6'
    import TextAlign from 'https://esm.sh/@tiptap/extension-text-align@2.6.6'
    import TextStyle from 'https://esm.sh/@tiptap/extension-text-style@2.6.6'
    import Color from 'https://esm.sh/@tiptap/extension-color@2.6.6'
    
    const editor = new Editor({
        element: document.querySelector('#editor'),
        extensions: [
            StarterKit,
            Underline,
            TextAlign.configure({ types: ['heading', 'paragraph'] }),
            TextStyle,
            Color,
        ],
        content: `<h2>Lenguas Indígenas de Costa Rica</h2><p>Selecciona un idioma en el menú para comenzar.</p>`,
        onUpdate: ({ editor }) => updateStats(),
    });

    function updateStats() {
        const text = editor.getText();
        const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
        const chars = text.length;
        document.getElementById('wordCount').textContent = `✓ ${words} palabras`;
        document.getElementById('charCount').textContent = `✓ ${chars} caracteres`;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ── Traducciones y Contenido por Idioma ──
    const langData = {
        espanol: {
            title: '📋 Diccionario 300 palabras - Lenguas Indígenas CR',
            header: 'WC Corporate Editor v20.4',
            sub: 'ULTIMATE PRO UI v26 - ESTÉTICA EJECUTIVA',
            content: '<h2>Lenguas Indígenas de Costa Rica</h2><p><strong>Bribri:</strong> Hola = Shkëkë</p><p><strong>Cabécar:</strong> Buenos días = Ká bë́rë</p>'
        },
        ingles: {
            title: '📋 300-word Dictionary - Indigenous Languages CR',
            header: 'WC Corporate Editor v20.4',
            sub: 'ULTIMATE PRO UI v26 - EXECUTIVE AESTHETICS',
            content: '<h2>Indigenous Languages of Costa Rica</h2><p><strong>Bribri:</strong> Hello = Shkëkë</p><p><strong>Cabécar:</strong> Good morning = Ká bë́rë</p>'
        },
        bribri: {
            title: '📋 Ña tsuru 300 bribri - Lenguas Indígenas CR',
            header: 'WC Corporate Editor v20.4',
            sub: 'BRIBRI UI - ESTÉTICA INDÍGENA',
            content: '<h2>Bribri Siwá</h2><p><strong>Hola:</strong> Shkëkë</p><p><strong>¿Cómo estás?:</strong> ¿Kë́këwë́?</p>'
        },
        cabecar: {
            title: '📋 Cabécar 300 yë́ - Lenguas Indígenas CR',
            header: 'WC Corporate Editor v20.4',
            sub: 'CABÉCAR UI - ESTÉTICA INDÍGENA',
            content: '<h2>Cabécar Yë́</h2><p><strong>Buenos días:</strong> Ká bë́rë</p><p><strong>Gracias:</strong> Skë́</p>'
        }
    };

    function switchLang(lang) {
        const ui = langData[lang] || langData.espanol;
        // Cambiar títulos
        document.getElementById('contentTitle').textContent = ui.title;
        document.querySelector('.header h1').textContent = ui.header;
        document.querySelector('.header p').textContent = ui.sub;
        // Cambiar contenido del editor
        editor.commands.setContent(ui.content);
        document.documentElement.lang = lang === 'ingles' ? 'en' : 'es';
        showToast(`Idioma cambiado a: ${lang.charAt(0).toUpperCase() + lang.slice(1)}`);
    }

    // ── Lógica de menús, acciones y resto igual... ──
    // (Mantén el resto de tu código de eventos y handleAction aquí abajo intacto)
    // ...
</script>
