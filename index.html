<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WC iPhone Fix Editor</title>

<style>

/* 🔥 CLAVE iOS */
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* TOOLBAR SIMPLE */
.toolbar {
  position: sticky;
  top: 0;
  background: #fff;
  display: flex;
  gap: 6px;
  padding: 10px;
  border-bottom: 1px solid #ccc;
  z-index: 10;
}

/* 🔥 EDITOR iOS SAFE */
#editor {
  min-height: 80vh;
  padding: 20px;
  margin: 10px;
  background: white;
  border-radius: 10px;

  outline: none;

  /* CLAVE iPHONE */
  -webkit-user-select: text;
  user-select: text;

  /* evita bloqueo de toque */
  touch-action: auto;
}

button {
  padding: 8px;
}

</style>
</head>

<body>

<div class="toolbar">
  <button onclick="cmd('bold')">B</button>
  <button onclick="cmd('italic')">I</button>
  <button onclick="cmd('underline')">U</button>
</div>

<div id="editor" contenteditable="true">
Escribe aquí en iPhone...
</div>

<script>

const editor = document.getElementById("editor");

/* 🔥 CLAVE iOS: focus retrasado */
window.onload = () => {
  setTimeout(() => {
    editor.focus();
  }, 300);
};

editor.addEventListener("touchstart", () => {
  editor.focus();
});

function cmd(c){
  document.execCommand(c, false, null);
}

</script>

</body>
</html>
