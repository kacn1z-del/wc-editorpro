<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WC Corporate Editor v22.6 - Platinum</title>
<style>
/* CSS: Mantenido de tu v21.4 original */
:root { --bg-gradient: linear-gradient(135deg, #1d5270 0%, #92324f 50%, #d94e18 100%); --dark-dropdown-bg: #111827; }
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.header-suite { background: var(--bg-gradient); padding: 12px; color: white; }
.mobile-tabs-scroll { display: flex; gap: 5px; overflow-x: auto; padding: 5px; }
.tab-node { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 5px; color: white; cursor: pointer; }
.tab-node.active { background: white; color: black; }
.ribbon-commands-panel { background: #e2e8f0; padding: 10px; display: flex; gap: 5px; }
.cmd-btn { padding: 5px 10px; background: white; border: 1px solid #cbd5e1; cursor: pointer; border-radius: 4px; }
.workspace { flex: 1; overflow-y: auto; padding: 20px; display: flex; justify-content: center; background: #cbd5e1; }
.paper { width: 100%; max-width: 650px; background: white; min-height: 600px; padding: 40px; outline: none; }
.floating-corporate-container { position: absolute; bottom: 150px; right: 20px; z-index: 999; }
.trigger-menu-btn { background: var(--bg-gradient); color: white; border: none; padding: 15px 25px; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
</style>
</head>
<body>

  <div class="header-suite">
    <h3>WC Corporate Editor</h3>
    <div class="mobile-tabs-scroll">
      <div class="tab-node active" id="t-inicio" onclick="changeTab('inicio')">Inicio</div>
      <div class="tab-node" id="t-insertar" onclick="changeTab('insertar')">Insertar</div>
    </div>
  </div>

  <div class="ribbon-commands-panel" id="panelComandos"></div>

  <div class="workspace">
    <div class="paper" contenteditable="true" id="lienzoTexto">Escribe aquí...</div>
  </div>

  <div class="floating-corporate-container">
    <button class="trigger-menu-btn" onclick="alert('Funciones activas')">Herramientas</button>
  </div>

<script>
// Lógica base que garantiza que no se quede en blanco
let currentTab = 'inicio';

function changeTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-node').forEach(t => t.classList.remove('active'));
    document.getElementById('t-' + tab).classList.add('active');
    renderPanel();
}

function renderPanel() {
    const p = document.getElementById('panelComandos');
    p.innerHTML = '';
    if(currentTab === 'inicio') {
        p.innerHTML = `<button class="cmd-btn" onclick="exec('cut')">✂️ Cortar</button>
                       <button class="cmd-btn" onclick="exec('copy')">📄 Copiar</button>
                       <button class="cmd-btn" onclick="insertList()">🔢 Lista</button>`;
    } else {
        p.innerHTML = `<button class="cmd-btn" onclick="insertBreak()">📄 Salto Página</button>`;
    }
}

function exec(cmd) { document.execCommand(cmd, false, null); }
function insertList() { document.execCommand('insertHTML', false, '<ol><li>Nivel 1<ul><li>Nivel 2</li></ul></li></ol>'); }
function insertBreak() { document.execCommand('insertHTML', false, '<hr>'); }

// Inicializar
renderPanel();
</script>
</body>
</html>
