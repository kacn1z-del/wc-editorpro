<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WC Editor Suite PRO - Costa Rica 🇨🇷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f3f2f1; overflow: hidden; height: 100vh; }
    #backstage { display: flex; height: 100vh; background: white; }
    #editor-view { display: none; height: 100vh; flex-direction: column; }
   :root { --azul: #002B7F; --rojo: #CE1126; --dorado: #FFD700; --verde: #006847; }
  .backstage-nav { width: 280px; background: var(--azul); color: white; display: flex; flex-direction: column; overflow-y: auto; }
  .backstage-nav-header { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); background: var(--rojo); position: sticky; top: 0; z-index: 10; }
  .back-btn { width: 32px; height: 32px; border: 2px solid white; border-radius: 50%; background: none; color: white; cursor: pointer; font-size: 18px; }
  .nav-item { padding: 12px 20px; cursor: pointer; font-size: 14px; border: none; background: none; color: white; text-align: left; width: 100%; display: flex; align-items: center; gap: 12px; }
  .nav-item:active { background: rgba(255,255,255,0.2); }
  .nav-item.active { background: #001F5C; border-left: 3px solid var(--dorado); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .nav-separator { height: 1px; background: rgba(255,255,255,0.2); margin: 8px 16px; }
  .backstage-content { flex: 1; padding: 24px; overflow-y: auto; background: #faf9f8; }
  .backstage-title { font-size: 32px; font-weight: 300; color: var(--azul); margin-bottom: 20px; }
  .idioma-selector { margin-bottom: 20px; padding: 12px; background: white; border-radius: 4px; border-left: 4px solid var(--rojo); }
  .idioma-selector label { font-weight: 600; margin-right: 12px; color: var(--azul); }
  .idioma-selector select { padding: 6px 12px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
  .vocabulario-panel { background: white; border: 1px solid #e1dfdd; border-radius: 4px; padding: 16px; margin-bottom: 20px; display: none; }
  .vocabulario-panel.active { display: block; }
  .vocabulario-panel h3 { color: var(--verde); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .vocabulario-buscar { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; margin-bottom: 12px; }
  .vocabulario-lista { max-height: 200px; overflow-y: auto; }
  .vocabulario-item { padding: 8px; border-bottom: 1px solid #f3f2f1; cursor: pointer; }
  .vocabulario-item:active { background: #f3f2f1; }
  .vocabulario-es { font-weight: 600; color: var(--azul); }
  .vocabulario-bribri { color: var(--verde); font-style: italic; }
  .vocabulario-cabecar { color: #8B4513; font-style: italic; }
