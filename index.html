<script type="module">

import { Editor } from 'https://esm.sh/@tiptap/core'
import StarterKit from 'https://esm.sh/@tiptap/starter-kit'
import Underline from 'https://esm.sh/@tiptap/extension-underline'
import TextStyle from 'https://esm.sh/@tiptap/extension-text-style'
import Color from 'https://esm.sh/@tiptap/extension-color'

let editor;

/* INICIALIZAR */

function initEditor(){

  editor = new Editor({

    element: document.querySelector('#editor'),

    extensions: [
      StarterKit,
      Underline,
      TextStyle,
      Color
    ],

    content: `
      <h1>WC Corporate Editor Platinum</h1>

      <p>
      Bienvenido al nuevo motor TipTap.
      </p>
    `,

    onUpdate(){

      updateCounters();

      localStorage.setItem(
        'wc_doc',
        editor.getHTML()
      );
    }

  });

  updateCounters();
}

/* CONTADOR */

function updateCounters(){

  if(!editor) return;

  const text = editor.getText();

  const words =
    text.trim() === ''
    ? 0
    : text.trim().split(/\s+/).length;

  document.getElementById('lblContador')
    .textContent =
    `${words} palabras | ${text.length} caracteres`;
}

/* MENU */

window.toggleCorporateMenu = () => {

  document
    .getElementById('corporateDropdown')
    .classList
    .toggle('show');
}

/* BOTONES */

window.boldText = () => {
  editor.chain().focus().toggleBold().run();
}

window.italicText = () => {
  editor.chain().focus().toggleItalic().run();
}

window.underlineText = () => {
  editor.chain().focus().toggleUnderline().run();
}

window.bulletList = () => {
  editor.chain().focus().toggleBulletList().run();
}

window.orderedList = () => {
  editor.chain().focus().toggleOrderedList().run();
}

window.undoAction = () => {
  editor.chain().focus().undo().run();
}

window.redoAction = () => {
  editor.chain().focus().redo().run();
}

/* COLOR */

window.setColorText = (color) => {

  editor
    .chain()
    .focus()
    .setColor(color)
    .run();
}

/* GUARDAR */

window.saveDocument = () => {

  localStorage.setItem(
    'wc_doc',
    editor.getHTML()
  );

  alert('Documento guardado');
}

/* PDF */

window.exportPDF = async () => {

  const script =
    document.createElement('script');

  script.src =
    'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';

  script.onload = () => {

    html2pdf()
      .from(document.querySelector('.paper'))
      .save('WC_Document.pdf');
  };

  document.body.appendChild(script);
}

/* IA */

window.simulateAI = () => {

  alert(
    'WC IA generó sugerencias.'
  );
}

/* START */

initEditor();

</script>
