<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC EditorPro Suite</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --azul:#2f5f8f;
  --azul-oscuro:#1e3f5c;
  --blanco:#ffffff;
  --gris:#f2f4f7;
  --texto:#222;
  --naranja:#ff8c42;
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:var(--gris);
}

/* ===== TOP BAR ===== */
.topbar{
  background:var(--azul);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
}

.topbar h1{
  font-size:18px;
  margin:0;
}

/* MENÚ PRINCIPAL */
.menu{
  display:flex;
  gap:15px;
  align-items:center;
}

.menu button{
  background:transparent;
  border:none;
  color:white;
  font-size:14px;
  cursor:pointer;
  padding:8px 10px;
  border-radius:6px;
}

.menu button:hover{
  background:rgba(255,255,255,0.15);
}

/* ===== SUB MENÚS ===== */
.submenu{
  display:none;
  position:absolute;
  background:white;
  color:#333;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  padding:10px;
  margin-top:8px;
  min-width:160px;
}

.menu-item{
  position:relative;
}

.menu-item:hover .submenu{
  display:block;
}

.submenu div{
  padding:8px;
  cursor:pointer;
}

.submenu div:hover{
  background:#f0f0f0;
}

/* ===== TOOLBAR SECUNDARIA ===== */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  background:rgba(30,63,92,0.85);
  padding:10px;
  color:white;
}

.toolbar button{
  background:rgba(255,255,255,0.1);
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

.toolbar button:hover{
  background:rgba(255,255,255,0.25);
}

/* ===== CONTENEDOR ===== */
.container{
  display:flex;
  height:calc(100vh - 120px);
}

/* ===== PANEL LATERAL ===== */
.sidebar{
  width:240px;
  background:white;
  border-right:1px solid #ddd;
  padding:10px;
  overflow:auto;
}

/* ===== EDITOR ===== */
.editor-area{
  flex:1;
  padding:20px;
  display:flex;
  justify-content:center;
  overflow:auto;
}

.page{
  width:800px;
  min-height:1000px;
  background:white;
  box-shadow:0 0 10px rgba(0,0,0,0.15);
  padding:40px;
  outline:none;
}

/* ===== PANEL INFERIOR (WC MENÚ) ===== */
.wc-panel{
  background:rgba(47,95,143,0.95);
  color:white;
  display:flex;
  gap:15px;
  padding:10px;
  flex-wrap:wrap;
}

.wc-panel button{
  background:rgba(255,255,255,0.15);
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:6px;
  cursor:pointer;
}

.wc-panel button:hover{
  background:rgba(255,255,255,0.3);
}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{
    display:none;
  }
  .page{
    width:95%;
  }
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <h1>📄 WC EditorPro Suite</h1>

  <div class="menu">

    <div class="menu-item">
      <button>Archivo</button>
      <div class="submenu">
        <div>Nuevo</div>
        <div>Abrir</div>
        <div>Guardar</div>
      </div>
    </div>

    <div class="menu-item">
      <button>Editar</button>
      <div class="submenu">
        <div>Cortar</div>
        <div>Copiar</div>
        <div>Pegar</div>
      </div>
    </div>

    <div class="menu-item">
      <button>Insertar</button>
      <div class="submenu">
        <div>Imagen</div>
        <div>Tabla</div>
        <div>Gráfico</div>
      </div>
    </div>

    <div class="menu-item">
      <button>Formato</button>
      <div class="submenu">
        <div>Negrita</div>
        <div>Cursiva</div>
        <div>Subrayado</div>
      </div>
    </div>

  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <button><i class="fa fa-bold"></i> Negrita</button>
  <button><i class="fa fa-italic"></i> Cursiva</button>
  <button><i class="fa fa-underline"></i> Subrayado</button>
  <button><i class="fa fa-align-left"></i></button>
  <button><i class="fa fa-align-center"></i></button>
  <button><i class="fa fa-align-right"></i></button>
</div>

<!-- CONTENIDO -->
<div class="container">

  <div class="sidebar">
    <h3>Panel</h3>
    <p>Documentos</p>
    <p>Plantillas</p>
    <p>IA (próximamente)</p>
  </div>

  <div class="editor-area">
    <div class="page" contenteditable="true">
      Escribe aquí tu documento...
    </div>
  </div>

</div>

<!-- WC PANEL -->
<div class="wc-panel">
  <button>WC Arte</button>
  <button>Herramientas</button>
  <button>Desarrollador</button>
  <button>Ayuda</button>
</div>

</body>
</html>
