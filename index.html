<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro</title>

<style>

/* =========================
   🌈 FONDO PREMIUM
========================= */
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg, #1b75ed, #ff6b00);
  min-height:100vh;
}

/* =========================
   🧊 TOPBAR
========================= */
.topbar{
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  padding:12px;
  font-size:18px;
  font-weight:bold;
  color:#1b1b1b;
  border-bottom:1px solid rgba(0,0,0,0.1);
}

/* =========================
   🎛️ RIBBON GLASS
========================= */
.ribbon{
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  display:flex;
  flex-wrap:wrap;
  padding:10px;
  gap:10px;
  border-bottom:1px solid rgba(0,0,0,0.1);
}

/* =========================
   📁 MENÚS
========================= */
.menu{
  position:relative;
}

.menu button{
  background:white;
  border:none;
  padding:9px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.menu button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

.menu-content{
  display:none;
  position:absolute;
  top:42px;
  left:0;

  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);

  min-width:200px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  overflow:hidden;
  z-index:1000;
}

.menu-content button{
  width:100%;
  text-align:left;
  padding:10px;
  border:none;
  background:transparent;
  cursor:pointer;
}

.menu-content button:hover{
  background:rgba(27,117,237,0.1);
}

.menu:hover .menu-content{
  display:block;
}

/* =========================
   ✍️ EDITOR
========================= */
#editor{
  margin:20px;
  padding:20px;
  min-height:500px;
  background:white;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  outline:none;
}

/* =========================
   ✨ WC ARTE
========================= */
.wc-arte-1{
  color:#fff;
  text-shadow:0 0 12px #1b75ed;
  font-size:26px;
  font-weight:bold;
}

.wc-arte-2{
  color:#fff;
  text-shadow:0 0 10px #ffb347;
  font-size:26px;
  font-weight:bold;
}

.wc-arte-3{
  color:#fff;
  text-shadow:3px 3px 10px rgba(0,0,0,0.4);
  font-size:26px;
  font-weight:bold;
}

.wc-arte-4{
  color:#fff;
  text-shadow:0 0 15px #1b75ed, 0 0 25px #ff6b00;
  font-size:26px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="topbar">
WC CORPORATE EDITOR PRO + IA
</div>

<!-- =========================
     🎛️ RIBBON
========================= -->
<div class="ribbon">

  <!-- 📁 ARCHIVO -->
  <div class="menu">
    <button>Archivo</button>
    <div class="menu-content">
      <button onclick="guardar()">Guardar</button>
      <button onclick="nuevo()">Nuevo</button>
      <button onclick="imprimir()">Imprimir</button>
    </div>
  </div>

  <!-- ✏️ EDITAR -->
  <div class="menu">
    <button>Editar</button>
    <div class="menu-content">
      <button onclick="cmd('undo')">Deshacer</button>
      <button onclick="cmd('redo')">Rehacer</button>
      <button onclick="cmd('copy')">Copiar</button>
      <button onclick="cmd('paste')">Pegar</button>
    </div>
  </div>

  <!-- 🎨 FORMATO -->
  <div class="menu">
    <button>Formato</button>
    <div class="menu-content">
      <button onclick="cmd('bold')">Negrita</button>
      <button onclick="cmd('italic')">Cursiva</button>
      <button onclick="cmd('underline')">Subrayado</button>
      <button onclick="cmd('justifyLeft')">Izquierda</button>
      <button onclick="cmd('justifyCenter')">Centro</button>
      <button onclick="cmd('justifyRight')">Derecha</button>
    </div>
  </div>

  <!-- ➕ INSERTAR -->
  <div class="menu">
    <button>Insertar</button>
    <div class="menu-content">
      <button onclick="insertText('📌 Nota')">Nota</button>
      <button onclick="insertText('📷 Imagen')">Imagen</button>
      <button onclick="insertTable()">Tabla</button>
    </div>
  </div>

  <!-- ✨ WC ARTE -->
  <div class="menu">
    <button>WC Arte</button>
    <div class="menu-content">
      <input id="textoArte" placeholder="Texto" style="width:90%;margin:5px;">
      <select id="estiloArte" style="width:95%;margin:5px;">
        <option value="1">Neón azul</option>
        <option value="2">Dorado</option>
        <option value="3">Sombra</option>
        <option value="4">Glow mixto</option>
      </select>
      <button onclick="insertarArte()">Insertar</button>
    </div>
  </div>

  <!-- 🛠️ HERRAMIENTAS -->
  <div class="menu">
    <button>Herramientas</button>
    <div class="menu-content">
      <button onclick="limpiar()">Limpiar</button>
      <button onclick="zoomIn()">Zoom +</button>
      <button onclick="zoomOut()">Zoom -</button>
    </div>
  </div>

</div>

<!-- =========================
     ✍️ EDITOR
========================= -->
<div id="editor" contenteditable="true">
Escribe aquí tu documento...
</div>

<script>

let zoom = 100;

/* =========================
   ⚙️ COMANDOS EDITOR
========================= */
function cmd(command){
  document.execCommand(command,false,null);
  document.getElementById("editor").focus();
}

/* =========================
   ➕ INSERTAR TEXTO
========================= */
function insertText(text){
  document.execCommand("insertText", false, text);
}

/* =========================
   📊 TABLA
========================= */
function insertTable(){
  const table = `
  <table border="1" style="width:100%;border-collapse:collapse;">
    <tr><td>Col 1</td><td>Col 2</td></tr>
    <tr><td>Dato</td><td>Dato</td></tr>
  </table>`;
  document.execCommand("insertHTML", false, table);
}

/* =========================
   ✨ WC ARTE
========================= */
function insertarArte(){
  const texto = document.getElementById("textoArte").value;
  const estilo = document.getElementById("estiloArte").value;

  if(!texto) return;

  const span = document.createElement("span");
  span.className = "wc-arte-" + estilo;
  span.textContent = texto;

  const editor = document.getElementById("editor");
  editor.appendChild(span);
  editor.appendChild(document.createElement("br"));
}

/* =========================
   📁 ARCHIVO
========================= */
function guardar(){
  const blob = new Blob([document.getElementById("editor").innerHTML], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wc-documento.html";
  a.click();
}

function nuevo(){
  document.getElementById("editor").innerHTML = "";
}

function imprimir(){
  window.print();
}

/* =========================
   🧹 HERRAMIENTAS
========================= */
function limpiar(){
  document.getElementById("editor").innerHTML = "";
}

function zoomIn(){
  zoom += 10;
  document.getElementById("editor").style.fontSize = zoom + "%";
}

function zoomOut(){
  zoom -= 10;
  document.getElementById("editor").style.fontSize = zoom + "%";
}

</script>

</body>
</html>
