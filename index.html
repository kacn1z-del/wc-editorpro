<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EditorPro SaaS Word+</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#0f172a;
  --panel2:#111c33;
  --paper:#ffffff;
  --text:#111827;

  --grad: linear-gradient(135deg,#2563eb,#f97316);
}

*{box-sizing:border-box;font-family:Segoe UI;}

body{
  margin:0;
  background:var(--bg);
  height:100vh;
  display:flex;
  color:white;
}

/* LEFT DOCS PANEL */
.docs{
  width:260px;
  background:var(--panel);
  border-right:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
}

.brand{
  padding:15px;
  font-weight:bold;
  background:var(--grad);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.doc-item{
  padding:10px 12px;
  margin:5px 10px;
  background:rgba(255,255,255,0.05);
  border-radius:8px;
  cursor:pointer;
}

.doc-item.active{
  background:var(--grad);
  color:white;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* TOP BAR */
.topbar{
  height:55px;
  background:var(--panel2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:2px solid transparent;
  border-image:var(--grad) 1;
}

.status{
  font-size:12px;
  opacity:0.8;
}

/* RIBBON */
.ribbon{
  display:flex;
  gap:6px;
  padding:8px;
  background:var(--panel);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

.ribbon button{
  border:none;
  padding:7px 10px;
  border-radius:6px;
  cursor:pointer;
  background:rgba(255,255,255,0.06);
  color:white;
}

.ribbon button:hover{
  background:var(--grad);
}

/* WORKSPACE */
.workspace{
  flex:1;
  display:flex;
  justify-content:center;
  padding:25px;
  overflow:auto;
}

.page{
  width:850px;
  min-height:1100px;
  background:var(--paper);
  color:#111;
  padding:70px;
  border-radius:8px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.05);
  outline:none;
}

/* AI */
.ai{
  position:fixed;
  right:20px;
  bottom:20px;
  width:300px;
  background:rgba(17,24,39,0.9);
  backdrop-filter:blur(10px);
  border-radius:12px;
  padding:10px;
  border:1px solid rgba(255,255,255,0.08);
}

.ai textarea{
  width:100%;
  height:70px;
  border:none;
  border-radius:8px;
  background:#0b1220;
  color:white;
  padding:8px;
}

.ai button{
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:8px;
  background:var(--grad);
  color:white;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- DOCS -->
<div class="docs">
  <div class="brand">📄 EditorPro SaaS</div>

  <div class="doc-item active">Documento 1</div>
  <div class="doc-item">Informe mensual</div>
  <div class="doc-item">Notas IA</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div>🟢 Online</div>
    <div class="status">Guardado automático activo</div>
  </div>

  <div class="ribbon">
    <button onclick="cmd('bold')"><b>B</b></button>
    <button onclick="cmd('italic')"><i>I</i></button>
    <button onclick="cmd('underline')"><u>U</u></button>
    <button onclick="cmd('insertUnorderedList')">• Lista</button>
    <button onclick="cmd('justifyLeft')">Izq</button>
    <button onclick="cmd('justifyCenter')">Centro</button>
    <button onclick="save()">💾</button>
    <button onclick="load()">📂</button>
  </div>

  <div class="workspace">
    <div id="page" class="page" contenteditable="true">
      <h1>Documento SaaS Pro</h1>
      <p>Ahora sí empieza a parecer Word real...</p>
    </div>
  </div>

</div>

<!-- AI -->
<div class="ai">
  <b>🤖 IA Assistant</b>
  <textarea id="aiText"></textarea>
  <button onclick="ai()">Generar</button>
</div>

<script>
function cmd(c){
  document.execCommand(c,false,null);
}

function save(){
  localStorage.setItem("doc", document.getElementById("page").innerHTML);
}

function load(){
  document.getElementById("page").innerHTML = localStorage.getItem("doc") || "";
}

function ai(){
  let t=document.getElementById("aiText").value;
  document.getElementById("page").innerHTML += "<p><b>IA:</b> "+t+"</p>";
}

setInterval(()=>{
  save();
},3000);

window.onload=load;
</script>

</body>
</html>
