<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WC Editor PRO 🇨🇷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f3f2f1;height:100vh;overflow:hidden}
#backstage{display:flex;height:100vh;background:white}
#editor-view{display:none;height:100vh;flex-direction:column}
:root{--azul:#002B7F;--rojo:#CE1126}
.nav{width:280px;background:var(--azul);color:white}
.nav-h{padding:16px;background:var(--rojo);display:flex;align-items:center;gap:12px}
.btn{padding:12px 20px;border:none;background:none;color:white;text-align:left;width:100%;cursor:pointer}
.btn:active{background:rgba(255,255,255,0.2)}
.cont{flex:1;padding:24px;background:#faf9f8;overflow-y:auto}
.card{border:1px solid #ccc;padding:20px;margin-bottom:12px;cursor:pointer;background:white;text-align:center}
.card:active{border-color:var(--azul);transform:scale(0.98)}
.bar{background:var(--azul);color:white;padding:6px 12px;display:flex;justify-content:space-between}
.icons{display:flex;gap:12px}
.icons span{cursor:pointer;padding:4px;font-size:18px}
.tools{background:white;border-bottom:1px solid #ccc;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap}
.tools button,.tools input{border:1px solid #ccc;padding:6px 10px;background:white;cursor:pointer;height:36px;min-width:36px}
.tools input[type="color"]{width:36px;padding:2px}
.area{flex:1;background:#e6e6e6;padding:16px;overflow-y:auto}
#editor{width:100%;max-width:816px;min-height:600px;background:white;padding:40px;margin:0 auto;outline:none}
#editor img{max-width:100%}
#editor table{border-collapse:collapse;width:100%;margin:10px 0}
#editor td{border:1px solid #ccc;padding:8px}
#editor mark{background:yellow}
.stat{background:var(--azul);color:white;padding:4px 12px;font-size:12px;display:flex;justify-content:space-between}
.docs{margin-top:20px;border-top:2px solid var(--rojo);padding-top:20px}
.doc{padding:12px;border:1px solid #ccc;margin-bottom:8px;cursor:pointer;background:white;display:flex;justify-content:space-between}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-c{background:white;padding:20px;border-radius:8px;width:90%;max-width:400px}
.modal-c input{width:100%;padding:8px;margin:12px 0;border:1px solid #ccc}
.modal-b{display:flex;gap:8px;justify-content:flex-end}
.modal-b button{padding:8px 16px;border:none;border-radius:3px;cursor:pointer}
.ok{background:var(--azul);color:white}
</style>
</head>
<body>
<div id="backstage">
<div class="nav">
<div class="nav-h"><button onclick="cb()">←</button><span>Archivo</span></div>
<button class="btn" onclick="ae()">📄 Nuevo</button>
<button class="btn" onclick="ab()">📂 Abrir</button>
<button class="btn" onclick="g()">💾 Guardar</button>
<button class="btn" onclick="gc()">💾 Guardar como</button>
<button class="btn" onclick="gn()">☁️ Nube</button>
<button class="btn" onclick="ud()">↶ Deshacer</button>
<button class="btn" onclick="rd()">↷ Rehacer</button>
<button class="btn" onclick="window.print()">🖨️ Imprimir</button>
</div>
<div class="cont">
<div id="vn"><h1 style="font-size:32px;color:#002B7F;margin-bottom:20px">Nuevo</h1><div class="card" onclick="ae()">Documento en blanco</div></div>
<div id="va" style="display:none"><h1 style="font-size:32px;color:#002B7F;margin-bottom:20px">Abrir</h1><div class="docs"><h3>Documentos</h3><div id="ld"></div></div></div>
</div>
</div>
<div id="editor-view">
<div class="bar"><div class="icons"><span onclick="ab()">📄</span><span onclick="g()">💾</span><span onclick="ud()">↶</span><span onclick="rd()">↷</span></div><div id="nd">Documento1</div><div>WC PRO 🇨🇷</div></div>
<div class="tools">
<button onclick="cp()">📋</button>
<button onclick="pt()">📄</button>
<button onclick="f('strong')"><b>B</b></button>
<button onclick="f('em')"><i>I</i></button>
<button onclick="f('u')"><u>U</u></button>
<input type="color" id="ct" value="#000000" onchange="cc()">
<input type="color" id="cr" value="#FFFF00" onchange="cs()">
<button onclick="l()">≡</button>
<button onclick="a('left')">⬅️</button>
<button onclick="a('center')">↔️</button>
<button onclick="a('right')">➡️</button>
<button onclick="ii()">🖼️</button>
<button onclick="it()">📊</button>
<button onclick="mb()">🔍</button>
<button onclick="mbr()">🌿</button>
</div>
<div class="area"><div id="editor" contenteditable="true"><p>Escribí aquí...</p></div></div>
<div class="stat"><span id="cp">Palabras: 0</span><span>Costa Rica 🇨🇷</span></div>
</div>
<div class="modal" id="mb"><div class="modal-c"><h3>Buscar</h3><input id="ib" placeholder="Palabra..."><div class="modal-b"><button onclick="cmb()">Cancelar</button><button class="ok" onclick="eb()">Buscar</button></div></div></div>
<div class="modal" id="mbr"><div class="modal-c"><h3>🌿 Bribri</h3><input id="ibr" placeholder="hola, agua, casa..."><div id="rb" style="margin:12px 0;padding:8px;background:#f0f0f0;min-height:40px"></div><div class="modal-b"><button onclick="cmbr()">Cerrar</button><button class="ok" onclick="tb()">Traducir</button></div></div></div>
<input type="file" id="ii" accept="image/*" style="display:none">
<script>
var u=[],r=[],pp='',db={'hola':'i shka','agua':'di´','casa':'u','árbol':'kàl','sol':'dí','luna':'si´wa','fuego':'bök','comida':'chkè','gracias':'wëstela','adiós':'i shkëna'};
function gs(){var e=document.getElementById('editor');u.push(e.innerHTML);if(u.length>50)u.shift();r=[]}
function ud(){if(u.length>0){var e=document.getElementById('editor');r.push(e.innerHTML);e.innerHTML=u.pop();ac()}}
function rd(){if(r.length>0){var e=document.getElementById('editor');u.push(e.innerHTML);e.innerHTML=r.pop();ac()}}
function cb(){document.getElementById('backstage').style.display='flex';document.getElementById('editor-view').style.display='none'}
function ab(){document.getElementById('backstage').style.display='flex';document.getElementById('editor-view').style.display='none';document.getElementById('vn').style.display='none';document.getElementById('va').style.display='block';cd()}
function ae(){document.getElementById('backstage').style.display='none';document.getElementById('editor-view').style.display='flex';document.getElementById('editor').innerHTML='<p>Escribí aquí...</p>';gs();ac()}
function g(){var n=document.getElementById('nd').innerText;var c=document.getElementById('editor').innerHTML;var d=JSON.parse(localStorage.getItem('wcd')||'{}');d[n]={c:c,f:new Date().toLocaleString('es-CR')};localStorage.setItem('wcd',JSON.stringify(d));alert('✅ Guardado')}
function gc(){var n=prompt('Nombre:',document.getElementById('nd').innerText);if(n){document.getElementById('nd').innerText=n;g()}}
function gn(){var n=document.getElementById('nd').innerText;var c=document.getElementById('editor').innerHTML;var b=new Blob([c],{type:'text/html'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=n+'.html';a.click();alert('☁️ Descargado')}
function cd(){var l=document.getElementById('ld');var d=JSON.parse(localStorage.getItem('wcd')||'{}');l.innerHTML='';Object.keys(d).forEach(function(n){var dv=document.createElement('div');dv.className='doc';dv.innerHTML='<div><b>'+n+'</b><br><small>'+d[n].f+'</small></div><button onclick="dd(\''+n+'\')">Borrar</button>';dv.onclick=function(e){if(e.target.tagName!=='BUTTON'){document.getElementById('nd').innerText=n;document.getElementById('editor').innerHTML=d[n].c;cb()}};l.appendChild(dv)})}
function dd(n){var d=JSON.parse(localStorage.getItem('wcd')||'{}');delete d[n];localStorage.setItem('wcd',JSON.stringify(d));cd()}
function cp(){var s=window.getSelection();if(s.rangeCount>0){pp=s.toString();alert('📋 Copiado')}}
function pt(){if(pp){gs();document.execCommand('insertText',false,pp);ac()}else{alert('Vacío')}}
function f(t){var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);if(r.collapsed)return;var e=document.createElement(t);e.appendChild(r.extractContents());r.insertNode(e);ac()}
function cc(){var c=document.getElementById('ct').value;var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);if(r.collapsed)return;var sp=document.createElement('span');sp.style.color=c;sp.appendChild(r.extractContents());r.insertNode(sp);ac()}
function cs(){var c=document.getElementById('cr').value;var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);if(r.collapsed)return;var m=document.createElement('mark');m.style.backgroundColor=c;m.appendChild(r.extractContents());r.insertNode(m);ac()}
function l(){var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);var ul=document.createElement('ul');var li=document.createElement('li');li.innerHTML=r.toString()||'&nbsp;';ul.appendChild(li);r.deleteContents();r.insertNode(ul);ac()}
function a(d){var s=window.getSelection();if(!s.rangeCount)return;gs();var r=s.getRangeAt(0);var dv=document.createElement('div');dv.style.textAlign=d;dv.appendChild(r.extractContents());r.insertNode(dv);ac()}
function ii(){document.getElementById('ii').click()}
document.getElementById('ii').onchange=function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(e){gs();var i=document.createElement('img');i.src=e.target.result;i.style.maxWidth='100%';var ed=document.getElementById('editor');ed.focus();var s=window.getSelection();if(s.rangeCount){var r=s.getRangeAt(0);r.insertNode(i);r.setStartAfter(i);r.collapse(true);s.removeAllRanges();s.addRange(r)}ac()};rd.readAsDataURL(f)}
function it(){gs();var h='<table><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></table>';var ed=document.getElementById('editor');ed.focus();var s=window.getSelection();if(s.rangeCount){var r=s.getRangeAt(0);var d=document.createElement('div');d.innerHTML=h;r.insertNode(d.firstChild)}ac()}
function mb(){document.getElementById('mb').classList.add('active')}
function cmb(){document.getElementById('mb').classList.remove('active')}
function eb(){var t=document.getElementById('ib').value;if(!t)return;var e=document.getElementById('editor');var h=e.innerHTML;var r=new RegExp(t,'gi');var c=(h.match(r)||[]).length;e.innerHTML=h.replace(r,'<mark>$&</mark>');cmb();alert('🔍 Encontradas: '+c);setTimeout(function(){e.innerHTML=e.innerHTML.replace(/<mark>/g,'').replace(/<\/mark>/g,'')},3000)}
function mbr(){document.getElementById('mbr').classList.add('active')}
function cmbr(){document.getElementById('mbr').classList.remove('active')}
function tb(){var t=document.getElementById('ibr').value.toLowerCase().trim();var r='No encontrado';for(var k in db){if(k===t)r='Bribri: '+db[k];if(db[k]===t)r='Español: '+k}document.getElementById('rb').innerText=r}
function ac(){var t=document.getElementById('editor').innerText||'';var p=t.trim().split(/\s+/).filter(function(p){return p.length>0}).length;document.getElementById('cp').innerText='Palabras: '+p}
window.onload=function(){document.getElementById('editor').addEventListener('input',ac);ac()}
</script>
</body>
</html>
