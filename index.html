<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor</title>
<style>
    body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
    #lienzoTexto { background: white; min-height: 300px; padding: 20px; border: 1px solid #ccc; outline: none; }
    .cmd-btn { background: white; border: 1px solid #ccc; padding: 10px; margin: 5px; cursor: pointer; border-radius: 5px; }
</style>
</head>
<body>

    <div id="panelComandos"></div>
    <div id="lienzoTexto" contenteditable="true">Selecciona este texto y aplica el estilo WC Arte en la pestaña Diseño.</div>

<script>
let currentTab = 'inicio';
let currentLang = 'es';

const translations = {
    es: {
        cmds: {
            inicio: [{ txt: "📋 Cortar", action: "cut" }, { txt: "🖨️ Copiar", action: "copy" }],
            insertar: [{ txt: "📊 Tabla", action: "insertTable" }],
            diseno: [{ txt: "🎨 Tema", action: "themeCorp" }, { txt: "✨ WC Arte", action: "wcArt" }]
        }
    }
};

function renderActiveCommands() {
    const panel = document.getElementById('panelComandos');
    panel.innerHTML = "";
    
    // Botones de cambio de pestaña (para que puedas probar)
    ['inicio', 'insertar', 'diseno'].forEach(tab => {
        const btn = document.createElement('button');
        btn.innerText = tab.toUpperCase();
        btn.onclick = () => { currentTab = tab; renderActiveCommands(); };
        panel.appendChild(btn);
    });

    panel.appendChild(document.createElement('hr'));

    const currentCmds = translations[currentLang].cmds[currentTab];
    if (currentCmds) {
        currentCmds.forEach(cmdObj => {
            const button = document.createElement('button');
            button.className = "cmd-btn";
            button.innerHTML = cmdObj.txt;
            button.onclick = () => triggerCommandAction(cmdObj.action);
            panel.appendChild(button);
        });
    }
}

function triggerCommandAction(actionKey) {
    document.getElementById('lienzoTexto').focus();
    switch(actionKey) {
        case "cut": document.execCommand("cut"); break;
        case "copy": document.execCommand("copy"); break;
        case "insertTable":
            document.execCommand('insertHTML', false, '<table border="1" style="width:100%"><tr><td>Celda</td></tr></table>');
            break;
        case "wcArt":
            applyWCArtModerno();
            break;
        case "themeCorp":
            document.getElementById('lienzoTexto').style.color = "#1d5270";
            break;
    }
}

function applyWCArtModerno() {
    const selection = window.getSelection();
    if (selection.rangeCount > 0 && selection.toString() !== "") {
        const text = selection.toString();
        const artHTML = `<div style="background: linear-gradient(135deg, #e0e7ff, #fce7f3); padding: 15px; border-radius: 12px; border: 2px solid #6366f1; display: inline-block; font-weight: bold; color: #4338ca;">${text}</div>`;
        document.execCommand('insertHTML', false, artHTML);
    } else {
        alert("Por favor, selecciona texto primero.");
    }
}

// Inicialización
renderActiveCommands();
</script>
</body>
</html>
