<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WC Editor Suite PRO - Costa Rica 🇨🇷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f3f2f1; overflow: hidden; height: 100vh; }
    #backstage { display: flex; height: 100vh; background: white; }
    #editor-view { display: none; height: 100vh; flex-direction: column; }
 .backstage-nav { width: 220px; background: #2b579a; color: white; display: flex; flex-direction: column; }
 .backstage-nav-header { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
 .back-btn { width: 32px; height: 32px; border: 2px solid white; border-radius: 50%; background: none; color: white; cursor: pointer; font-size: 18px; }
 .nav-item { padding: 12px 20px; cursor: pointer; font-size: 14px; border: none; background: none; color: white; text-align: left; width: 100%; }
 .nav-item:active { background: rgba(255,255,255,0.2); }
 .nav-item.active { background: #1e3a5f; border-left: 3px solid #FFD700; }
 .backstage-content { flex: 1; padding: 24px; overflow-y: auto; }
 .backstage-title { font-size: 28px; font-weight: 300; color: #323130; margin-bottom: 20px; }
 .templates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-bottom: 32px; }
 .template-card { cursor: pointer; border: 1px solid #e1dfdd; background: white; }
 .template-card:active { border-color: #2b579a; box-shadow: 0 0 0 2px #2b579a; }
 .template-preview { aspect-ratio: 8.5/11; background: white; border-bottom: 1px solid #e1dfdd; padding: 8px; }
 .template-name { padding: 8px; font-size: 11px; text-align: center; background: #faf9f8; }
 .docs-lista { margin-top: 32px; border-top: 2px solid #e1dfdd; padding-top: 24px; }
 .docs-lista h3 { font-size: 18px; margin-bottom: 16px; color: #323130; }
 .doc-item { padding: 12px; border: 1px solid #e1dfdd; margin-bottom: 8px; cursor: pointer; background: white; display: flex; justify-content: space-between; align-items: center; }
 .doc-item:active { background: #f3f2f1; }
 .doc-item-nombre { font-weight: 600; font-size: 14px; }
 .doc-item-fecha { font-size: 11px; color: #605e5c; }
 .doc-item-borrar { background: #CE1126; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; }
 .title-bar { background: #2b579a; color: white; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
 .title-bar-icons { display: flex; gap: 12px; }
 .title-bar-icons span { cursor: pointer; padding: 4px; font-size: 18px; }
 .title-bar-icons span:active { background: rgba(255,255,255,0.3); border-radius: 3px; }
 .ribbon-tabs { background: #f3f2f1; border-bottom: 1px solid #d2d0ce; display: flex; padding: 0 12px; overflow-x: auto; }
 .ribbon-tab { padding: 8px 14px; cursor: pointer; border: none; background: none; font-size: 14px; color: #323130; white-space: nowrap; }
 .ribbon-tab.active { background: white; border: 1px solid #d2d0ce; border-bottom: 1px solid white; margin-bottom: -1px; color: #2b579a; font-weight: 600; }
 .ribbon-toolbar { background: white; border-bottom: 1px solid #d2d0ce; padding: 8px 12px; display: none; gap: 8px; align-items: center; flex-wrap: wrap; overflow-x: auto; }
 .ribbon-toolbar.active { display: flex; }
 .tool-group { display: flex; flex-direction: column; border-right: 1px solid #e1dfdd; padding-right: 8px; margin-right: 8px; }
 .tool-group-title { font-size: 10px; color: #605e5c; text-align: center; margin-top: 2px; }
 .tool-buttons { display: flex; gap: 4px; align-items: center; }
 .ribbon-toolbar button,.ribbon-toolbar select,.ribbon-toolbar input[type="color"] { background: white; border: 1px solid #ccc; padding: 6px 10px; border-radius: 3px; cursor: pointer; font-size: 14px; height: 36px; min-width: 36px; }
 .ribbon-toolbar button:active { background: #e1dfdd; border-color: #2b579a; }
 .ribbon-toolbar input[type="color"] { padding: 2px; width: 36px; }
 .main-editor-area { flex: 1; background: #e6e6e6; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; }
 .page-header,.page-footer { width: 100%; max-width: 816px; background: #faf9f8; border: 1px dashed #ccc; padding: 12px 40px; font-size: 12px; color: #605e5c; text-align: center; }
 .page-header { border-bottom: none; display: none; }
 .page-footer { border-top: none; margin-top: -1px; display: none; }
    #editor { width: 100%; max-width: 816px; min-height: 600px; background: white; box-shadow: 0 0 8px rgba(0,0,0,0.15); padding: 40px; outline: none; font-size: 16px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
    #editor img { max-width: 100%; height: auto; }
    #editor table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    #editor table td, #editor table th { border: 1px solid #ccc; padding: 8px; }
 .comentario { background: #FFF3CD; border-left: 3px solid #FFD700; padding: 8px; margin: 8px 0; font-size: 13px; }
 .status-bar { background: #f3f2f1; border-top: 1px solid #d2d0ce; padding: 4px 12px; font-size: 12px; color: #605e5c; display: flex; justify-content: space-between; }
 .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
 .modal.active { display: flex; }
 .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 90%; width: 400px; }
 .modal-content h3 { margin-bottom: 16px; }
 .modal-content input,.modal-content textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; margin-bottom: 12px; font-size: 14px; }
 .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
 .modal-buttons button { padding: 8px 16px; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; }
 .btn-primary { background: #2b579a; color: white; }
 .btn-secondary { background: #e1dfdd; color: #323130; }
  </style>
</head>
<body>

  <div id="backstage">
    <div class="backstage-nav">
      <div class="backstage-nav-header">
        <button class="back-btn" onclick="cerrarBackstage()">←</button>
        <span style="font-weight: 600;">Info</span>
      </div>
      <button class="nav-item active" onclick="mostrarNuevo()">Nuevo</button>
      <button class="nav-item" onclick="mostrarAbrir()">Abrir</button>
      <button class="nav-item" onclick="guardar()">Guardar</button>
      <button class="nav-item" onclick="guardarComo()">Guardar como</button>
      <button class="nav-item" onclick="window.print()">Imprimir</button>
      <button class="nav-item" onclick="compartir()">Compartir</button>
      <button class="nav-item" onclick="exportarPDF()">Exportar PDF</button>
      <button class="nav-item" onclick="cerrarDoc()">Cerrar</button>
    </div>

    <div class="backstage-content">
      <div id="vistaNuevo">
        <h1 class="backstage-title">Nuevo</h1>
        <div class="templates-grid">
          <div class="template-card" onclick="abrirEditor('blanco')">
            <div class="template-preview"></div>
            <div class="template-name">Documento en blanco</div>
          </div>
          <div class="template-card" onclick="abrirEditor('carta')">
            <div class="template-preview">
              <div style="width:100%; height:2px; background:#000; margin:4px 0;"></div>
              <div style="width:80%; height:1px; background:#ccc; margin:2px 0;"></div>
            </div>
            <div class="template-name">Carta formal</div>
          </div>
          <div class="template-card" onclick="abrirEditor('informe')">
            <div class="template-preview">
              <div style="width:100%; height:3px; background:#2b579a; margin:4px 0;"></div>
              <div style="width:70%; height:1px; background:#ccc; margin:2px 0;"></div>
            </div>
            <div class="template-name">Informe</div>
          </div>
          <div class="template-card" onclick="abrirEditor('acta')">
            <div class="template-preview">
              <div style="width:100%; height:3px; background:#2b579a; margin:4px 0;"></div>
              <div style="width:90%; height:1px; background:#ccc; margin:2px 0;"></div>
            </div>
            <div class="template-name">Acta</div>
          </div>
          <div class="template-card" onclick="abrirEditor('cv')">
            <div class="template-preview">
              <div style="width:50%; height:3px; background:#000; margin:4px auto;"></div>
              <div style="width:80%; height:1px; background:#ccc; margin:2px auto;"></div>
            </div>
            <div class="template-name">Currículum</div>
          </div>
          <div class="template-card" onclick="abrirEditor('ensayo')">
            <div class="template-preview">
              <div style="width:70%; height:3px; background:#000; margin:4px auto;"></div>
              <div style="width:90%; height:1px; background:#ccc; margin:2px auto;"></div>
            </div>
            <div class="template-name">Ensayo</div>
          </div>
        </div>
      </div>

      <div id="vistaAbrir" style="display:none;">
        <h1 class="backstage-title">Abrir</h1>
        <div class="docs-lista">
          <h3>Documentos guardados</h3>
          <div id="listaDocs"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="editor-view">
    <div class="title-bar">
      <div class="title-bar-icons">
        <span onclick="abrirBackstage()">📄</span>
        <span onclick="guardar()">💾</span>
        <span onclick="deshacer()">↶</span>
        <span onclick="rehacer()">↷</span>
      </div>
      <div id="nombreDoc">Documento1</div>
      <div>— WC Editor PRO</div>
    </div>

    <div class="ribbon-tabs">
      <button class="ribbon-tab" onclick="abrirBackstage()">Archivo</button>
      <button class="ribbon-tab active" onclick="mostrarTab('inicio')">Inicio</button>
      <button class="ribbon-tab" onclick="mostrarTab('insertar')">Insertar</button>
      <button class="ribbon-tab" onclick="mostrarTab('revisar')">Revisar</button>
      <button class="ribbon-tab" onclick="mostrarTab('vista')">Vista</button>
    </div>

    <div class="ribbon-toolbar active" id="tab-inicio">
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="pegar()">📋</button>
          <button onclick="cortar()">✂️</button>
          <button onclick="copiar()">📄</button>
        </div>
        <div class="tool-group-title">Portapapeles</div>
      </div>
      <div class="tool-group">
        <div class="tool-buttons">
          <select onchange="cambiarFuente(this.value)">
            <option value="Calibri">Calibri</option>
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times</option>
          </select>
          <select onchange="cambiarTamano(this.value)">
            <option value="2">10</option>
            <option value="3" selected>11</option>
            <option value="4">12</option>
            <option value="5">14</option>
            <option value="6">18</option>
            <option value="7">24</option>
          </select>
        </div>
        <div class="tool-group-title">Fuente</div>
      </div>
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="ejecutar('bold')"><b>B</b></button>
          <button onclick="ejecutar('italic')"><i>I</i></button>
          <button onclick="ejecutar('underline')"><u>U</u></button>
          <input type="color" onchange="resaltar(this.value)" title="Resaltar">
        </div>
        <div class="tool-group-title">Fuente</div>
      </div>
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="ejecutar('insertUnorderedList')">≡</button>
          <button onclick="ejecutar('insertOrderedList')">1≡</button>
          <button onclick="ejecutar('justifyLeft')">⬅️</button>
          <button onclick="ejecutar('justifyCenter')">↔️</button>
          <button onclick="ejecutar('justifyRight')">➡️</button>
          <button onclick="ejecutar('justifyFull')">▤</button>
        </div>
        <div class="tool-group-title">Párrafo</div>
      </div>
      <div class="tool-group">
        <div class="tool-buttons">
          <select onchange="cambiarInterlineado(this.value)">
            <option value="1">1.0</option>
            <option value="1.5">1.5</option>
            <option value="2">2.0</option>
          </select>
        </div>
        <div class="tool-group-title">Espaciado</div>
      </div>
    </div>

    <div class="ribbon-toolbar" id="tab-insertar">
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="insertarImagen()">🖼️ Imagen</button>
          <button onclick="insertarTabla()">📊 Tabla</button>
          <button onclick="insertarComentario()">💬 Comentario</button>
        </div>
        <div class="tool-group-title">Insertar</div>
      </div>
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="insertarEncabezado()">📄 Encabezado</button>
          <button onclick="insertarPiePagina()">📄 Pie página</button>
          <button onclick="insertarNumPagina()"># Núm página</button>
        </div>
        <div class="tool-group-title">Encabezado/Pie</div>
      </div>
    </div>

    <div class="ribbon-toolbar" id="tab-revisar">
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="revisarOrtografia()">✓ Ortografía</button>
          <button onclick="buscar()">🔍 Buscar</button>
          <button onclick="reemplazar()">🔄 Reemplazar</button>
        </div>
        <div class="tool-group-title">Revisión</div>
      </div>
    </div>

    <div class="ribbon-toolbar" id="tab-vista">
      <div class="tool-group">
        <div class="tool-buttons">
          <button onclick="window.print()">🖨️ Imprimir</button>
          <button onclick="exportarPDF()">📄 PDF</button>
        </div>
        <div class="tool-group-title">Vista</div>
      </div>
    </div>

    <div class="main-editor-area">
      <div id="headerContainer" class="page-header" contenteditable="true"></div>
      <div id="editor" contenteditable="true" spellcheck="true" onkeyup="actualizarContador()" onmouseup="actualizarContador()"></div>
      <div id="footerContainer" class="page-footer" contenteditable="true"></div>
    </div>

    <div class="status-bar">
      <span id="contadorPalabras">Palabras: 0 | Caracteres: 0</span>
      <span id="paginaInfo">Página 1</span>
    </div>
  </div>

  <div class="modal" id="modalTabla">
    <div class="modal-content">
      <h3>Insertar Tabla</h3>
      <input type="number" id="tablaFilas" placeholder="Filas" value="3" min="1">
      <input type="number" id="tablaCols" placeholder="Columnas" value="3" min="1">
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="cerrarModal('modalTabla')">Cancelar</button>
        <button class="btn-primary" onclick="crearTabla()">Insertar</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modalBuscar">
    <div class="modal-content">
      <h3>Buscar y Reemplazar</h3>
      <input type="text" id="buscarTexto" placeholder="Buscar...">
      <input type="text" id="reemplazarTexto" placeholder="Reemplazar con...">
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="cerrarModal('modalBuscar')">Cancelar</button>
        <button class="btn-primary" onclick="ejecutarReemplazo()">Reemplazar todo</button>
      </div>
    </div>
  </div>

  <input type="file" id="inputImagen" accept="image/*" style="display:none;" onchange="cargarImagen(event)">

  <script>
    var plantillas = {
      blanco: '<p>Escribí aquí...</p>',
      carta: '<p>San José, Costa Rica</p><br><p><strong>Señores:</strong></p><p>[Empresa]</p><br><p>Estimados señores:</p><p>Por medio de la presente...</p><br><br><p>Atentamente,</p><br><p>_________________________<br>[Tu nombre]</p>',
      informe: '<h2 style="color:#2b579a;">Informe</h2><p><strong>Fecha:</strong></p><h3>1. Resumen</h3><p>Contenido...</p><h3>2. Resultados</h3><ul><li>Resultado 1</li><li>Resultado 2</li></ul>',
      acta: '<h2 style="text-align:center;">ACTA DE REUNIÓN</h2><p><strong>Fecha:</strong> <br><strong>Hora:</strong> <br><strong>Lugar:</strong> </p><p><strong>Asistentes:</strong></p><ol><li></li></ol><p><strong>Acuerdos:</strong></p><ol><li>Se acuerda que...</li></ol>',
      cv: '<h1 style="text-align:center;">[TU NOMBRE]</h1><p style="text-align:center;">Tel: 8888-8888 | Email: correo@email.com</p><hr><h2>Perfil Profesional</h2><p>Profesional con experiencia en...</p>',
      ensayo: '<h1 style="text-align:center;">Título del Ensayo</h1><p style="text-align:center;"><em>[Tu nombre]</em></p><br><h2>Introducción</h2><p>El presente ensayo aborda...</p>'
    };

    var docActual = null;

    function mostrarNuevo() {
      document.getElementById('vistaNuevo').style.display = 'block';
      document.getElementById('vistaAbrir').style.display = 'none';
    }

    function mostrarAbrir() {
      document.getElementById('vistaNuevo').style.display = 'none';
      document.getElementById('vistaAbrir').style.display = 'block';
      cargarListaDocs();
    }

    function abrirBackstage() {
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
      mostrarNuevo();
    }

    function cerrarBackstage() {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      setTimeout(function() { document.getElementById('editor').focus(); }, 100);
    }

    function abrirEditor(tipo) {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').innerHTML = plantillas[tipo];
      document.getElementById('nombreDoc').innerText = tipo;
      docActual = null;
      actualizarContador();
      setTimeout(function() {
        var editor = document.getElementById('editor');
        editor.focus();
        var range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }, 100);
    }

    function mostrarTab(tab) {
      document.querySelectorAll('.ribbon-tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.ribbon-toolbar').forEach(function(t) { t.classList.remove('active'); });
      event.target.classList.add('active');
      document.getElementById('tab-' + tab).classList.add('active');
    }

    function ejecutar(cmd) {
      document.getElementById('editor').focus();
      document.execCommand(cmd, false, null);
    }

    function cambiarFuente(fuente) {
      document.getElementById('editor').focus();
      document.execCommand('fontName', false, fuente);
    }

    function cambiarTamano(tamano) {
      document.getElementById('editor').focus();
      document.execCommand('fontSize', false, tamano);
    }

    function cambiarInterlineado(valor) {
      var editor = document.getElementById('editor');
      editor.style.lineHeight = valor;
    }

    function resaltar(color) {
      document.getElementById('editor').focus();
      document.execCommand('backColor', false, color);
    }

    function cortar() { document.getElementById('editor').focus(); document.execCommand('cut'); }
    function copiar() { document.getElementById('editor').focus(); document.execCommand('copy'); }
    function pegar() {
      document.getElementById('editor').focus();
      navigator.clipboard.readText().then(function(text) {
        document.execCommand('insertText', false, text);
      });
    }
    function deshacer() { document.getElementById('editor').focus(); document.execCommand('undo'); }
    function rehacer() { document.getElementById('editor').focus(); document.execCommand('redo'); }

    function insertarImagen() { document.getElementById('inputImagen').click(); }
    function cargarImagen(event) {
      var file = event.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('editor').focus();
          document.execCommand('insertImage', false, e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function insertarTabla() { document.getElementById('modalTabla').classList.add('active'); }
    function crearTabla() {
      var filas = parseInt(document.getElementById('tablaFilas').value);
      var cols = parseInt(document.getElementById('tablaCols').value);
      var html = '<table>';
      for (var i = 0; i < filas; i++) {
        html += '<tr>';
        for (var j = 0; j < cols; j++) { html += '<td>&nbsp;</td>'; }
        html += '</tr>';
      }
      html += '</table><p><br></p>';
      document.getElementById('editor').focus();
      document.execCommand('insertHTML', false, html);
      cerrarModal('modalTabla');
    }

    function insertarComentario() {
      var texto = prompt('Comentario:');
      if (texto) {
        document.getElementById('editor').focus();
        document.execCommand('insertHTML', false, '<div class="comentario">💬 ' + texto + '</div>');
      }
    }

    function insertarEncabezado() {
      var header = document.getElementById('headerContainer');
      header.style.display = 'block';
      header.focus();
    }

    function insertarPiePagina() {
      var footer = document.getElementById('footerContainer');
      footer.style.display = 'block';
      footer.focus();
    }

    function insertarNumPagina() {
      var footer = document.getElementById('footerContainer');
      footer.style.display = 'block';
      footer.innerHTML = 'Página 1';
    }

    function buscar() { document.getElementById('modalBuscar').classList.add('active'); }
    function reemplazar() { document.getElementById('modalBuscar').classList.add('active'); }
    function ejecutarReemplazo() {
      var buscar = document.getElementById('buscarTexto').value;
      var reemplazar = document.getElementById('reemplazarTexto').value;
      if (buscar) {
        var editor = document.getElementById('editor');
        editor.innerHTML = editor.innerHTML.replace(new RegExp(buscar, 'g'), reemplazar);
        cerrarModal('modalBuscar');
      }
    }

    function revisarOrtografia() {
      alert('✓ Corrector activado. Los errores se marcan en rojo por el navegador.');
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function guardar() {
      var nombre = document.getElementById('nombreDoc').innerText;
      var contenido = document.getElementById('editor').innerHTML;
      var header = document.getElementById('headerContainer').innerHTML;
      var footer = document.getElementById('footerContainer').innerHTML;
      var fecha = new Date().toLocaleString('es-CR');

      var docs = JSON.parse(localStorage.getItem('wc_docs') || '{}');
      docs[nombre] = { contenido: contenido, header: header, footer: footer, fecha: fecha };
      localStorage.setItem('wc_docs', JSON.stringify(docs));

      docActual = nombre;
      alert('✅ Guardado: ' + nombre);
    }

    function guardarComo() {
      var nombre = prompt('Nombre del documento:', document.getElementById('nombreDoc').innerText);
      if (nombre) {
        document.getElementById('nombreDoc').innerText = nombre;
        guardar();
      }
    }

    function cargarListaDocs() {
      var docs = JSON.parse(localStorage.getItem('wc_docs') || '{}');
      var lista = document.getElementById('listaDocs');
      lista.innerHTML = '';

      var nombres = Object.keys(docs);
      if (nombres.length === 0) {
        lista.innerHTML = '<p style="color:#605e5c; padding:20px;">No hay documentos guardados</p>';
        return;
      }

      nombres.forEach(function(nombre) {
        var doc = docs[nombre];
        var item = document.createElement('div');
        item.className = 'doc-item';
        item.innerHTML = '<div><div class="doc-item-nombre">' + nombre + '</div><div class="doc-item-fecha">' + doc.fecha + '</div></div><button class="doc-item-borrar" onclick="borrarDoc(\'' + nombre + '\'); event.stopPropagation();">Borrar</button>';
        item.onclick = function() { abrirDoc(nombre); };
        lista.appendChild(item);
      });
    }

    function abrirDoc(nombre) {
      var docs = JSON.parse(localStorage.getItem('wc_docs') || '{}');
      if (docs[nombre]) {
        document.getElementById('backstage').style.display = 'none';
        document.getElementById('editor-view').style.display = 'flex';
        document.getElementById('editor').innerHTML = docs[nombre].contenido;
        document.getElementById('headerContainer').innerHTML = docs[nombre].header || '';
        document.getElementById('footerContainer').innerHTML = docs[nombre].footer || '';
        if (docs[nombre].header) document.getElementById('headerContainer').style.display = 'block';
        if (docs[nombre].footer) document.getElementById('footerContainer').style.display = 'block';
        document.getElementById('nombreDoc').innerText = nombre;
        docActual = nombre;
        actualizarContador();
        setTimeout(function() { document.getElementById('editor').focus(); }, 100);
      }
    }

    function borrarDoc(nombre) {
      if (confirm('¿Borrar "' + nombre + '"?')) {
        var docs = JSON.parse(localStorage.getItem('wc_docs') || '{}');
        delete docs[nombre];
        localStorage.setItem('wc_docs', JSON.stringify(docs));
        cargarListaDocs();
      }
    }

    function compartir() {
      var contenido = document.getElementById('editor').innerText;
      if (navigator.share) {
        navigator.share({ title: document.getElementById('nombreDoc').innerText, text: contenido });
      } else {
        alert('Copiá el texto manualmente mae');
      }
    }

    function exportarPDF() {
      window.print();
    }

    function cerrarDoc() {
      if (confirm('¿Cerrar sin guardar?')) {
        abrirBackstage();
      }
    }

    function actualizarContador() {
      var texto = document.getElementById('editor').innerText || '';
      var palabras = texto.trim().split(/\s+/).filter(function(w) { return w.length > 0; }).length;
      var caracteres = texto.length;
      document.getElementById('contadorPalabras').innerText = 'Palabras: ' + palabras + ' | Caracteres: ' + caracteres;
    }

    window.onload = function() {
      document.getElementById('backstage').style.display = 'flex';
    }
  </script>
</body>
</html>
