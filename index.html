    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      background: #f3f2f1; 
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* BARRA SUPERIOR AZUL */
   .title-bar {
      background: #2b579a;
      color: white;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
   .title-bar .left-icons { display: flex; gap: 16px; }
   .title-bar .doc-name { font-weight: 400; }
   .title-bar .right-logo { 
      background: rgba(255,255,255,0.15); 
      padding: 4px 12px; 
      border-radius: 4px; 
      font-size: 12px;
    }

    /* CINTA DE PESTAÑAS */
   .ribbon-tabs {
      background: #f3f2f1;
      border-bottom: 1px solid #d2d0ce;
      display: flex;
      padding: 0 16px;
    }
   .ribbon-tab {
      padding: 8px 16px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      color: #323130;
    }
   .ribbon-tab.active {
      background: white;
      border: 1px solid #d2d0ce;
      border-bottom: 1px solid white;
      margin-bottom: -1px;
      color: #2b579a;
      font-weight: 600;
    }
    
    /* BARRA DE HERRAMIENTAS */
   .ribbon-toolbar {
      background: white;
      border-bottom: 1px solid #d2d0ce;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
   .tool-group {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1dfdd;
      padding-right: 8px;
      margin-right: 8px;
    }
   .tool-group-title {
      font-size: 11px;
      color: #605e5c;
      text-align: center;
      margin-top: 4px;
    }
   .tool-buttons { display: flex; gap: 4px; }
   .ribbon-toolbar button, .ribbon-toolbar select {
      background: white;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      height: 28px;
    }
   .ribbon-toolbar button:hover {
      border: 1px solid #8a8886;
      background: #f3f2f1;
    }
   .ribbon-toolbar select { height: 28px; }

    /* ÁREA PRINCIPAL: 3 COLUMNAS */
   .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
