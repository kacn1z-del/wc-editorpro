<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro + IA</title>

<style>

/* =========================
🌈 FONDO PRINCIPAL
========================= */
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg, #1b75ed, #ff6b00);
}

/* =========================
🧠 TOPBAR
========================= */
.topbar{
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  padding:12px;
  text-align:center;
  font-weight:bold;
}

/* TÍTULO CON DEGRADADO */
.title-gradient{
  font-size:20px;
  font-weight:900;
  background: linear-gradient(135deg, #1b75ed, #ff6b00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* =========================
🎛️ RIBBON SUPERIOR
========================= */
.ribbon{
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  display:flex;
  flex-wrap:wrap;
  padding:10px;
  gap:10px;
}

/* MENÚS */
.menu{position:relative;}
.menu button{
  background:white;
  border:none;
  padding:9px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.menu:hover .menu-content{display:block;}

.menu-content{
  display:none;
  position:absolute;
  top:42px;
  left:0;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  min-width:200px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  z-index:999;
}
.menu-content button{
  width:100%;
  text-align:left;
  padding:10px;
  border:none;
  background:transparent;
}
.menu-content button:hover{background:#e6f0ff;}

/* =========================
📄 HOJA A4
========================= */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:20px auto 140px auto;
  padding:20mm;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  border-radius:8px;
}

/* EDITOR */
#editor{
  min-height:250mm;
  outline:none;
}

/* =========================
✨ WC ARTE
========================= */
.wc-arte-1{color:#fff;text-shadow:0 0 12px #1b75ed;font-size:26px;font-weight:bold;}
.wc-arte-2{color:#fff;text-shadow:0 0 10px #ffb347;font-size:26px;font-weight:bold;}
.wc-arte-3{color:#fff;text-shadow:3px 3px 10px rgba(0,0,0,0.4);font-size:26px;font-weight:bold;}
.wc-arte-4{color:#fff;text-shadow:0 0 15px #1b75ed,0 0 25px #ff6b00;font-size:26px;font-weight:bold;}

/* =========================
🤖 IA FLOTANTE
========================= */
.ai-float{
  position:fixed;
  right:20px;
  bottom:160px;
  width:260px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  padding:10px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.ai-float input{
  width:100%;
  padding:6px;
  margin-top:5px;
}

.ai-float button{
  margin-top:5px;
  width:100%;
}

/* =========================
🧲 DOCK INFERIOR
========================= */
.dock{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  justify-content:space-around;
  gap:10px;
  padding:10px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(25px);
  border-top:1px solid rgba(0,0,0,0.1);
}

.dock-section{
  display:flex;
  flex-direction:column;
  gap:5px;
  min-width:120px;
}

.dock-title{
  font-size:12px;
  font-weight:bold;
}

.dock button{
  background:white;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.dock button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

.dock input, .dock select{
  padding:5px;
  border-radius:6px;
}

</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="title-gradient">WC CORPORATE EDITOR PRO + IA</div>
</div>

<!-- RIBBON -->
<div class="ribbon">

  <div class="menu">
    <button>Archivo</button>
    <div class="menu-content">
      <button onclick="guardar()">Guardar</button>
      <button onclick="nuevo()">Nuevo</button>
      <button onclick="imprimir()">Imprimir</button>
    </div>
  </div>

  <div class="menu">
    <button>Editar</button>
    <div class="menu-content">
      <button onclick="cmd('undo')">Deshacer</button>
      <button onclick="cmd('redo')">Rehacer</button>
      <button onclick="cmd('copy')">Copiar</button>
      <button onclick="cmd('paste')">Pegar</button>
    </div>
  </div>

  <div class="menu">
    <button>Formato</button>
    <div class="menu-content">
      <button onclick="cmd('bold')">Negrita</button>
      <button onclick="cmd('italic')">Cursiva</button>
      <button onclick="cmd('underline')">Subrayado</button>
      <button onclick="cmd('justifyCenter')">Centro</button>
    </div>
  </div>

  <div class="menu">
    <button>Insertar</button>
    <div class="menu-content">
      <button onclick="insertText('📌 Nota ')">Nota</button>
      <button onclick="insertTable()">Tabla</button>
    </div>
  </div>

  <div class="menu">
    <button>WC Arte</button>
    <div class="menu-content">
      <input id="textoArte" placeholder="Texto">
      <select id="estiloArte">
        <option value="1">Neón</option>
        <option value="2">Dorado</option>
        <option value="3">Sombra</option>
        <option value="4">Glow</option>
      </select>
      <button onclick="insertarArte()">Insertar</button>
    </div>
  </div>

  <div class="menu">
    <button>Herramientas</button>
    <div class="menu-content">
      <button onclick="limpiar()">Limpiar</button>
      <button onclick="zoomIn()">Zoom +</button>
      <button onclick="zoomOut()">Zoom -</button>
    </div>
  </div>

</div>

<!-- EDITOR -->
<div class="page">
  <div id="editor" contenteditable="true">Escribe aquí tu documento...</div>
</div>

<!-- IA -->
<div class="ai-float">
  <b>IA WC</b>
  <input id="aiInput" placeholder="Escribe...">
  <button onclick="usarIA()">Generar</button>
  <div id="aiOutput"></div>
</div>

<!-- DOCK -->
<div class="dock">

  <div class="dock-section">
    <div class="dock-title">Archivo</div>
    <button onclick="guardar()">Guardar</button>
    <button onclick="nuevo()">Nuevo</button>
    <button onclick="imprimir()">Imprimir</button>
  </div>

  <div class="dock-section">
    <div class="dock-title">Formato</div>
    <button onclick="cmd('bold')">Negrita</button>
    <button onclick="cmd('italic')">Cursiva</button>
  </div>

  <div class="dock-section">
    <div class="dock-title">WC Arte</div>
    <input id="textoArte" placeholder="Texto">
    <select id="estiloArte">
      <option value="1">Neón</option>
      <option value="2">Dorado</option>
      <option value="3">Sombra</option>
      <option value="4">Glow</option>
    </select>
    <button onclick="insertarArte()">Insertar</button>
  </div>

</div>

<script>

/* EDITOR */
function cmd(c){document.execCommand(c,false,null);}
function insertText(t){document.execCommand("insertText",false,t);}
function insertTable(){
  document.execCommand("insertHTML",false,
  "<table border='1' style='width:100%'><tr><td>A</td><td>B</td></tr></table>");
}

/* WC ARTE */
function insertarArte(){
  const t=document.getElementById("textoArte").value;
  const e=document.getElementById("estiloArte").value;
  const span=document.createElement("span");
  span.className="wc-arte-"+e;
  span.textContent=t;

  let sel=window.getSelection();
  if(!sel.rangeCount) return;
  let r=sel.getRangeAt(0);
  r.deleteContents();
  r.insertNode(span);
}

/* FILE */
function guardar(){
  localStorage.setItem("wc",document.getElementById("editor").innerHTML);
}
function nuevo(){document.getElementById("editor").innerHTML="";}
function imprimir(){window.print();}

/* HERRAMIENTAS */
function limpiar(){document.getElementById("editor").innerHTML="";}
function zoomIn(){document.body.style.zoom="110%";}
function zoomOut(){document.body.style.zoom="100%";}

/* IA */
function usarIA(){
  let t=document.getElementById("aiInput").value;
  document.getElementById("aiOutput").innerHTML="Resultado: "+t;
}

</script>

</body>
</html>
