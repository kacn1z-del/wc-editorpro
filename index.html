<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WC Corporate Editor v20.4 - Cinta Móvil Multilingüe</title>
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #1d5270 0%, #92324f 50%, #d94e18 100%);
  --bg-tab-active: #ffffff;
  --text-tab-active: #0f172a;
  --bg-ribbon-panel: #f1f5f9;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
body { background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* CABECERA PRINCIPAL */
.header-suite {
  background: var(--bg-gradient);
  padding: 12px 12px 6px 12px;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
.brand-title { color: white; font-size: 18px; font-weight: 700; margin-bottom: 8px; }

/* BOTONES SELECTORES DE IDIOMA */
.lang-bar { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.lang-btn {
  background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
  color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; white-space: nowrap;
}
.lang-btn.active { background: white; color: #0f172a; font-weight: 600; }

/* 📱 CINTA DE PESTAÑAS MÓVIL DESLIZABLE HORIZONTAL (Fiel a tu video) */
.mobile-tabs-scroll {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  white-space: nowrap;
  padding-bottom: 4px;
  scrollbar-width: none; /* Oculta scroll en Firefox */
}
.mobile-tabs-scroll::-webkit-scrollbar { display: none; } /* Oculta scroll en Chrome/Safari */

.tab-node {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.8);
  background: rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}
.tab-node.active { background: var(--bg-tab-active); color: var(--text-tab-active); font-weight: 700; }

/* PANEL DE COMANDOS SUB-PESTAÑA (Cambia según el Tab y el Idioma) */
.ribbon-commands-panel {
  background: var(--bg-ribbon-panel);
  border-bottom: 1px solid #cbd5e1;
  padding: 8px 12px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  align-items: center;
  flex-shrink: 0;
}
.cmd-btn {
  background: white; border: 1px solid #cbd5e1; padding: 6px 12px;
  border-radius: 6px; font-size: 12px; color: #334155; display: flex;
  align-items: center; gap: 4px; white-space: nowrap; cursor: pointer;
}

/* SELECTORES RÁPIDOS DE FUENTE */
.font-bar { background: #e2e8f0; padding: 6px 12px; display: flex; gap: 6px; flex-shrink: 0; }
.font-select { background: white; border: 1px solid #cbd5e1; padding: 3px 6px; border-radius: 4px; font-size: 12px; }

/* LIENZO DE PAPEL */
.workspace { flex: 1; padding: 12px; overflow-y: auto; display: flex; justify-content: center; }
.paper { width: 100%; max-width: 600px; background: white; min-height: 400px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px; border-radius: 4px; outline: none; }

/* BARRA DE ESTADO */
.footer-bar { height: 28px; background: white; border-top: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; color: #64748b; }
</style>
</head>
<body>

  <div class="header-suite">
    <div class="brand-title">WC Corporate Editor</div>
    
    <div class="lang-bar">
      <button class="lang-btn active" id="l-es" onclick="switchEcosystem('es')">🇨🇷 Español</button>
      <button class="lang-btn" id="l-en" onclick="switchEcosystem('en')">🇺🇸 English</button>
      <button class="lang-btn" id="l-bri" onclick="switchEcosystem('bri')">🌱 Bribri</button>
      <button class="lang-btn" id="l-cab" onclick="switchEcosystem('cab')">🐾 Cabécar</button>
    </div>

    <div class="mobile-tabs-scroll">
      <div class="tab-node active" id="t-inicio" onclick="changeActiveTab('inicio')">Inicio</div>
      <div class="tab-node" id="t-insertar" onclick="changeActiveTab('insertar')">Insertar</div>
      <div class="tab-node" id="t-diseno" onclick="changeActiveTab('diseno')">Diseño</div>
      <div class="tab-node" id="t-disposicion" onclick="changeActiveTab('disposicion')">Disposición</div>
      <div class="tab-node" id="t-arte" onclick="changeActiveTab('arte')">WC Arte AB</div>
      <div class="tab-node" id="t-ai" onclick="changeActiveTab('ai')">Asistente IA</div>
    </div>
  </div>

  <div class="font-bar">
    <select class="font-select"><option>Arial</option><option>Segoe UI</option></select>
    <select class="font-select"><option>14px</option><option>16px</option></select>
  </div>

  <div class="ribbon-commands-panel" id="panelComandos">
    </div>

  <div class="workspace">
    <div class="paper" contenteditable="true" id="lienzoTexto">
      <h3 id="docTitle">Bienvenido a WC Corporate Editor</h3>
      <p id="docDesc">Toque las opciones de la cinta móvil superior para formatear el texto.</p>
    </div>
  </div>

  <div class="footer-bar">
    <span id="lblEco">Ecosistema Activo: Español</span>
    <span>Por Keny Chinchilla Navarro</span>
  </div>

<script>
// PESTAÑA ACTUANTE ACTUAL
let currentTab = 'inicio';
let currentLang = 'es';

// DICCIONARIO RADICAL DE TRADUCCIÓN: TABS + SUB-BOTONES
const translationsDb = {
  es: {
    eco: "Ecosistema Activo: Español 🇨🇷",
    hTitle: "Bienvenido a WC Corporate Editor",
    hDesc: "Toque las opciones de la cinta móvil superior para formatear el texto.",
    tabs: { inicio: "Inicio", insertar: "Insertar", diseno: "Diseño", disposicion: "Disposición", arte: "WC Arte AB", ai: "Asistente IA" },
    cmds: {
      inicio: ["<b>B</b> Negrita", "<i>I</i> Cursiva", "<u>U</u> Subrayado"],
      insertar: ["📊 Tabla", "🔗 Vínculo", "📷 Imagen"],
      diseno: ["🎨 Temas", "🏁 Fondo"],
      disposicion: ["📐 Márgenes", "🥞 Columnas"],
      arte: ["⭐ Estilo Arcoíris", "👑 Oro Líquido"],
      ai: ["⚡ Corregir", "📝 Resumir"]
    }
  },
  en: {
    eco: "Active Ecosystem: English 🇺🇸",
    hTitle: "Welcome to WC Corporate Editor",
    hDesc: "Tap the options on the mobile sliding ribbon to format your document.",
    tabs: { inicio: "Home", insertar: "Insert", diseno: "Design", disposicion: "Layout", arte: "WC Art AB", ai: "AI Assistant" },
    cmds: {
      inicio: ["<b>B</b> Bold", "<i>I</i> Italic", "<u>U</u> Underline"],
      insertar: ["📊 Table", "🔗 Link", "📷 Image"],
      diseno: ["🎨 Themes", "🏁 Background"],
      disposicion: ["📐 Margins", "🥞 Columns"],
      arte: ["⭐ Neon Style", "👑 Gold Text"],
      ai: ["⚡ Proofread", "📝 Abstract"]
    }
  },
  bri: { // Bribri Traducido Integralmente
    eco: "Ecosistema Activo: Bribri pakö 🌱",
    hTitle: "Kápö - WC Corporate Editor baka",
    hDesc: "I kiane tsá̱ sörpö baka ujtëk sán.",
    tabs: { inicio: "I tsoñ", insertar: "Ujtëk", diseno: "Ká̱", disposicion: "Ká̱ já̱", arte: "WC Arte Sán", ai: "Formador IA" },
    cmds: {
      inicio: ["<b>B</b> Dgër", "<i>I</i> Lir", "<u>U</u> Muk"],
      insertar: ["📊 Tabla sán", "🔗 Enlace", "📷 Ká̱"],
      diseno: ["🎨 Color ká̱", "🏁 Su̱wë"],
      disposicion: ["📐 Margen sér", "🥞 Jë"],
      arte: ["⭐ Neon ujtëk", "👑 Oro sán"],
      ai: ["⚡ Su̱wë buá̱", "📝 Kië"]
    }
  },
  cab: { // Cabécar Traducido Integralmente
    eco: "Ecosistema Activo: Cabécar jula 🐾",
    hTitle: "Sáwá - Editor Suite",
    hDesc: "Cabécar jula sán editor por etnolingüística.",
    tabs: { inicio: "Sáwá", insertar: "Jula tsoñ", diseno: "Ká wá", disposicion: "Márgenes", arte: "WC Style", ai: "Asistente" },
    cmds: {
      inicio: ["<b>B</b> Tso", "<i>I</i> Shana", "<u>U</u> Ká"],
      insertar: ["📊 Tabla", "🔗 Link"],
      diseno: ["🎨 Fondo"],
      disposicion: ["📐 Margen baka", "🥞 Columnas"],
      arte: ["⭐ WC Arte"],
      ai: ["⚡ Corregir"]
    }
  }
};

// CAMBIAR IDIOMA GLOBAL DEL SISTEMA
function switchEcosystem(lang) {
  currentLang = lang;
  const db = translationsDb[lang];
  if(!db) return;

  // Traducir las Etiquetas de los Tabs
  for (const key in db.tabs) {
    const element = document.getElementById(`t-${key}`);
    if (element) element.textContent = db.tabs[key];
  }

  // Cambiar textos informativos
  document.getElementById('lblEco').textContent = db.eco;
  document.getElementById('docTitle').textContent = db.hTitle;
  document.getElementById('docMainDesc')?.textContent || (document.getElementById('docDesc').textContent = db.hDesc);

  // Resaltar botón de idioma seleccionado
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`l-${lang}`).classList.add('active');

  // Refrescar los comandos internos de la pestaña actual
  renderActiveCommands();
}

// CAMBIAR DE PESTAÑA (INICIO, INSERTAR, ETC.)
function changeActiveTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-node').forEach(t => t.classList.remove('active'));
  document.getElementById(`t-${tabName}`).classList.add('active');
  
  renderActiveCommands();
}

// INYECTAR BOTONES DE COMANDO DINÁMICAMENTE SEGÚN IDIOMA Y PESTAÑA
function renderActiveCommands() {
  const panel = document.getElementById('panelComandos');
  panel.innerHTML = ""; // Limpiar comandos viejos
  
  const currentCmds = translationsDb[currentLang].cmds[currentTab];
  
  if (currentCmds) {
    currentCmds.forEach(cmdText => {
      const button = document.createElement('button');
      button.className = "cmd-btn";
      button.innerHTML = cmdText;
      
      // Simular ejecutor de acciones tipográficas o de inserción
      button.onclick = () => {
        alert(`Acción ejecutada: ${cmdText.replace(/<[^>]*>/g, '')}`);
      };
      
      panel.appendChild(button);
    });
  }
}

// Inicializar la Suite en Español
switchEcosystem('es');
</script>
</body>
</html>
