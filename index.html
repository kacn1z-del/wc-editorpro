<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WC Editor PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; height: 100vh; overflow: hidden; }
    #backstage { display: flex; height: 100vh; background: white; }
    #editor-view { display: none; height: 100vh; flex-direction: column; }
   .backstage-nav { width: 200px; background: #2b579a; color: white; }
   .nav-item { padding: 12px 20px; cursor: pointer; border: none; background: none; color: white; width: 100%; text-align: left; }
   .nav-item:active { background: rgba(255,255,255,0.2); }
   .backstage-content { flex: 1; padding: 24px; }
   .templates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
   .template-card { cursor: pointer; border: 1px solid #ccc; padding: 20px; text-align: center; background: white; }
   .template-card:active { background: #e1dfdd; }
   .title-bar { background: #2b579a; color: white; padding: 8px 12px; display: flex; justify-content: space-between; }
   .title-bar span { cursor: pointer; padding: 4px 8px; }
   .toolbar { background: white; border-bottom: 1px solid #ccc; padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
   .toolbar button { padding: 8px 12px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 14px; }
   .toolbar button:active { background: #e1dfdd; }
    #editor { flex: 1; padding: 40px; background: white; outline: none; overflow-y: auto; font-size: 16px; line-height: 1.5; }
    #editor img { max-width: 100%; }
    #editor table { border-collapse: collapse; width: 100%; }
    #editor td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>

  <div id="backstage">
    <div class="backstage-nav">
      <button class="nav-item" onclick="cerrarBackstage()">← Volver</button>
      <button class="nav-item" onclick="mostrarNuevo()">Nuevo</button>
      <button class="nav-item" onclick="guardar()">Guardar</button>
    </div>
    <div class="backstage-content">
      <h1>Nuevo Documento</h1>
      <div class="templates-grid">
        <div class="template-card" onclick="abrirEditor('blanco')">Documento en blanco</div>
        <div class="template-card" onclick="abrirEditor('ensayo')">Ensayo Universitario</div>
        <div class="template-card" onclick="abrirEditor('resumen')">Resumen Académico</div>
        <div class="template-card" onclick="abrirEditor('wcArte1')">WC Arte Tricolor</div>
      </div>
    </div>
  </div>

  <div id="editor-view">
    <div class="title-bar">
      <div>
        <span onclick="abrirBackstage()">📄</span>
        <span onclick="guardar()">💾</span>
      </div>
      <div id="nombreDoc">Documento1</div>
      <div>WC Editor</div>
    </div>

    <div class="toolbar">
      <button onclick="ejecutar('bold')"><b>B</b></button>
      <button onclick="ejecutar('italic')"><i>I</i></button>
      <button onclick="ejecutar('underline')"><u>U</u></button>
      <button onclick="ejecutar('insertUnorderedList')">≡</button>
      <button onclick="ejecutar('insertOrderedList')">1≡</button>
      <button onclick="ejecutar('justifyLeft')">⬅️</button>
      <button onclick="ejecutar('justifyCenter')">↔️</button>
      <button onclick="ejecutar('justifyRight')">➡️</button>
      <button onclick="ejecutar('justifyFull')">▤</button>
      <button onclick="insertarTabla()">📊 Tabla</button>
      <button onclick="insertarImagen()">🖼️ Imagen</button>
    </div>

    <div id="editor" contenteditable="true"></div>
  </div>

  <input type="file" id="inputImagen" accept="image/*" style="display:none;">

  <script>
    var plantillas = {
      blanco: '<p>Escribí aquí...</p>',
      ensayo: '<h1 style="text-align:center; color:#2b579a;">El Ejercicio y la Salud Mental</h1><h2>Introducción</h2><p>El presente ensayo analiza el vínculo entre el ejercicio físico y la salud mental...</p><h2>Desarrollo</h2><p>El ejercicio físico tiene numerosos efectos beneficiosos...</p><h2>Conclusión</h2><p>En conclusión, el ejercicio físico es una herramienta poderosa...</p>',
      resumen: '<h2 style="color:#CE1126;">Guía para Resumen Académico</h2><h3>1. Lectura Comprensiva</h3><p>Lee el texto completo al menos dos veces...</p><h3>2. Reglas de Condensación</h3><ul><li><strong>Suprimir:</strong> Elimina detalles innecesarios</li><li><strong>Generalizar:</strong> Agrupa ideas específicas</li><li><strong>Seleccionar:</strong> Usa frases clave</li><li><strong>Construir:</strong> Crea nuevas oraciones</li></ul>',
      wcArte1: '<h1 style="font-size:48px; font-weight:900; background: linear-gradient(135deg, #2b579a 0%, #CE1126 50%, #FFD700 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin: 20px 0;">COSTA RICA</h1>'
    };

    function mostrarNuevo() {
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
    }

    function abrirBackstage() {
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
    }

    function cerrarBackstage() {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').focus();
    }

    function abrirEditor(tipo) {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').innerHTML = plantillas[tipo];
      document.getElementById('nombreDoc').innerText = tipo;
      setTimeout(function() { document.getElementById('editor').focus(); }, 100);
    }

    function ejecutar(cmd) {
      document.getElementById('editor').focus();
      document.execCommand(cmd, false, null);
    }

    function insertarTabla() {
      var filas = prompt('Filas:', '3');
      var cols = prompt('Columnas:', '3');
      if (filas && cols) {
        var html = '<table>';
        for (var i = 0; i < parseInt(filas); i++) {
          html += '<tr>';
          for (var j = 0; j < parseInt(cols); j++) { html += '<td>&nbsp;</td>'; }
          html += '</tr>';
        }
        html += '</table><p><br></p>';
        document.getElementById('editor').focus();
        document.execCommand('insertHTML', false, html);
      }
    }

    function insertarImagen() {
      document.getElementById('inputImagen').click();
    }

    document.getElementById('inputImagen').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('editor').focus();
          document.execCommand('insertImage', false, e.target.result);
        };
        reader.readAsDataURL(file);
      }
    });

    function guardar() {
      var nombre = document.getElementById('nombreDoc').innerText;
      var contenido = document.getElementById('editor').innerHTML;
      localStorage.setItem('wc_' + nombre, contenido);
      alert('✅ Guardado: ' + nombre);
    }

    window.onload = function() {
      document.getElementById('backstage').style.display = 'flex';
    };
  </script>
</body>
</html>
