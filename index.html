<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Editor Pro</title>

<style>

/* 🌈 FONDO PREMIUM */
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg, #1b75ed, #ff6b00);
  min-height:100vh;
}

/* 🧊 TOPBAR */
.topbar{
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  padding:12px;
  font-size:18px;
  font-weight:bold;
}

/* 🎛️ RIBBON */
.ribbon{
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  display:flex;
  flex-wrap:wrap;
  padding:10px;
  gap:10px;
}

/* MENÚ */
.menu{position:relative;}
.menu button{
  background:white;
  border:none;
  padding:9px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.menu-content{
  display:none;
  position:absolute;
  top:42px;
  left:0;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  min-width:200px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  z-index:999;
}
.menu:hover .menu-content{display:block;}
.menu-content button{
  width:100%;
  text-align:left;
  padding:10px;
  border:none;
  background:transparent;
}
.menu-content button:hover{background:#e6f0ff;}

/* 📄 HOJA A4 REAL */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:20px auto;
  padding:20mm;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  border-radius:8px;
}

/* ✍️ EDITOR */
#editor{
  min-height:250mm;
  outline:none;
}

/* ✨ WC ARTE */
.wc-arte-1{color:#fff;text-shadow:0 0 12px #1b75ed;font-size:26px;font-weight:bold;}
.wc-arte-2{color:#fff;text-shadow:0 0 10px #ffb347;font-size:26px;font-weight:bold;}
.wc-arte-3{color:#fff;text-shadow:3px 3px 10px rgba(0,0,0,0.4);font-size:26px;font-weight:bold;}
.wc-arte-4{color:#fff;text-shadow:0 0 15px #1b75ed,0 0 25px #ff6b00;font-size:26px;font-weight:bold;}

/* 🤖 IA PANEL */
.ai-box{
  margin:15px auto;
  width:210mm;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(20px);
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="topbar">WC CORPORATE EDITOR PRO + IA</div>

<!-- RIBBON -->
<div class="ribbon">

  <div class="menu">
    <button>Archivo</button>
    <div class="menu-content">
      <button onclick="guardar()">Guardar</button>
      <button onclick="nuevo()">Nuevo</button>
      <button onclick="imprimir()">Imprimir</button>
    </div>
  </div>

  <div class="menu">
    <button>Formato</button>
    <div class="menu-content">
      <button onclick="cmd('bold')">Negrita</button>
      <button onclick="cmd('italic')">Cursiva</button>
      <button onclick="cmd('underline')">Subrayado</button>
      <button onclick="cmd('justifyCenter')">Centro</button>
    </div>
  </div>

  <div class="menu">
    <button>Insertar</button>
    <div class="menu-content">
      <button onclick="insertText('📌 Nota ')">Nota</button>
      <button onclick="insertTable()">Tabla</button>
    </div>
  </div>

  <div class="menu">
    <button>WC Arte</button>
    <div class="menu-content">
      <input id="textoArte" placeholder="Texto">
      <select id="estiloArte">
        <option value="1">Neón</option>
        <option value="2">Dorado</option>
        <option value="3">Sombra</option>
        <option value="4">Glow</option>
      </select>
      <button onclick="insertarArte()">Insertar</button>
    </div>
  </div>

</div>

<!-- 🤖 IA SIMPLE -->
<div class="ai-box">
  <b>IA WC (modo básico)</b><br>
  <input id="aiInput" placeholder="Escribe una idea..." style="width:80%">
  <button onclick="usarIA()">Generar</button>
  <div id="aiOutput"></div>
</div>

<!-- 📄 DOCUMENTO -->
<div class="page">
  <div id="editor" contenteditable="true">
    Escribe aquí tu documento...
  </div>
</div>

<script>

let zoom = 100;

/* ⚙️ EDITOR */
function cmd(c){
  document.execCommand(c,false,null);
}

/* ➕ TEXTO */
function insertText(t){
  document.execCommand("insertText",false,t);
}

/* 📊 TABLA */
function insertTable(){
  document.execCommand("insertHTML",false,
  "<table border='1' style='width:100%'><tr><td>A</td><td>B</td></tr></table>");
}

/* ✨ WC ARTE EN CURSOR */
function insertarArte(){
  const texto=document.getElementById("textoArte").value;
  const estilo=document.getElementById("estiloArte").value;

  const span=document.createElement("span");
  span.className="wc-arte-"+estilo;
  span.textContent=texto;

  insertNodeAtCursor(span);
}

/* 📍 INSERTAR EN CURSOR REAL */
function insertNodeAtCursor(node){
  let sel=window.getSelection();
  if(!sel.rangeCount) return;
  let range=sel.getRangeAt(0);
  range.deleteContents();
  range.insertNode(node);
  range.setStartAfter(node);
  sel.removeAllRanges();
  sel.addRange(range);
}

/* 💾 GUARDADO */
function guardar(){
  localStorage.setItem("wc_doc",document.getElementById("editor").innerHTML);
  alert("Guardado automático WC");
}

/* 📂 CARGA */
function cargar(){
  const data=localStorage.getItem("wc_doc");
  if(data) document.getElementById("editor").innerHTML=data;
}

/* 🆕 NUEVO */
function nuevo(){
  document.getElementById("editor").innerHTML="";
}

/* 🖨️ IMPRIMIR */
function imprimir(){
  window.print();
}

/* 🤖 IA SIMULADA */
function usarIA(){
  let txt=document.getElementById("aiInput").value;
  document.getElementById("aiOutput").innerHTML=
  "✨ Resultado WC IA: " + txt.toUpperCase();
}

/* 💾 AUTOSAVE */
setInterval(()=>{
  localStorage.setItem("wc_auto",document.getElementById("editor").innerHTML);
},3000);

/* 🔄 RESTORE AUTO */
window.onload=()=>{
  let data=localStorage.getItem("wc_auto");
  if(data) document.getElementById("editor").innerHTML=data;
}

</script>

</body>
</html>
