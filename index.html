<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WC Editor Suite PRO - Costa Rica 🇨🇷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f3f2f1; overflow: hidden; height: 100vh; }
    #backstage { display: flex; height: 100vh; background: white; }
    #editor-view { display: none; height: 100vh; flex-direction: column; }
 .backstage-nav { width: 220px; background: #2b579a; color: white; display: flex; flex-direction: column; }
 .backstage-nav-header { padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
 .back-btn { width: 32px; height: 32px; border: 2px solid white; border-radius: 50%; background: none; color: white; cursor: pointer; font-size: 18px; }
 .nav-item { padding: 12px 20px; cursor: pointer; font-size: 14px; border: none; background: none; color: white; text-align: left; width: 100%; }
 .nav-item:active { background: rgba(255,255,255,0.2); }
 .nav-item.active { background: #1e3a5f; border-left: 3px solid #FFD700; }
 .backstage-content { flex: 1; padding: 24px; overflow-y: auto; }
 .backstage-title { font-size: 28px; font-weight: 300; color: #323130; margin-bottom: 20px; }
 .templates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; margin-bottom: 32px; }
 .template-card { cursor: pointer; border: 1px solid #e1dfdd; background: white; }
 .template-card:active { border-color: #2b579a; box-shadow: 0 0 0 2px #2b579a; }
 .template-preview { aspect-ratio: 8.5/11; background: white; border-bottom: 1px solid #e1dfdd; padding: 8px; }
 .template-name { padding: 8px; font-size: 11px; text-align: center; background: #faf9f8; }
 .docs-lista { margin-top: 32px; border-top: 2px solid #e1dfdd; padding-top: 24px; }
 .docs-lista h3 { font-size: 18px; margin-bottom: 16px; color: #323130; }
 .doc-item { padding: 12px; border: 1px solid #e1dfdd; margin-bottom: 8px; cursor: pointer; background: white; display: flex; justify-content: space-between; align-items: center; }
 .doc-item:active { background: #f3f2f1; }
 .doc-item-nombre { font-weight: 600; font-size: 14px; }
 .doc-item-fecha { font-size: 11px; color: #605e5c; }
 .doc-item-borrar { background: #CE1126; color: white; border: none; padding: 4px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; }
 .title-bar { background: #2b579a; color: white; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
 .title-bar-icons { display: flex; gap: 12px; }
 .title-bar-icons span { cursor: pointer; padding: 4px; font-size: 18px; }
 .title-bar-icons span:active { background: rgba(255,255,255,0.3); border-radius: 3px; }
 .ribbon-tabs { background: #f3f2f1; border-bottom: 1px solid #d2d0ce; display: flex; padding: 0 12px; overflow-x: auto; }
 .ribbon-tab { padding: 8px 14px; cursor: pointer; border: none; background: none; font-size: 14px; color: #323130; white-space: nowrap; }
 .ribbon-tab.active { background: white; border: 1px solid #d2d0ce; border-bottom: 1px solid white; margin-bottom: -1px; color: #2b579a; font-weight: 600; }
 .ribbon-toolbar { background: white; border-bottom: 1px solid #d2d0ce; padding: 8px 12px; display: none; gap: 8px; align-items: center; flex-wrap: wrap; overflow-x: auto; }
 .ribbon-toolbar.active { display: flex; }
 .tool-group { display: flex; flex-direction: column; border-right: 1px solid #e1dfdd; padding-right: 8px; margin-right: 8px; }
 .tool-group-title { font-size: 10px; color: #605e5c; text-align: center; margin-top: 2px; }
 .tool-buttons { display: flex; gap: 4px; align-items: center; }
 .ribbon-toolbar button,.ribbon-toolbar select,.ribbon-toolbar input[type="color"] { background: white; border: 1px solid #ccc; padding: 6px 10px; border-radius: 3px; cursor: pointer; font-size: 14px; height: 36px; min-width: 36px; }
 .ribbon-toolbar button:active { background: #e1dfdd; border-color: #2b579a; }
 .ribbon-toolbar input[type="color"] { padding: 2px; width: 36px; }
 .main-editor-area { flex: 1; background: #e6e6e6; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; align-items: center; }
 .page-header,.page-footer { width: 100%; max-width: 816px; background: #faf9f8; border: 1px dashed #ccc; padding: 12px 40px; font-size: 12px; color: #605e5c; text-align: center; display: none; }
 .page-header { border-bottom: none; }
 .page-footer { border-top: none; margin-top: -1px; }
    #editor { width: 100%; max-width: 816px; min-height: 600px; background: white; box-shadow: 0 0 8px rgba(0,0,0,0.15); padding: 40px; outline: none; font-size: 16px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
    #editor img { max-width: 100%; height: auto; }
    #editor table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    #editor table td, #editor table th { border: 1px solid #ccc; padding: 8px; }
 .comentario { background: #FFF3CD; border-left: 3px solid #FFD700; padding: 8px; margin: 8px 0; font-size: 13px; }
 .status-bar { background: #f3f2f1; border-top: 1px solid #d2d0ce; padding: 4px 12px; font-size: 12px; color: #605e5c; display: flex; justify-content: space-between; }
 .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
 .modal.active { display: flex; }
 .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 90%; width: 400px; }
 .modal-content h3 { margin-bottom: 16px; }
 .modal-content input,.modal-content textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; margin-bottom: 12px; font-size: 14px; }
 .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
 .modal-buttons button { padding: 8px 16px; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; }
 .btn-primary { background: #2b579a; color: white; }
 .btn-secondary { background: #e1dfdd; color: #323130; }
  </style>
</head>
<body>

    <div class="backstage-nav">

        <button class="back-btn" onclick="cerrarBackstage()">←</button>
        <span style="font-weight: 600;">Info</span>
      </div>

      <button class="nav-item" onclick="window.print()">Imprimir</button>

      <button class="nav-item" onclick="exportarPDF()">Exportar PDF</button>

          <div class="template-card" onclick="abrirEditor('ensayo')">
            <div class="template-preview">
              <div style="width:70%; height:3px; background:#000; margin:4px auto;"></div>
