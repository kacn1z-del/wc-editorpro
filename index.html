<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WC Editor PRO 🇨🇷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: Arial; height: 100vh; overflow: hidden; }
    #backstage { display: flex; height: 100vh; background: white; }
    #editor-view { display: none; height: 100vh; flex-direction: column; }
   :root { --azul: #002B7F; --rojo: #CE1126; --dorado: #FFD700; --verde: #006847; }
  .backstage-nav { width: 260px; background: var(--azul); color: white; }
  .backstage-nav-header { padding: 16px; background: var(--rojo); display: flex; gap: 12px; align-items: center; }
  .back-btn { width: 32px; height: 32px; border: 2px solid white; border-radius: 50%; background: none; color: white; cursor: pointer; font-size: 18px; }
  .nav-item { padding: 12px 20px; cursor: pointer; border: none; background: none; color: white; width: 100%; text-align: left; display: flex; gap: 12px; }
  .nav-item:active { background: rgba(255,255,255,0.2); }
  .nav-item.active { background: #001F5C; border-left: 3px solid var(--dorado); }
  .backstage-content { flex: 1; padding: 24px; overflow-y: auto; background: #faf9f8; }
  .backstage-title { font-size: 32px; font-weight: 300; color: var(--azul); margin-bottom: 20px; }
  .templates-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .template-card { cursor: pointer; border: 1px solid #ccc; background: white; padding: 20px; text-align: center; font-weight: 600; color: var(--azul); }
  .template-card:active { background: #e1dfdd; transform: scale(0.98); }
  .title-bar { background: var(--azul); color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
  .title-bar span { cursor: pointer; padding: 4px 8px; font-size: 18px; }
  .title-bar span:active { background: rgba(255,255,255,0.3); border-radius: 3px; }
  .toolbar { background: white; border-bottom: 1px solid #ccc; padding: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .toolbar button { padding: 8px 12px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 16px; min-width: 40px; }
  .toolbar button:active { background: #e1dfdd; border-color: var(--azul); }
    #editor { flex: 1; padding: 40px; background: white; outline: none; overflow-y: auto; font-size: 16px; line-height: 1.5; }
    #editor img { max-width: 100%; }
    #editor table { border-collapse: collapse; width: 100%; margin: 10px 0; }
    #editor td { border: 1px solid #ccc; padding: 8px; }
    #editor h1 { color: var(--azul); font-size: 28px; margin: 20px 0 12px; }
    #editor h2 { color: var(--azul); font-size: 22px; margin: 16px 0 8px; border-bottom: 2px solid var(--azul); }
    #editor h3 { color: var(--rojo); font-size: 18px; margin: 12px 0 6px; }
    #editor strong { font-weight: bold; }
    #editor em { font-style: italic; }
    #editor u { text-decoration: underline; }
    #editor ul, #editor ol { margin: 10px 0 10px 30px; }
  .status-bar { background: var(--azul); color: white; padding: 4px 12px; font-size: 12px; display: flex; justify-content: space-between; }
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; }
  .modal.active { display: flex; }
  .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; border-top: 4px solid var(--azul); }
  .modal-content h3 { margin-bottom: 16px; color: var(--azul); }
  .modal-content input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 3px; margin-bottom: 12px; }
  .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-buttons button { padding: 8px 16px; border: none; border-radius: 3px; cursor: pointer; }
  .btn-primary { background: var(--azul); color: white; }
  .btn-secondary { background: #e1dfdd; color: #323130; }
  </style>
</head>
<body>

  <div id="backstage">
    <div class="backstage-nav">
      <div class="backstage-nav-header">
        <button class="back-btn" id="btnVolver">←</button>
        <span>Archivo</span>
      </div>
      <button class="nav-item" id="btnNuevo">📄 Nuevo</button>
      <button class="nav-item" id="btnGuardar">💾 Guardar</button>
      <button class="nav-item" id="btnAbrir">📂 Abrir</button>
      <button class="nav-item" id="btnImprimir">🖨️ Imprimir</button>
    </div>
    <div class="backstage-content">
      <h1 class="backstage-title">Nuevo Documento</h1>
      <div class="templates-grid">
        <div class="template-card" data-plantilla="blanco">Documento en blanco</div>
        <div class="template-card" data-plantilla="ensayo">Ensayo Universitario</div>
        <div class="template-card" data-plantilla="resumen">Resumen Académico</div>
        <div class="template-card" data-plantilla="wcArte1">WC Arte Tricolor</div>
      </div>
    </div>
  </div>

  <div id="editor-view">
    <div class="title-bar">
      <div>
        <span id="btnArchivo">📄</span>
        <span id="btnGuardarTop">💾</span>
        <span id="btnDeshacer">↶</span>
        <span id="btnRehacer">↷</span>
      </div>
      <div id="nombreDoc">Documento1</div>
      <div>WC PRO 🇨🇷</div>
    </div>

    <div class="toolbar">
      <button id="btnBold"><b>B</b></button>
      <button id="btnItalic"><i>I</i></button>
      <button id="btnUnderline"><u>U</u></button>
      <button id="btnUL">≡</button>
      <button id="btnOL">1≡</button>
      <button id="btnLeft">⬅️</button>
      <button id="btnCenter">↔️</button>
      <button id="btnRight">➡️</button>
      <button id="btnTabla">📊</button>
      <button id="btnImagen">🖼️</button>
    </div>

    <div id="editor" contenteditable="true"></div>

    <div class="status-bar">
      <span id="contadorPalabras">Palabras: 0</span>
      <span>Costa Rica 🇨🇷</span>
    </div>
  </div>

  <div class="modal" id="modalTabla">
    <div class="modal-content">
      <h3>Insertar Tabla</h3>
      <input type="number" id="tablaFilas" placeholder="Filas" value="3" min="1">
      <input type="number" id="tablaCols" placeholder="Columnas" value="3" min="1">
      <div class="modal-buttons">
        <button class="btn-secondary" id="btnCancelarTabla">Cancelar</button>
        <button class="btn-primary" id="btnCrearTabla">Insertar</button>
      </div>
    </div>
  </div>

  <input type="file" id="inputImagen" accept="image/*" style="display:none;">

  <script>
    // VARIABLES GLOBALES
    var undoStack = [];
    var redoStack = [];

    var plantillas = {
      blanco: '<p>Escribí aquí...</p>',
      ensayo: '<h1 style="text-align:center;color:#002B7F;">El Ejercicio y la Salud Mental</h1><h2>Introducción</h2><p>El presente ensayo analiza el vínculo entre el ejercicio físico y la salud mental...</p><h2>Desarrollo</h2><p>El ejercicio físico tiene numerosos efectos beneficiosos...</p><h2>Conclusión</h2><p>En conclusión, el ejercicio físico es una herramienta poderosa...</p>',
      resumen: '<h2 style="color:#CE1126;">Guía para Resumen Académico</h2><h3>1. Lectura Comprensiva</h3><p>Lee el texto completo al menos dos veces...</p><h3>2. Reglas de Condensación</h3><ul><li><strong>Suprimir:</strong> Elimina detalles innecesarios</li><li><strong>Generalizar:</strong> Agrupa ideas específicas</li><li><strong>Seleccionar:</strong> Usa frases clave</li><li><strong>Construir:</strong> Crea nuevas oraciones</li></ul>',
      wcArte1: '<h1 style="font-size:48px;font-weight:900;background:linear-gradient(135deg,#002B7F 0%,#CE1126 50%,#FFD700 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;">COSTA RICA</h1><p style="text-align:center;">Pura Vida Mae 🇨🇷</p>'
    };

    // FUNCIÓN NUEVA: Aplicar formato SIN execCommand - JALA EN CHROME/SAFARI
    function aplicarFormato(tag) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;

      guardarEstado();
      var range = sel.getRangeAt(0);
      if (range.collapsed) return;

      var contenido = range.extractContents();
      var elemento = document.createElement(tag);
      elemento.appendChild(contenido);
      range.insertNode(elemento);

      sel.removeAllRanges();
      var newRange = document.createRange();
      newRange.selectNodeContents(elemento);
      sel.addRange(newRange);

      actualizarContador();
    }

    // FUNCIÓN NUEVA: Insertar lista SIN execCommand
    function insertarLista(ordenada) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;

      guardarEstado();
      var range = sel.getRangeAt(0);
      var tag = ordenada? 'ol' : 'ul';
      var lista = document.createElement(tag);
      var item = document.createElement('li');
      item.innerHTML = range.toString() || '&nbsp;';
      lista.appendChild(item);

      range.deleteContents();
      range.insertNode(lista);

      sel.removeAllRanges();
      var newRange = document.createRange();
      newRange.selectNodeContents(item);
      newRange.collapse(false);
      sel.addRange(newRange);

      actualizarContador();
    }

    // FUNCIÓN NUEVA: Alinear SIN execCommand
    function alinear(alineacion) {
      var sel = window.getSelection();
      if (!sel.rangeCount) return;

      guardarEstado();
      var range = sel.getRangeAt(0);
      var nodo = range.commonAncestorContainer;

      while (nodo && nodo.nodeType!== 1) {
        nodo = nodo.parentNode;
      }
      while (nodo && nodo.tagName!== 'P' && nodo.tagName!== 'DIV' && nodo.tagName!== 'H1' && nodo.tagName!== 'H2' && nodo.tagName!== 'H3') {
        nodo = nodo.parentNode;
      }

      if (nodo && nodo!== document.getElementById('editor')) {
        nodo.style.textAlign = alineacion;
      } else {
        var div = document.createElement('div');
        div.style.textAlign = alineacion;
        div.appendChild(range.extractContents());
        range.insertNode(div);
      }
      actualizarContador();
    }

    function guardarEstado() {
      var editor = document.getElementById('editor');
      undoStack.push(editor.innerHTML);
      if (undoStack.length > 50) undoStack.shift();
      redoStack = [];
    }

    function deshacer() {
      if (undoStack.length > 0) {
        var editor = document.getElementById('editor');
        redoStack.push(editor.innerHTML);
        editor.innerHTML = undoStack.pop();
        actualizarContador();
      }
    }

    function rehacer() {
      if (redoStack.length > 0) {
        var editor = document.getElementById('editor');
        undoStack.push(editor.innerHTML);
        editor.innerHTML = redoStack.pop();
        actualizarContador();
      }
    }

    function cerrarBackstage() {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').focus();
    }

    function abrirBackstage() {
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
    }

    function abrirEditor(tipo) {
      document.getElementById('backstage').style.display = 'none';
      document.getElementById('editor-view').style.display = 'flex';
      document.getElementById('editor').innerHTML = plantillas[tipo] || plantillas.blanco;
      document.getElementById('nombreDoc').innerText = tipo;
      setTimeout(function() {
        document.getElementById('editor').focus();
        actualizarContador();
      }, 100);
    }

    function guardar() {
      var nombre = document.getElementById('nombreDoc').innerText;
      var contenido = document.getElementById('editor').innerHTML;
      localStorage.setItem('wc_' + nombre, contenido);
      alert('✅ Guardado: ' + nombre);
    }

    function abrirModalTabla() {
      document.getElementById('modalTabla').classList.add('active');
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function crearTabla() {
      var filas = parseInt(document.getElementById('tablaFilas').value);
      var cols = parseInt(document.getElementById('tablaCols').value);
      if (filas > 0 && cols > 0) {
        guardarEstado();
        var html = '<table>';
        for (var i = 0; i < filas; i++) {
          html += '<tr>';
          for (var j = 0; j < cols; j++) { html += '<td>&nbsp;</td>'; }
          html += '</tr>';
        }
        html += '</table><p><br></p>';

        var editor = document.getElementById('editor');
        editor.focus();
        var sel = window.getSelection();
        if (sel.rangeCount) {
          var range = sel.getRangeAt(0);
          var div = document.createElement('div');
          div.innerHTML = html;
          range.insertNode(div.firstChild);
        }
        actualizarContador();
      }
      cerrarModal('modalTabla');
    }

    function cargarImagen(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(e) {
          guardarEstado();
          var img = document.createElement('img');
          img.src = e.target.result;
          img.style.maxWidth = '100%';

          var editor = document.getElementById('editor');
          editor.focus();
          var sel = window.getSelection();
          if (sel.rangeCount) {
            var range = sel.getRangeAt(0);
            range.insertNode(img);
            range.setStartAfter(img);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
          }
          actualizarContador();
        };
        reader.readAsDataURL(file);
      }
    }

    function actualizarContador() {
      var texto = document.getElementById('editor').innerText || '';
      var palabras = texto.trim().split(/\s+/).filter(function(p) { return p.length > 0; }).length;
      document.getElementById('contadorPalabras').innerText = 'Palabras: ' + palabras;
    }

    // INICIALIZAR TODO CUANDO CARGA
    document.addEventListener('DOMContentLoaded', function() {
      // BOTONES BACKSTAGE
      document.getElementById('btnVolver').onclick = cerrarBackstage;
      document.getElementById('btnNuevo').onclick = function() { abrirBackstage(); };
      document.getElementById('btnGuardar').onclick = guardar;

      // PLANTILLAS
      document.querySelectorAll('.template-card').forEach(function(card) {
        card.onclick = function() { abrirEditor(this.dataset.plantilla); };
      });

      // BOTONES EDITOR
      document.getElementById('btnArchivo').onclick = abrirBackstage;
      document.getElementById('btnGuardarTop').onclick = guardar;
      document.getElementById('btnDeshacer').onclick = deshacer;
      document.getElementById('btnRehacer').onclick = rehacer;

      // TOOLBAR BOTONES
      document.getElementById('btnBold').onclick = function() { aplicarFormato('strong'); };
      document.getElementById('btnItalic').onclick = function() { aplicarFormato('em'); };
      document.getElementById('btnUnderline').onclick = function() { aplicarFormato('u'); };
      document.getElementById('btnUL').onclick = function() { insertarLista(false); };
      document.getElementById('btnOL').onclick = function() { insertarLista(true); };
      document.getElementById('btnLeft').onclick = function() { alinear('left'); };
      document.getElementById('btnCenter').onclick = function() { alinear('center'); };
      document.getElementById('btnRight').onclick = function() { alinear('right'); };
      document.getElementById('btnTabla').onclick = abrirModalTabla;
      document.getElementById('btnImagen').onclick = function() { document.getElementById('inputImagen').click(); };

      // MODAL
      document.getElementById('btnCancelarTabla').onclick = function() { cerrarModal('modalTabla'); };
      document.getElementById('btnCrearTabla').onclick = crearTabla;
      document.getElementById('inputImagen').onchange = cargarImagen;

      // EDITOR
      document.getElementById('editor').addEventListener('input', actualizarContador);
      document.getElementById('editor').addEventListener('keyup', actualizarContador);

      // MOSTRAR BACKSTAGE AL INICIO
      document.getElementById('backstage').style.display = 'flex';
      document.getElementById('editor-view').style.display = 'none';
    });
  </script>
</body>
</html>
