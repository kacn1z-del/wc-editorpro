<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC Corporate Word Pro</title>

<style>

/* 🌈 FONDO */
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#1b75ed,#ff6b00);
}

/* 🧠 TOPBAR */
.topbar{
  background: rgba(255,255,255,0.75);
  text-align:center;
  padding:10px;
}

.title{
  font-weight:900;
  font-size:20px;
  background: linear-gradient(135deg,#1b75ed,#ff6b00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* 📑 TABS (ESTILO WORD REAL) */
.tabs{
  display:flex;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  padding:6px;
  gap:6px;
}

.tab{
  padding:8px 14px;
  background:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:#e6f0ff;
}

/* 🎛️ CONTENIDO DE CADA TAB */
.panel{
  display:none;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(20px);
  padding:10px;
  gap:8px;
  flex-wrap:wrap;
}

.panel.active{
  display:flex;
}

/* BOTONES */
button{
  background:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* 📄 DOCUMENTO */
.page{
  width:210mm;
  min-height:297mm;
  background:white;
  margin:20px auto;
  padding:20mm;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

#editor{
  min-height:250mm;
  outline:none;
}

/* ✨ WC ARTE */
.wc{
  font-weight:bold;
  font-size:24px;
  color:white;
  text-shadow:0 0 10px #1b75ed,0 0 20px #ff6b00;
}

</style>
</head>

<body>

<div class="topbar">
  <div class="title">WC CORPORATE WORD PRO + IA</div>
</div>

<!-- 📑 TABS -->
<div class="tabs">
  <div class="tab active" onclick="openTab('inicio')">Inicio</div>
  <div class="tab" onclick="openTab('insertar')">Insertar</div>
  <div class="tab" onclick="openTab('formato')">Formato</div>
  <div class="tab" onclick="openTab('archivo')">Archivo</div>
  <div class="tab" onclick="openTab('wc')">WC Arte</div>
</div>

<!-- 🧩 PANELS -->

<div id="inicio" class="panel active">
  <button onclick="cmd('undo')">Deshacer</button>
  <button onclick="cmd('redo')">Rehacer</button>
  <button onclick="cmd('copy')">Copiar</button>
  <button onclick="cmd('paste')">Pegar</button>
</div>

<div id="insertar" class="panel">
  <button onclick="insertText('📌 Nota ')">Nota</button>
  <button onclick="insertTable()">Tabla</button>
</div>

<div id="formato" class="panel">
  <button onclick="cmd('bold')">Negrita</button>
  <button onclick="cmd('italic')">Cursiva</button>
  <button onclick="cmd('underline')">Subrayado</button>
  <button onclick="cmd('justifyCenter')">Centro</button>
</div>

<div id="archivo" class="panel">
  <button onclick="guardar()">Guardar</button>
  <button onclick="nuevo()">Nuevo</button>
  <button onclick="imprimir()">Imprimir</button>
</div>

<div id="wc" class="panel">
  <input id="textoArte" placeholder="Texto">
  <button onclick="insertWC()">Insertar WC Arte</button>
</div>

<!-- 📄 EDITOR -->
<div class="page">
  <div id="editor" contenteditable="true">Escribe aquí...</div>
</div>

<script>

/* 📑 TABS */
function openTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

/* EDITOR */
function cmd(c){document.execCommand(c,false,null);}
function insertText(t){document.execCommand("insertText",false,t);}
function insertTable(){
  document.execCommand("insertHTML",false,
  "<table border='1' style='width:100%'><tr><td>A</td><td>B</td></tr></table>");
}

/* WC ARTE */
function insertWC(){
  let t=document.getElementById("textoArte").value;
  let span=document.createElement("span");
  span.className="wc";
  span.textContent=t;

  let sel=window.getSelection();
  let r=sel.getRangeAt(0);
  r.deleteContents();
  r.insertNode(span);
}

/* ARCHIVO */
function guardar(){
  localStorage.setItem("wc",document.getElementById("editor").innerHTML);
}
function nuevo(){document.getElementById("editor").innerHTML="";}
function imprimir(){window.print();}

</script>

</body>
</html>
