<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WC Corporate Editor - Stable</title>

<style>

html, body{
  margin:0;
  padding:0;
  height:100%;
  font-family:-apple-system, BlinkMacSystemFont, sans-serif;
  background:#e9eef5;
  overflow:auto;
}

/* HEADER SIMPLE */
.header{
  background:linear-gradient(135deg,#1d5270,#92324f,#d94e18);
  color:white;
  padding:10px;
  font-weight:700;
}

/* TOOLBAR SIMPLE (SIN OVERLAYS) */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  padding:8px;
  background:white;
  border-bottom:1px solid #ccc;
  position:sticky;
  top:0;
  z-index:10;
}

.toolbar button, .toolbar select{
  padding:6px 10px;
  border:1px solid #ccc;
  background:white;
  border-radius:6px;
}

/* EDITOR REALMENTE SEGURO */
#editor{
  margin:12px;
  padding:20px;
  min-height:70vh;
  background:white;
  border-radius:10px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);

  outline:none;

  font-size:16px;
  line-height:1.8;

  -webkit-user-select:text;
  user-select:text;

  touch-action:auto;
}

/* FOOTER */
.footer{
  background:white;
  border-top:1px solid #ddd;
  padding:8px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

</style>
</head>

<body>

<div class="header">
💼 WC Corporate Editor (Stable Mode)
</div>

<div class="toolbar">

<button onclick="cmd('bold')">B</button>
<button onclick="cmd('italic')">I</button>
<button onclick="cmd('underline')">U</button>

<button onclick="cmd('insertUnorderedList')">•</button>
<button onclick="cmd('insertOrderedList')">1.</button>

<button onclick="cmd('justifyLeft')">⬅</button>
<button onclick="cmd('justifyCenter')">↔</button>
<button onclick="cmd('justifyRight')">➡</button>

<button onclick="save()">💾</button>

</div>

<div id="editor" contenteditable="true">
<h2>Documento WC</h2>
<p>Este es el editor estable recuperado.</p>
</div>

<div class="footer">
<span id="counter">0 palabras</span>
<span>WC Stable Engine</span>
</div>

<script>

const editor = document.getElementById("editor");

/* 🔥 IMPORTANTE: FOCO FIJO iPhone */
window.onload = () => {
  setTimeout(() => editor.focus(), 250);
};

editor.addEventListener("touchstart", () => {
  editor.focus();
});

/* COMMANDS */
function cmd(action){
  document.execCommand(action,false,null);
  updateCounter();
}

/* SAVE */
function save(){
  localStorage.setItem("wc_doc", editor.innerHTML);
  alert("Guardado ✔");
}

/* COUNTER */
function updateCounter(){
  const text = editor.innerText || "";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById("counter").innerText =
    `${words} palabras`;
}

editor.addEventListener("input", updateCounter);

/* LOAD */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("wc_doc");
  if(saved){
    editor.innerHTML = saved;
  }
  updateCounter();
});

</script>

</body>
</html>
