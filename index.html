<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WC Corporate Editor v22.6 - Platinum Suite Total</title>
<style>
/* ... (Se mantienen tus estilos CSS originales para que el diseño no cambie) ... */
:root { --bg-gradient: linear-gradient(135deg, #1d5270 0%, #92324f 50%, #d94e18 100%); --dark-dropdown-bg: #111827; }
/* ... (El resto de tu CSS permanece igual) ... */
</style>
</head>
<body>
<script>
// --- NUEVO MÓDULO INTEGRADO ---

let virtualClipboard = ["Copia inicial del sistema", "Cláusula corporativa 2026"];

// 1. GESTIÓN DE PORTAPAPELES (HISTORIAL)
function manageClipboard(action) {
    if(action === 'cut' || action === 'copy') {
        const text = window.getSelection().toString();
        if(text) { 
            virtualClipboard.unshift(text); 
            document.execCommand(action);
            openModal("Contenido guardado en el portapapeles.");
        }
    } else if (action === 'paste') {
        document.execCommand('insertHTML', false, virtualClipboard[0]);
    }
}

// 2. LISTAS MULTINIVEL (FUNCIÓN INTEGRADA)
function insertMultilevelList() {
    document.getElementById('lienzoTexto').focus();
    const listHtml = `
    <ol style="margin-left:25px;">
        <li>Nivel 1
            <ol style="list-style-type: lower-alpha;">
                <li>Nivel 2 (Subnivel)</li>
            </ol>
        </li>
    </ol><p><br></p>`;
    document.execCommand('insertHTML', false, listHtml);
}

// 3. SALTOS DE PÁGINA Y SECCIÓN (INTEGRADO)
function insertPageBreak(type) {
    document.getElementById('lienzoTexto').focus();
    const style = type === 'section' ? '3px double #1d5270' : '2px dashed #92324f';
    const label = type === 'section' ? 'SALTO DE SECCIÓN' : 'SALTO DE PÁGINA';
    document.execCommand('insertHTML', false, `<hr style="border:0; border-top:${style}; margin:20px 0;">`);
}

// 4. SOBRESCRIBIMOS LA FUNCIÓN DE COMANDOS PARA INCLUIR LAS NUEVAS
function triggerCommandAction(actionKey, label) {
    document.getElementById('lienzoTexto').focus();
    switch(actionKey) {
        case "cut": manageClipboard('cut'); break;
        case "copy": manageClipboard('copy'); break;
        case "paste": manageClipboard('paste'); break;
        case "list": insertMultilevelList(); break;
        case "pagebreak": insertPageBreak('page'); break;
        case "sectionbreak": insertPageBreak('section'); break;
        default: 
            // Llamar funciones originales si no es una de las nuevas
            if(typeof window[actionKey] === 'function') window[actionKey]();
            else document.execCommand(actionKey);
    }
    updateCounters();
}

// --- AJUSTE DE LA INTERFAZ PARA MOSTRAR LAS NUEVAS ACCIONES ---
// Modificamos el render para que "Inicio" e "Insertar" tengan los botones nuevos
function renderActiveCommands() {
    const panel = document.getElementById('panelComandos');
    panel.innerHTML = "";
    
    // Botones dinámicos según pestaña
    if(currentTab === 'inicio') {
        addBtn(panel, "✂️ Cortar", "cut");
        addBtn(panel, "📄 Copiar", "copy");
        addBtn(panel, "📋 Pegar", "paste");
        addBtn(panel, "🔢 Lista", "list");
    } else if(currentTab === 'insertar') {
        addBtn(panel, "📄 Salto Pág.", "pagebreak");
        addBtn(panel, "🛡️ Salto Secc.", "sectionbreak");
    }
    // ...resto de tu lógica original...
}

function addBtn(parent, txt, act) {
    const b = document.createElement('button');
    b.className = "cmd-btn";
    b.innerHTML = txt;
    b.onclick = () => triggerCommandAction(act, txt);
    parent.appendChild(b);
}

// Inicializar
switchEcosystem('es');
</script>
</body>
</html>
