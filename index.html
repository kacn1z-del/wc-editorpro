<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EditorPro SaaS AI Cloud</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
 margin:0;
 font-family:Arial;
 display:flex;
 height:100vh;
 background:#0f172a;
 color:white;
}

.sidebar{
 width:260px;
 background:#111c33;
 padding:15px;
}

.editor{
 flex:1;
 padding:20px;
 outline:none;
 background:#0f172a;
}

.toolbar button{
 margin:3px;
 padding:8px;
}
</style>
</head>

<body>

<div class="sidebar">
<h3>☁ EditorPro SaaS</h3>

<button onclick="loginGoogle()">🔐 Login Google</button>
<button onclick="saveCloud()">☁ Guardar nube</button>
<button onclick="loadCloud()">📂 Cargar</button>
<button onclick="saveDrive()">📁 Google Drive</button>

<hr>

<textarea id="aiPrompt" placeholder="IA prompt"></textarea>
<button onclick="runAI()">🤖 IA</button>

</div>

<div class="editor" contenteditable="true" id="editor">
<h1>Documento SaaS</h1>
</div>

<script>
let user = null;

/* ===== GOOGLE LOGIN (BASE) ===== */
function loginGoogle(){
  alert("Aquí se conecta Google OAuth (te lo armo en el siguiente paso completo)");
}

/* ===== FIREBASE PLACEHOLDER ===== */
function saveCloud(){
  localStorage.setItem("doc", document.getElementById("editor").innerHTML);
  alert("Guardado local (Firebase se conecta en backend)");
}

function loadCloud(){
  document.getElementById("editor").innerHTML = localStorage.getItem("doc");
}

/* ===== GOOGLE DRIVE ===== */
function saveDrive(){
  alert("Aquí se integra Google Drive API (upload file real)");
}

/* ===== IA REAL ===== */
async function runAI(){
  let text = document.getElementById("aiPrompt").value;

  let res = await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer TU_OPENAI_API_KEY"
    },
    body:JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"user",content:text}]
    })
  });

  let data = await res.json();
  document.getElementById("editor").innerHTML +=
  "<p><b>IA:</b> "+data.choices[0].message.content+"</p>";
}
</script>

</body>
</html>
