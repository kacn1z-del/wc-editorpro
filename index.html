<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EditorPro - Word Mode</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
  --bg:#1e1e1e;
  --panel:#2b2b2b;
  --toolbar:#333333;
  --paper:#ffffff;
  --text:#111;
  --accent:#2b579a;
}

*{box-sizing:border-box;font-family:Segoe UI, Arial;}

body{
  margin:0;
  background:var(--bg);
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* TOP WORD RIBBON */
.ribbon{
  background:var(--panel);
  color:white;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.ribbon-left{
  font-weight:bold;
}

.ribbon-tools button{
  background:var(--toolbar);
  border:none;
  color:white;
  padding:6px 10px;
  margin:0 2px;
  border-radius:4px;
  cursor:pointer;
}

.ribbon-tools button:hover{
  background:var(--accent);
}

/* MAIN AREA */
.workspace{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px;
  overflow:auto;
}

/* WORD PAGE */
.page{
  width:820px;
  min-height:1100px;
  background:var(--paper);
  color:var(--text);
  padding:80px;
  box-shadow:0 0 20px rgba(0,0,0,.4);
  outline:none;
}

/* STATUS BAR */
.status{
  background:var(--panel);
  color:white;
  padding:6px 10px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
}

/* AI BOX */
.ai{
  position:fixed;
  right:20px;
  bottom:20px;
  width:280px;
  background:var(--panel);
  color:white;
  border-radius:10px;
  padding:10px;
}

.ai textarea{
  width:100%;
  height:70px;
  border:none;
  padding:6px;
  border-radius:6px;
}

.ai button{
  width:100%;
  margin-top:5px;
  padding:8px;
  border:none;
  border-radius:6px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- WORD RIBBON -->
<div class="ribbon">
  <div class="ribbon-left">📄 EditorPro Word Mode</div>

  <div class="ribbon-tools">
    <button onclick="cmd('bold')"><b>B</b></button>
    <button onclick="cmd('italic')"><i>I</i></button>
    <button onclick="cmd('underline')"><u>U</u></button>
    <button onclick="cmd('insertUnorderedList')">• Lista</button>
    <button onclick="cmd('justifyLeft')">Izq</button>
    <button onclick="cmd('justifyCenter')">Centro</button>
    <button onclick="save()">💾</button>
    <button onclick="load()">📂</button>
    <button onclick="exportDoc()">⬇</button>
  </div>
</div>

<!-- EDITOR -->
<div class="workspace">
  <div id="page" class="page" contenteditable="true">
    <h1>Título del documento</h1>
    <p>Escribe aquí como en Microsoft Word...</p>
  </div>
</div>

<!-- STATUS -->
<div class="status">
  <div>Estado: listo</div>
  <div>Word Mode - EditorPro</div>
</div>

<!-- AI -->
<div class="ai">
  <b>🤖 IA Assistant</b>
  <textarea id="aiText"></textarea>
  <button onclick="ai()">Generar</button>
</div>

<script>

/* COMMANDS */
function cmd(c){
  document.execCommand(c,false,null);
}

/* SAVE */
function save(){
  localStorage.setItem("worddoc", document.getElementById("page").innerHTML);
  alert("Guardado");
}

/* LOAD */
function load(){
  document.getElementById("page").innerHTML =
    localStorage.getItem("worddoc") || "";
}

/* EXPORT */
function exportDoc(){
  let blob = new Blob([document.getElementById("page").innerHTML], {type:"text/html"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="documento-word.html";
  a.click();
}

/* IA MOCK */
function ai(){
  let t=document.getElementById("aiText").value;
  document.getElementById("page").innerHTML += `<p><b>IA:</b> ${t}</p>`;
}

/* AUTOSAVE */
setInterval(()=>{
  localStorage.setItem("worddoc", document.getElementById("page").innerHTML);
},3000);

window.onload=()=>{
  load();
};

</script>

</body>
</html>
