<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>WC Corporate Editor Pro - TipTap Edition</title>
    
    <!-- Librerías -->
    <script src="https://unpkg.com/@tiptap/bundle/dist/tiptap-bundle.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --blue:#1d5270; --wine:#92324f; --bg:#eef2f7; }
        body { margin:0; font-family:Segoe UI, sans-serif; background:var(--bg); height:100vh; display:flex; flex-direction:column; }
        .header { background:linear-gradient(135deg,var(--blue),var(--wine)); color:white; padding:15px; font-weight:bold; }
        .ribbon { background:#dbe4ee; padding:10px; display:flex; gap:5px; flex-wrap:wrap; border-bottom:1px solid #ccc; }
        .workspace { flex:1; padding:20px; overflow:auto; display:flex; justify-content:center; }
        
        #editor { 
            background:white; width:100%; max-width:800px; min-height:80vh; 
            padding:40px; border-radius:10px; box-shadow:0 3px 10px rgba(0,0,0,.1); 
            cursor:text; 
        }
        
        /* Estilos críticos para TipTap */
        .ProseMirror { outline:none; min-height: 100%; }
        .ProseMirror:focus { outline:none; }
        
        button { border:none; padding:8px 12px; border-radius:4px; cursor:pointer; background:white; font-size:12px; transition:0.2s; }
        button:hover { background:#eee; }
        button.is-active { background:var(--blue); color:white; font-weight:bold; }
    </style>
</head>
<body>

<div class="header">WC Corporate Editor Pro</div>

<div class="ribbon">
    <button id="btn-bold"><b>B</b></button>
    <button id="btn-italic"><i>I</i></button>
    <button id="btn-underline"><u>U</u></button>
    <button onclick="runCheck('Imagen', addImage)">🖼️ Imagen</button>
    <button onclick="runCheck('PDF', exportToPDF)">📥 PDF</button>
    <button onclick="runCheck('Voz', startVoice)">🎧 Voz</button>
    <button onclick="translateContent('bribri')">🌱 Bribri</button>
    <button onclick="translateContent('spanish')">🇪🇸 Español</button>
</div>

<div class="workspace">
    <div id="editor"></div>
</div>

<script>
    window.editor = null;

    document.addEventListener('DOMContentLoaded', () => {
        const { Editor } = Tiptap;
        const { StarterKit } = TiptapStarterKit;
        const { Underline } = TiptapUnderline;
        const { Image } = TiptapImage;

        window.editor = new Editor({
            element: document.querySelector('#editor'),
            extensions: [StarterKit, Underline, Image],
            editable: true, // Asegura que se pueda escribir
            editorProps: {
                attributes: { class: 'ProseMirror' } // Asegura la clase necesaria
            },
            content: localStorage.getItem('wc_content') ? JSON.parse(localStorage.getItem('wc_content')) : '<h2>Editor Pro</h2><p>Bienvenido Keny Chinchilla Navarro</p>',
            onUpdate: ({ editor }) => {
                localStorage.setItem('wc_content', JSON.stringify(editor.getJSON()));
            }
        });

        // Eventos
        document.getElementById('btn-bold').addEventListener('click', () => window.editor.chain().focus().toggleBold().run());
        document.getElementById('btn-italic').addEventListener('click', () => window.editor.chain().focus().toggleItalic().run());
        document.getElementById('btn-underline').addEventListener('click', () => window.editor.chain().focus().toggleUnderline().run());

        window.editor.on('transaction', () => {
            document.getElementById('btn-bold').classList.toggle('is-active', window.editor.isActive('bold'));
            document.getElementById('btn-italic').classList.toggle('is-active', window.editor.isActive('italic'));
            document.getElementById('btn-underline').classList.toggle('is-active', window.editor.isActive('underline'));
        });
    });

    // Funciones Globales
    function runCheck(name, fn) { try { fn(); } catch(e) { console.error(name, e); alert("Error en: " + name); } }

    function addImage() {
        const url = prompt('Ingresa la URL de la imagen:');
        if (url) window.editor.chain().focus().setImage({ src: url }).run();
    }

    function exportToPDF() {
        html2pdf().from(document.getElementById('editor')).save('Documento_WC.pdf');
    }

    function translateContent(mode) {
        const dict = { "agua": "diö", "tierra": "tá", "sol": "shköl", "casa": "yë" };
        let json = window.editor.getJSON();
        const process = (nodes) => nodes.map(n => {
            if (n.text) {
                let txt = n.text;
                Object.keys(dict).forEach(k => {
                    const reg = new RegExp(`\\b${mode === 'bribri' ? k : dict[k]}\\b`, 'gi');
                    txt = txt.replace(reg, mode === 'bribri' ? dict[k] : k);
                });
                return { ...n, text: txt };
            }
            return n.content ? { ...n, content: process(n.content) } : n;
        });
        window.editor.commands.setContent({ ...json, content: process(json.content) });
    }

    function startVoice() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Rec) { alert("Tu navegador no soporta voz."); return; }
        const r = new Rec();
        r.lang = 'es-CR';
        r.onresult = (e) => window.editor.chain().focus().insertContent(' ' + e.results[0][0].transcript).run();
        r.start();
    }
</script>

</body>
</html>
