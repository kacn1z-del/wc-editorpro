<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WC Editor PRO 🇨🇷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Arial,sans-serif;background:#f3f2f1;height:100vh;overflow:hidden}
#backstage{display:flex;height:100vh;background:white}
#editor-view{display:none;height:100vh;flex-direction:column}
:root{--azul:#002B7F;--rojo:#CE1126;--dorado:#FFD700;--verde:#006847}
.backstage-nav{width:280px;background:var(--azul);color:white;display:flex;flex-direction:column;overflow-y:auto}
.backstage-nav-header{padding:16px;display:flex;align-items:center;gap:12px;background:var(--rojo);position:sticky;top:0}
.back-btn{width:32px;height:32px;border:2px solid white;border-radius:50%;background:none;color:white;cursor:pointer;font-size:18px}
.nav-item{padding:12px 20px;cursor:pointer;font-size:14px;border:none;background:none;color:white;text-align:left;width:100%;display:flex;align-items:center;gap:12px}
.nav-item:active{background:rgba(255,255,255,0.2)}
.nav-item.active{background:#001F5C;border-left:3px solid var(--dorado)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-separator{height:1px;background:rgba(255,255,255,0.2);margin:8px 16px}
.backstage-content{flex:1;padding:24px;overflow-y:auto;background:#faf9f8}
.backstage-title{font-size:32px;font-weight:300;color:var(--azul);margin-bottom:20px}
.templates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:32px}
.template-card{cursor:pointer;border:1px solid #e1dfdd;background:white;transition:all 0.2s}
.template-card:active{border-color:var(--azul);box-shadow:0 0 0 2px var(--azul);transform:scale(0.98)}
.template-name{padding:10px 8px;font-size:11px;text-align:center;background:#faf9f8;font-weight:600;color:var(--azul)}
.docs-lista{margin-top:32px;border-top:2px solid var(--rojo);padding-top:24px}
.docs-lista h3{font-size:18px;margin-bottom:16px;color:var(--azul)}
.doc-item{padding:12px;border:1px solid #e1dfdd;margin-bottom:8px;cursor:pointer;background:white;display:flex;justify-content:space-between;align-items:center}
.doc-item:active{background:#f3f2f1}
.doc-item-nombre{font-weight:600;font-size:14px;color:var(--azul)}
.doc-item-fecha{font-size:11px;color:#605e5c}
.doc-item-borrar{background:var(--rojo);color:white;border:none;padding:4px 8px;border-radius:3px;font-size:11px;cursor:pointer}
.title-bar{background:var(--azul);color:white;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;font-size:14px}
.title-bar-icons{display:flex;gap:12px}
.title-bar-icons span{cursor:pointer;padding:4px;font-size:18px}
.title-bar-icons span:active{background:rgba(255,255,255,0.3);border-radius:3px}
.ribbon-tabs{background:#f3f2f1;border-bottom:1px solid #d2d0ce;display:flex;padding:0 12px;overflow-x:auto}
.ribbon-tab{padding:8px 14px;cursor:pointer;border:none;background:none;font-size:14px;color:#323130;white-space:nowrap}
.ribbon-tab.active{background:white;border:1px solid #d2d0ce;border-bottom:1px solid white;margin-bottom:-1px;color:var(--azul);font-weight:600}
.ribbon-toolbar{background:white;border-bottom:1px solid #d2d0ce;padding:8px 12px;display:none;gap:8px;align-items:center;flex-wrap:wrap;overflow-x:auto}
.ribbon-toolbar.active{display:flex}
.tool-group{display:flex;flex-direction:column;border-right:1px solid #e1dfdd;padding-right:8px;margin-right:8px}
.tool-group-title{font-size:10px;color:#605e5c;text-align:center;margin-top:2px}
.tool-buttons{display:flex;gap:4px;align-items:center}
.ribbon-toolbar button,.ribbon-toolbar select,.ribbon-toolbar input{border:1px solid #ccc;padding:6px 10px;border-radius:3px;cursor:pointer;font-size:14px;height:36px;min-width:36px}
.ribbon-toolbar button{background:white}
.ribbon-toolbar button:active{background:#e1dfdd;border-color:var(--azul)}
.ribbon-toolbar input[type="color"]{width:36px;padding:2px}
.main-editor-area{flex:1;background:#e6e6e6;overflow-y:auto;padding:16px;display:flex;flex-direction:column;align-items:center}
#editor{width:100%;max-width:816px;min-height:600px;background:white;box-shadow:0 0 8px rgba(0,0,0,0.15);padding:40px;outline:none;font-size:16px;line-height:1.5;-webkit-user-select:text;user-select:text}
#editor img{max-width:100%;height:auto}
#editor table{border-collapse:collapse;width:100%;margin:10px 0}
#editor table td,#editor table th{border:1px solid #ccc;padding:8px}
#editor h1{color:var(--azul);margin-top:24px;margin-bottom:12px;font-size:28px}
#editor h2{color:var(--azul);margin-top:20px;margin-bottom:10px;font-size:22px;border-bottom:2px solid var(--azul);padding-bottom:4px}
#editor strong{font-weight:bold}
#editor em{font-style:italic}
#editor u{text-decoration:underline}
#editor ul,#editor ol{margin:10px 0 10px 30px}
#editor mark{background:yellow}
.status-bar{background:var(--azul);color:white;border-top:1px solid #001F5C;padding:4px 12px;font-size:12px;display:flex;justify-content:space-between}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:white;padding:20px;border-radius:8px;max-width:90%;width:400px}
.modal-content h3{margin-bottom:12px;color:var(--azul)}
.modal-content input{width:100%;padding:8px;margin-bottom:12px;border:1px solid #ccc;border-radius:3px}
.modal-buttons{display:flex;gap:8px;justify-content:flex-end}
.modal-buttons button{padding:8px 16px;border:none;border-radius:3px;cursor:pointer}
.modal-btn-ok{background:var(--azul);color:white}
.modal-btn-cancel{background:#ccc}
</style>
</head>
<body>
<div id="backstage">
<div class="backstage-nav">
<div class="backstage-nav-header">
<button class="back-btn" id="btnCerrarBackstage">←</button>
<span style="font-weight:600">Archivo</span>
</div>
<button class="nav-item active" id="btnNuevo"><span class="nav-icon">📄</span>Nuevo</button>
<button class="nav-item" id="btnAbrir"><span class="nav-icon">📂</span>Abrir</button>
<div class="nav-separator"></div>
<button class="nav-item" id="btnGuardar"><span class="nav-icon">💾</span>Guardar</button>
<button class="nav-item" id="btnGuardarComo"><span class="nav-icon">💾</span>Guardar como</button>
<button class="nav-item" id="btnNube"><span class="nav-icon">☁️</span>Guardar en Nube</button>
<div class="nav-separator"></div>
<button class="nav-item" id="btnDeshacer"><span class="nav-icon">↶</span>Deshacer</button>
<button class="nav-item" id="btnRehacer"><span class="nav-icon">↷</span>Rehacer</button>
<div class="nav-separator"></div>
<button class="nav-item" id="btnImprimir"><span class="nav-icon">🖨️</span>Imprimir</button>
</div>
<div class="backstage-content">
<div id="vistaNuevo">
<h1 class="backstage-title">Nuevo</h1>
<div class="templates-grid">
<div class="template-card" data-plantilla="blanco"><div class="template-name">Documento en blanco</div></div>
<div class="template-card" data-plantilla="ensayo"><div class="template-name">Ensayo Universitario</div></div>
<div class="template-card" data-plantilla="bribri"><div class="template-name">Diccionario Bribri</div></div>
</div>
</div>
<div id="vistaAbrir" style="display:none">
<h1 class="backstage-title">Abrir</h1>
<div class="docs-lista">
<h3>Documentos guardados</h3>
<div id="listaDocs"></div>
</div>
</div>
</div>
</div>
<div id="editor-view">
<div class="title-bar">
<div class="title-bar-icons">
<span id="btnArchivo">📄</span>
<span id="btnGuardarTop">💾</span>
<span id="btnDeshacerTop">↶</span>
<span id="btnRehacerTop">↷</span>
</div>
<div id="nombreDoc">Documento1</div>
<div>WC Editor PRO 🇨🇷</div>
</div>
<div class="ribbon-tabs">
<button class="ribbon-tab" id="tabArchivo">Archivo</button>
<button class="ribbon-tab active" data-tab="inicio">Inicio</button>
<button class="ribbon-tab" data-tab="insertar">Insertar</button>
<button class="ribbon-tab" data-tab="revisar">Revisar</button>
</div>
<div class="ribbon-toolbar active" id="tab-inicio">
<div class="tool-group">
<div class="tool-buttons">
<button id="btnCopiar">📋</button>
<button id="btnPegar">📄</button>
</div>
<div class="tool-group-title">Portapapeles</div>
</div>
<div class="tool-group">
<div class="tool-buttons">
<button id="btnBold"><b>B</b></button>
<button id="btnItalic"><i>I</i></button>
<button id="btnUnderline"><u>U</u></button>
<input type="color" id="colorTexto" value="#000000" title="Color texto">
<input type="color" id="colorResaltar" value="#FFFF00" title="Resaltar">
</div>
<div class="tool-group-title">Fuente</div>
</div>
<div class="tool-group">
<div class="tool-buttons">
<select id="selectFuente">
<option value="Calibri">Calibri</option>
<option value="Arial">Arial</option>
<option value="Times New Roman">Times</option>
</select>
<select id="selectTamano">
<option value="2">10</option>
<option value="3" selected>11</option>
<option value="4">12</option>
<option value="5">14</option>
<option value="6">18</option>
</select>
</div>
<div class="tool-group-title">Fuente</div>
</div>
<div class="tool-group">
<div class="tool-buttons">
<button id="btnUL">≡</button>
<button id="btnOL">1≡</button>
<button id="btnLeft">⬅️</button>
<button id="btnCenter">↔️</button>
<button id="btnRight">➡️</button>
</div>
<div class="tool-group-title">Párrafo</div>
</div>
</div>
<div class="ribbon-toolbar" id="tab-insertar">
<div class="tool-group">
<div class="tool-buttons">
<button id="btnImagen">🖼️ Imagen</button>
<button id="btnTabla">📊 Tabla</button>
</div>
<div class="tool-group-title">Insertar</div>
</div>
</div>
<div class="ribbon-toolbar" id="tab-revisar">
<div class="tool-group">
<div class="tool-buttons">
<button id="btnBuscar">🔍 Buscar</button>
<button id="btnBribri">🌿 Bribri</button>
</div>
<div class="tool-group-title">Revisar</div>
</div>
</div>
<div class="main-editor-area">
<div id="editor" contenteditable="true"></div>
</div>
<div class="status-bar">
<span id="contadorPalabras">Palabras: 0</span>
<span>Costa Rica 🇨🇷</span>
</div>
</div>
<div class="modal" id="modalBuscar">
<div class="modal-content">
<h3>Buscar en documento</h3>
<input type="text" id="inputBuscar" placeholder="Escribí la palabra...">
<div class="modal-buttons">
<button class="modal-btn-cancel" onclick="cerrarModal('modalBuscar')">Cancelar</button>
<button class="modal-btn-ok" onclick="ejecutarBuscar()">Buscar</button>
</div>
</div>
</div>
<div class="modal" id="modalBribri">
<div class="modal-content">
<h3>🌿 Diccionario Bribri - Español</h3>
<input type="text" id="inputBribri" placeholder="Escribí en español o bribri...">
<div id="resultadoBribri" style="margin:12px 0;padding:8px;background:#f0f0f0;min-height:40px;border-radius:3px"></div>
<div class="modal-buttons">
<button class="modal-btn-cancel" onclick="cerrarModal('modalBribri')">Cerrar</button>
<button class="modal-btn-ok" onclick="traducirBribri()">Traducir</button>
</div>
</div>
</div>
<input type="file" id="inputImagen" accept="image/*" style="display:none">
<script>
var undoStack=[];
var redoStack=[];
var portapapeles='';
var dicBribri={'hola':'i shka','agua':'di´','casa':'u','árbol':'kàl','sol':'dí','luna':'si´wa','fuego':'bök','comida':'chkè','gracias':'wëstela','adiós':'i shkëna','persona':'se´','niño':'alà','mujer':'aláköl','hombre':'wëm','montaña':'ká','río':'di´wo','cielo':'káñí','tierra':'irìria'};
var plantillas={blanco:'<p>Escribí aquí...</p>',ensayo:'<h1 style="text-align:center;color:#002B7F;">El Ejercicio y la Salud Mental</h1><h2>Introducción</h2><p>El presente ensayo analiza el vínculo entre el ejercicio físico y la salud mental...</p>',bribri:'<h1 style="text-align:center;color:#006847;">🌿 Diccionario Bribri - Español</h1><table><tr><th>Bribri</th><th>Español</th></tr><tr><td>i shka</td><td>Hola</td></tr><tr><td>di´</td><td>Agua</td></tr><tr><td>u</td><td>Casa</td></tr></table>'};
function guardarEstado(){var e=document.getElementById('editor');undoStack.push(e.innerHTML);if(undoStack.length>50)undoStack.shift();redoStack=[]}
function deshacer(){if(undoStack.length>0){var e=document.getElementById('editor');redoStack.push(e.innerHTML);e.innerHTML=undoStack.pop();actualizarContador()}}
function rehacer(){if(redoStack.length>0){var e=document.getElementById('editor');undoStack.push(e.innerHTML);e.innerHTML=redoStack.pop();actualizarContador()}}
function cerrarBackstage(){document.getElementById('backstage').style.display='none';document.getElementById('editor-view').style.display='flex';document.getElementById('editor').focus()}
function abrirBackstage(){document.getElementById('backstage').style.display='flex';document.getElementById('editor-view').style.display='none'}
function mostrarNuevo(){document.getElementById('vistaNuevo').style.display='block';document.getElementById('vistaAbrir').style.display='none';document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active')});document.getElementById('btnNuevo').classList.add('active')}
function mostrarAbrir(){document.getElementById('vistaNuevo').style.display='none';document.getElementById('vistaAbrir').style.display='block';document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active')});document.getElementById('btnAbrir').classList.add('active');cargarDocumentos()}
function abrirEditor(tipo){document.getElementById('backstage').style.display='none';document.getElementById('editor-view').style.display='flex';document.getElementById('editor').innerHTML=plantillas||'<p>Escribí aquí...</p>';document.getElementById('nombreDoc').innerText=tipo||'Documento1';guardarEstado();setTimeout(function(){document.getElementById('editor').focus();actualizarContador()},100)}
function guardar(){var n=document.getElementById('nombreDoc').innerText;var c=document.getElementById('editor').innerHTML;var d=JSON.parse(localStorage.getItem('wc_docs')||'{}');d[n]={contenido:c,fecha:new Date().toLocaleString('es-CR')};localStorage.setItem('wc_docs',JSON.stringify(d));alert('✅ Guardado: '+n)}
function guardarComo(){var nv=document.getElementById('nombreDoc').innerText;var nn=prompt('Nombre del documento:',nv);if(nn&&nn.trim()!==''){document.getElementById('nombreDoc').innerText=nn.trim();var c=document.getElementById('editor').innerHTML;var d=JSON.parse(localStorage.getItem('wc_docs')||'{}');d[nn.trim()]={contenido:c,fecha:new Date().toLocaleString('es-CR')};localStorage.setItem('wc_docs',JSON.stringify(d));alert('✅ Guardado como: '+nn.trim())}}
function guardarNube(){var n=document.getElementById('nombreDoc').innerText;var c=document.getElementById('editor').innerHTML;var b=new Blob([c],{type:'text/html'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=n+'.html';a.click();alert('☁️ Descargado para subir a Drive/Dropbox: '+n+'.html')}
function cargarDocumentos(){var l=document.getElementById('listaDocs');var d=JSON.parse(localStorage.getItem('wc_docs')||'{}');l.innerHTML='';Object.keys(d).forEach(function(n){var div=document.createElement('div');div.className='doc-item';div.innerHTML='<div><div class="doc-item-nombre">'+n+'</div><div class="doc-item-fecha">'+d[n].fecha+'</div></div><button class="doc-item-borrar">Borrar</button>';div.onclick=function(e){if(e.target.className!=='doc-item-borrar'){document.getElementById('nombreDoc').innerText=n;document.getElementById('editor').innerHTML=d[n].contenido;cerrarBackstage()}else{delete d[n];localStorage.setItem('wc_docs',JSON.stringify(d));cargarDocumentos()}};l.appendChild(div)})}
function copiar(){var s=window.getSelection();if(s.rangeCount>0){portapapeles=s.toString();alert('📋 Copiado: '+portapapeles.substring(0,30)+'...')}}
function pegar(){if(portapapeles){guardarEstado();document.execCommand('insertText',false,portapapeles);actualizarContador()}else{alert('Portapapeles vacío')}}
function aplicarFormato(t){var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);if(r.collapsed)return;var e=document.createElement(t);e.appendChild(r.extractContents());r.insertNode(e);actualizarContador()}
function aplicarColor(){var c=document.getElementById('colorTexto').value;var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);if(r.collapsed)return;var sp=document.createElement('span');sp.style.color=c;sp.appendChild(r.extractContents());r.insertNode(sp);actualizarContador()}
function aplicarResaltar(){var c=document.getElementById('colorResaltar').value;var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);if(r.collapsed)return;var m=document.createElement('mark');m.style.backgroundColor=c;m.appendChild(r.extractContents());r.insertNode(m);actualizarContador()}
function insertarLista(o){var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);var t=o?'ol':'ul';var l=document.createElement(t);var i=document.createElement('li');i.innerHTML=r.toString()||'&nbsp;';l.appendChild(i);r.deleteContents();r.insertNode(l);actualizarContador()}
function alinear(a){var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);var n=r.commonAncestorContainer;while(n&&n.nodeType!==1){n=n.parentNode}while(n&&n.tagName!=='P'&&n.tagName!=='DIV'&&n.tagName!=='H1'&&n.tagName!=='H2'){n=n.parentNode}if(n&&n!==document.getElementById('editor')){n.style.textAlign=a}else{var d=document.createElement('div');d.style.textAlign=a;d.appendChild(r.extractContents());r.insertNode(d)}actualizarContador()}
function insertarImagen(){document.getElementById('inputImagen').click()}
function cargarImagen(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){guardarEstado();var i=document.createElement('img');i.src=e.target.result;i.style.maxWidth='100%';var ed=document.getElementById('editor');ed.focus();var s=window.getSelection();if(s.rangeCount){var rg=s.getRangeAt(0);rg.insertNode(i);rg.setStartAfter(i);rg.collapse(true);s.removeAllRanges();s.addRange(rg)}actualizarContador()};r.readAsDataURL(f)}
function insertarTabla(){guardarEstado();var h='<table>';for(var i=0;i<3;i++){h+='<tr>';for(var j=0;j<3;j++){h+='<td>&nbsp;</td>'}h+='</tr>'}h+='</table><p><br></p>';var ed=document.getElementById('editor');ed.focus();var s=window.getSelection();if(s.rangeCount){var r=s.getRangeAt(0);var d=document.createElement('div');d.innerHTML=h;r.insertNode(d.firstChild)}actualizarContador()}
function abrirModal(id){document.getElementById(id).classList.add('active')}
function cerrarModal(id){document.getElementById(id).classList.remove('active')}
function ejecutarBuscar(){var t=document.getElementById('inputBuscar').value;if(!t)return;var e=document.getElementById('editor');var h=e.innerHTML;var r=new RegExp(t,'gi');var c=(h.match(r)||[]).length;e.innerHTML=h.replace(r,'<mark>$&</mark>');cerrarModal('modalBuscar');alert('🔍 Encontradas: '+c+' coincidencias');setTimeout(function(){e.innerHTML=e.innerHTML.replace(/<mark>/g,'').replace(/<\/mark>/g,'')},3000)}
function traducirBribri(){var t=document.getElementById('inputBribri').value.toLowerCase().trim();var r='';for(var k in dicBribri){if(k===t){r='Bribri: '+dicBribri[k]}if(dicBribri[k]===t){r='Español: '+k}}if(!r)r='No encontrado. Probá: hola, agua, casa, árbol';document.getElementById('resultadoBribri').innerText=r}
function actualizarContador(){var t=document.getElementById('editor').innerText||'';var p=t.trim().split(/\s+/).filter(function(p){return p.length>0}).length;document.getElementById('contadorPalabras').innerText='Palabras: '+p}
function cambiarTab(t){document.querySelectorAll('.ribbon-tab').forEach(function(el){el.classList.remove('active')});document.querySelectorAll('.ribbon-toolbar').forEach(function(el){el.classList.remove('active')});document.querySelector('[data-tab="'+t+'"]').classList.add('active');document.getElementById('tab-'+t).classList.add('active')}
function aplicarFuente(){var f=document.getElementById('selectFuente').value;var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);if(r.collapsed)return;var sp=document.createElement('span');sp.style.fontFamily=f;sp.appendChild(r.extractContents());r.insertNode(sp);actualizarContador()}
function aplicarTamano(){var t=document.getElementById('selectTamano').value;var s=window.getSelection();if(!s.rangeCount)return;guardarEstado();var r=s.getRangeAt(0);if(r.collapsed)return;var f=document.createElement('font');f.size=t;f.appendChild(r.extractContents());r.insertNode(f);actualizarContador()}
function conectar(id,fn){var el=document.getElementById(id);if(el){el.addEventListener('click',fn);el.addEventListener('touchstart',fn)}}
window.onload=function(){
conectar('btnCerrarBackstage',cerrarBackstage);
conectar('btnNuevo',mostrarNuevo);
conectar('btnAbrir',mostrarAbrir);
conectar('btnGuardar',guardar);
conectar('btnGuardarComo',guardarComo);
conectar('btnNube',guardarNube);
conectar('btnDeshacer',deshacer);
conectar('btnRehacer',rehacer);
conectar('btnImprimir',function(){window.print()});
conectar('btnArchivo',abrirBackstage);
conectar('btnGuardarTop',guardar);
conectar('btnDeshacerTop',deshacer);
conectar('btnRehacerTop',rehacer);
conectar('btnCopiar',copiar);
conectar('btnPegar',pegar);
conectar('btnBold',function(){aplicarFormato('strong')});
conectar('btnItalic',function(){aplicarFormato('em')});
conectar('btnUnderline',function(){aplicarFormato('u')});
conectar('btnUL',function(){insertarLista(false)});
conectar('btnOL',function(){insertarLista(true)});
conectar('btnLeft',function(){alinear('left')});
conectar('btnCenter',function(){alinear('center')});
conectar('btnRight',function(){alinear('right')});
conectar('btnImagen',insertarImagen);
